<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1735"/>
      <stop offset=".55" stop-color="#10182b"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#38bdf8" stroke-opacity=".14"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".65"/>
    </filter>
    
    <!-- New Glow Filter for the Icon -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Main Background and Grid -->
  <rect width="800" height="600" rx="34" fill="url(#bg)"/>
  <rect width="800" height="600" rx="34" fill="url(#grid)"/>
  <circle cx="110" cy="110" r="140" fill="#38bdf8" opacity=".08"/>
  <circle cx="700" cy="480" r="180" fill="#6366f1" opacity=".09"/>
  <path d="M0 475 Q250 400 430 505 T800 470 V600 H0Z" fill="url(#shine)" opacity=".09"/>

  <!-- ================= LUXURY CENTRAL ICON (Replaces the Screen) ================= -->
  <g filter="url(#shadow)" transform="translate(400, 260)">
    
    <!-- Outer Glow Circle of the Icon -->
    <circle cx="0" cy="0" r="140" fill="#0a1327" stroke="#38bdf8" stroke-width="3" stroke-opacity=".8"/>
    <circle cx="0" cy="0" r="125" fill="#111d37" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,6" opacity=".6"/>

    <!-- NEW ICON DESIGN: Hourglass & Temporal Rings (Age Calculator) -->
    <g filter="url(#iconGlow)">
      <!-- External Temporal/Date Rings -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="15,40" opacity=".5"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="40,20" opacity=".3"/>

      <!-- Inner Rotating Scale Marks -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="2, 18" opacity=".7"/>

      <!-- CENTER ICON: Advanced Futuristic Hourglass -->
      <path d="M-35,-60 L35,-60 L35,-50 Q20,-20 0,0 Q20,20 35,50 L35,60 L-35,60 L-35,50 Q-20,20 0,0 Q-20,-20 -35,-50 Z" 
            fill="#061024" fill-opacity="0.8" stroke="url(#shine)" stroke-width="4" stroke-linejoin="round"/>
      
      <!-- Hourglass Sand/Energy and Time Points -->
      <path d="M-22,-45 L22,-45 Q15,-18 0,0 Q-15,-18 -22,-45 Z" fill="#38bdf8" opacity=".6"/>
      <path d="M-28,48 L28,48 Q20,22 0,0 Q-20,22 -28,48 Z" fill="url(#shine)"/>
      <line x1="0" y1="-8" x2="0" y2="18" stroke="#ffffff" stroke-width="3" stroke-dasharray="4,4"/>

      <!-- Floating Digital Time Elements -->
      <g transform="translate(-75, -50)">
        <rect x="0" y="0" width="30" height="30" rx="8" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8"/>
        <text x="15" y="19" text-anchor="middle" font-size="10" font-weight="bold" fill="#38bdf8">YEAR</text>
      </g>
      <g transform="translate(45, 20)">
        <rect x="0" y="0" width="30" height="30" rx="8" fill="#6366f1" fill-opacity="0.3" stroke="#6366f1"/>
        <text x="15" y="19" text-anchor="middle" font-size="10" font-weight="bold" fill="#6366f1">DAYS</text>
      </g>
    </g>

  </g>

  <!-- ================= TOP BADGE AND BOTTOM PANEL ================= -->
  <g>
    <rect x="28" y="24" width="220" height="38" rx="19" fill="#07111f" stroke="#38bdf8" stroke-opacity=".7"/>
    <circle cx="49" cy="43" r="6" fill="#38bdf8"/>
    <text x="64" y="49" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#d7e8ff">TECHNOMADS / CALCULATOR</text>
    
    <rect x="28" y="488" width="744" height="84" rx="22" fill="#08111f" fill-opacity=".92" stroke="#38bdf8" stroke-opacity=".55"/>
    <rect x="48" y="506" width="48" height="48" rx="14" fill="url(#shine)"/>
    <text x="72" y="540" text-anchor="middle" font-size="29" font-weight="700" fill="#061324" font-family="Arial,sans-serif">＋</text>
    <text x="115" y="524" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f7ff">حاسبة العمر - الإصدار الثاني</text>
    <text x="115" y="549" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#38bdf8">AGE-CALCULATOR-APP-V2</text>
    <rect x="695" y="515" width="54" height="34" rx="17" fill="#38bdf8" fill-opacity=".18" stroke="#38bdf8"/>
    <text x="722" y="537" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#e7f7ff">01</text>
  </g>
</svg>
