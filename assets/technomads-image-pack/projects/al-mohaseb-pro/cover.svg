<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#251b09"/>
      <stop offset=".55" stop-color="#10182b"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    
    <!-- Pattern -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#fbbf24" stroke-opacity=".14"/>
    </pattern>
    
    <!-- Filters -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".65"/>
    </filter>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="34" fill="url(#bg)"/>
  <rect width="800" height="600" rx="34" fill="url(#grid)"/>
  <circle cx="110" cy="110" r="140" fill="#fbbf24" opacity=".08"/>
  <circle cx="700" cy="480" r="180" fill="#d97706" opacity=".09"/>
  <path d="M0 475 Q250 400 430 505 T800 470 V600 H0Z" fill="url(#shine)" opacity=".09"/>

  <!-- ================= LUXURY CENTRAL ICON (Finance & Accounting) ================= -->
  <g filter="url(#shadow)" transform="translate(400, 260)">
    
    <!-- Outer Glow Circle of the Icon -->
    <circle cx="0" cy="0" r="140" fill="#0a1327" stroke="#fbbf24" stroke-width="3" stroke-opacity=".8"/>
    <circle cx="0" cy="0" r="125" fill="#111d37" stroke="#d97706" stroke-width="2" stroke-dasharray="6,6" opacity=".6"/>

    <!-- ICON DESIGN: Golden Finance Shield, Coin & Growth Chart -->
    <g filter="url(#iconGlow)">
      <!-- External Financial Analytics Rings -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="15,40" opacity=".5"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="40,20" opacity=".3"/>

      <!-- Inner Rotating Scale -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="2, 18" opacity=".7"/>

      <!-- Center Coin / Shield Backdrop -->
      <circle cx="0" cy="0" r="50" fill="#10182b" stroke="url(#shine)" stroke-width="4"/>
      
      <!-- Growth Arrow & Financial Chart Bars -->
      <rect x="-24" y="8" width="10" height="22" rx="3" fill="#d97706"/>
      <rect x="-9" y="-4" width="10" height="34" rx="3" fill="#fbbf24"/>
      <rect x="6" y="-18" width="10" height="48" rx="3" fill="url(#shine)"/>
      <rect x="21" y="-28" width="10" height="58" rx="3" fill="#ffffff"/>

      <!-- Upward Growth Line with Arrow -->
      <path d="M -30 18 L -12 2 L 4 -12 L 28 -34" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
      <polygon points="28,-42 34,-30 20,-32" fill="#fbbf24"/>

      <!-- Floating Currency & Accounting Badges -->
      <g transform="translate(-80, -45)">
        <rect x="0" y="0" width="36" height="28" rx="8" fill="#fbbf24" fill-opacity="0.25" stroke="#fbbf24"/>
        <text x="18" y="19" text-anchor="middle" font-size="14" font-weight="bold" fill="#fbbf24">$</text>
      </g>
      <g transform="translate(48, 20)">
        <rect x="0" y="0" width="38" height="28" rx="8" fill="#d97706" fill-opacity="0.25" stroke="#d97706"/>
        <text x="19" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#fbbf24">PRO</text>
      </g>
    </g>

  </g>

  <!-- ================= TOP BADGE AND BOTTOM PANEL ================= -->
  <g>
    <!-- Upper Badge -->
    <rect x="28" y="24" width="210" height="38" rx="19" fill="#07111f" stroke="#fbbf24" stroke-opacity=".7"/>
    <circle cx="49" cy="43" r="6" fill="#fbbf24"/>
    <text x="64" y="49" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#d7e8ff">TECHNOMADS / FINANCE</text>
    
    <!-- Bottom Panel -->
    <rect x="28" y="488" width="744" height="84" rx="22" fill="#08111f" fill-opacity=".92" stroke="#fbbf24" stroke-opacity=".55"/>
    <rect x="48" y="506" width="48" height="48" rx="14" fill="url(#shine)"/>
    <text x="72" y="540" text-anchor="middle" font-size="29" font-weight="700" fill="#061324" font-family="Arial,sans-serif">▤</text>
    <text x="115" y="524" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f7ff">المحاسب برو — al-mohaseb-pro</text>
    <text x="115" y="549" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#fbbf24">AL-MOHASEB-PRO</text>
    
    <!-- Version Tag -->
    <rect x="695" y="515" width="54" height="34" rx="17" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24"/>
    <text x="722" y="537" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#e7f7ff">01</text>
  </g>
</svg>
