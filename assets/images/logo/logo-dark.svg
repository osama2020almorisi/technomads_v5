<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">TechNomads — Technology Innovation</title>
<desc id="desc">A modern cyan, blue and green symbol combining a computer, smartphone, wireless connectivity and digital network circuits. No triangle.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182B"/><stop offset="1" stop-color="#030914"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168BFF"/><stop offset=".48" stop-color="#00E5FF"/><stop offset="1" stop-color="#00D68F"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102D4A"/><stop offset="1" stop-color="#061222"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bg)" stroke="#123B56" stroke-width="3"/>
<circle cx="246" cy="245" r="174" fill="none" stroke="#0A4564" stroke-width="2" opacity=".6"/>
<path d="M75 319 C25 260 85 188 151 177 M352 350 C431 331 459 272 432 220" fill="none" stroke="url(#neon)" stroke-width="8" stroke-linecap="round" opacity=".9"/>
<!-- computer -->
<g filter="url(#glow)" stroke-linejoin="round">
 <path d="M103 178 Q103 165 117 165 H329 Q343 165 341 180 L322 315 Q320 328 307 328 H91 Q78 328 81 315 Z" fill="url(#screen)" stroke="url(#neon)" stroke-width="10"/>
 <path d="M91 328 H307 L345 351 Q352 358 338 361 H85 Q72 358 81 350 Z" fill="#0B2940" stroke="url(#neon)" stroke-width="8"/>
 <path d="M176 343 H246" stroke="#65E9F2" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- code mark -->
<g fill="none" stroke="url(#neon)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
 <path d="M169 223 L144 245 L169 267"/>
 <path d="M251 223 L276 245 L251 267"/>
 <path d="M231 213 L192 278"/>
</g>
<!-- smartphone -->
<g filter="url(#glow)">
 <rect x="333" y="220" width="82" height="153" rx="17" fill="#071726" stroke="url(#neon)" stroke-width="8"/>
 <rect x="344" y="239" width="60" height="105" rx="6" fill="url(#screen)"/>
 <path d="M360 253 l-9 10 9 10 M385 253 l9 10 -9 10 M379 249 l-13 29" fill="none" stroke="#35DDF3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 <circle cx="374" cy="357" r="4" fill="#00D68F"/>
</g>
<!-- wireless signal -->
<g fill="none" stroke="url(#neon)" stroke-width="9" stroke-linecap="round" filter="url(#glow)">
 <path d="M177 126 Q225 84 273 126"/>
 <path d="M195 146 Q225 120 255 146"/>
 <path d="M213 164 Q225 154 237 164"/>
</g>
<circle cx="225" cy="178" r="6" fill="#00E5FF"/>
<!-- connected nodes -->
<g fill="#07182B" stroke="url(#neon)" stroke-width="6">
 <circle cx="92" cy="128" r="11"/><circle cx="67" cy="162" r="8"/><circle cx="431" cy="168" r="10"/><circle cx="449" cy="198" r="7"/>
</g>
<g fill="none" stroke="url(#neon)" stroke-width="5" stroke-linecap="round"><path d="M102 136 L130 150 L145 150"/><path d="M75 157 L91 143"/><path d="M410 179 L431 168 L442 184"/></g>
<!-- small innovation spark -->
<path d="M390 105 l6 17 17 6 -17 6 -6 17 -6 -17 -17 -6 17 -6z" fill="#00D6A0" opacity=".95"/>
</svg>