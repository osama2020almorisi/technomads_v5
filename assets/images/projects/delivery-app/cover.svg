<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#251b09"/>
      <stop offset=".55" stop-color="#10182b"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity=".3"/>
    </linearGradient>
    
    <linearGradient id="goldShine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbbf24"/>
      <stop offset=".5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>

    <!-- Pattern -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#fbbf24" stroke-opacity=".14"/>
    </pattern>

    <!-- Filters -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000" flood-opacity=".8"/>
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="800" height="600" rx="34" fill="url(#bg)"/>
  <rect width="800" height="600" rx="34" fill="url(#grid)"/>
  
  <!-- Ambient Light -->
  <circle cx="400" cy="250" r="200" fill="#fbbf24" opacity=".08" filter="url(#goldGlow)"/>
  <path d="M0 475 Q250 400 430 505 T800 470 V600 H0Z" fill="url(#goldShine)" opacity=".09"/>

  <!-- ================= LARGE CLEAR 3D DELIVERY ICON ================= -->
  <g filter="url(#shadow)" transform="translate(400, 240)">
    <g filter="url(#goldGlow)" transform="scale(2.1)">
      
      <!-- 3D Delivery Parcel/Box Base (Isometric View) -->
      <!-- Top Flaps -->
      <polygon points="0,-42 42,-21 0,0 -42,-21" fill="#fbbf24" opacity="0.95"/>
      <polygon points="0,0 20,-10 0,-20 -20,-10" fill="#f59e0b" opacity="0.9"/>
      
      <!-- Right Side Face -->
      <polygon points="0,0 42,-21 42,25 0,46" fill="url(#goldShine)"/>
      
      <!-- Left Side Face -->
      <polygon points="0,0 -42,-21 -42,25 0,46" fill="#d97706" opacity="0.95"/>

      <!-- Location Pin & Arrow Overlay -->
      <g transform="translate(0, -18)">
        <!-- Location Pin Base -->
        <path d="M0,-35 C-12,-35 -20,-25 -20,-12 C-20,6 0,22 0,22 C0,22 20,6 20,-12 C20,-25 12,-35 0,-35 Z" fill="#07111f" stroke="#fbbf24" stroke-width="2.5"/>
        <circle cx="0" cy="-14" r="6" fill="#fbbf24"/>
      </g>

      <!-- Speed Motion Trails -->
      <path d="M -50,15 L -65,15 M -45,28 L -60,28 M -48,-5 L -68,-5" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    </g>

    <!-- Badges Flanking the Large Icon -->
    <g transform="translate(-150, -95)" filter="url(#goldGlow)">
      <rect x="0" y="0" width="56" height="28" rx="8" fill="#07111f" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="28" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">FAST</text>
    </g>

    <g transform="translate(95, 80)" filter="url(#goldGlow)">
      <rect x="0" y="0" width="56" height="28" rx="8" fill="#07111f" stroke="#d97706" stroke-width="1.5"/>
      <text x="28" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">GPS</text>
    </g>
  </g>

  <!-- ================= TOP BADGE AND BOTTOM PANEL ================= -->
  <g>
    <!-- Upper Badge -->
    <rect x="28" y="24" width="220" height="38" rx="19" fill="#07111f" stroke="#fbbf24" stroke-opacity=".7"/>
    <circle cx="49" cy="43" r="6" fill="#fbbf24" filter="url(#goldGlow)"/>
    <text x="64" y="49" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#d7e8ff">TECHNOMADS / MEDICAL</text>
    
    <!-- Bottom Panel -->
    <rect x="28" y="488" width="744" height="84" rx="22" fill="#08111f" fill-opacity=".92" stroke="#fbbf24" stroke-opacity=".55"/>
    <rect x="48" y="506" width="48" height="48" rx="14" fill="url(#goldShine)" filter="url(#goldGlow)"/>
    <text x="72" y="540" text-anchor="middle" font-size="29" font-weight="700" fill="#061324" font-family="Arial,sans-serif">✈</text>
    <text x="115" y="524" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f7ff">تطبيق التوصيل الذكي</text>
    <text x="115" y="549" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#fbbf24">DELIVERY-APP</text>
    
    <!-- Version Tag -->
    <rect x="695" y="515" width="54" height="34" rx="17" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24"/>
    <text x="722" y="537" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#e7f7ff">01</text>
  </g>
</svg>
