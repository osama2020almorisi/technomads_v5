<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">TechNomads — Ultimate Cybernetic Logo</title>
<desc id="desc">An ultra-modern, high-tech logo featuring holographic screens, cyan-emerald neon circuits, 3D perspective grids, and glowing wireless nodes.</desc>
<defs>
  <!-- Background Radial Gradient -->
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#0A2C4C"/>
    <stop offset="55%" stop-color="#030E1E"/>
    <stop offset="100%" stop-color="#010408"/>
  </radialGradient>

  <!-- Core Neon Colors -->
  <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#00F7FF"/>
    <stop offset="50%" stop-color="#0088FF"/>
    <stop offset="100%" stop-color="#00FF9D"/>
  </linearGradient>

  <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00FF9D"/>
    <stop offset="50%" stop-color="#00F7FF"/>
    <stop offset="100%" stop-color="#0066FF"/>
  </linearGradient>

  <!-- Glassmorphism Glass Screens -->
  <linearGradient id="glassPanel" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0E3D6B" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#031528" stop-opacity="0.98"/>
  </linearGradient>

  <!-- Glass Reflections -->
  <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>

  <!-- Backlight Auras -->
  <radialGradient id="coreAura" cx="50%" cy="45%" r="50%">
    <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.32"/>
    <stop offset="50%" stop-color="#00FF9D" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <!-- High-Precision Glow Filters -->
  <filter id="ultraGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="9" result="blur1"/>
    <feGaussianBlur stdDeviation="3" result="blur2"/>
    <feMerge>
      <feMergeNode in="blur1"/>
      <feMergeNode in="blur2"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Outer Container Frame -->
<rect x="16" y="16" width="480" height="480" rx="84" fill="url(#bgGrad)" stroke="#113A59" stroke-width="2.5"/>

<!-- Core Lighting Backlight -->
<circle cx="240" cy="230" r="210" fill="url(#coreAura)"/>

<!-- 3D Cyber Grid Perspective (Floor) -->
<g stroke="url(#neonCyan)" stroke-width="1" opacity="0.15" fill="none">
  <path d="M 60 410 L 452 410"/>
  <path d="M 80 430 L 432 430"/>
  <path d="M 100 450 L 412 450"/>
  <!-- Perspective Ray Lines -->
  <path d="M 120 400 L 60 460"/>
  <path d="M 190 400 L 160 460"/>
  <path d="M 256 400 L 256 460"/>
  <path d="M 322 400 L 352 460"/>
  <path d="M 392 400 L 452 460"/>
</g>

<!-- Background Tech Circuits & Data Nodes -->
<g stroke="url(#neonCyan)" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round">
  <path d="M 45 190 H 110 L 145 155 H 185"/>
  <path d="M 45 320 H 105 L 135 350 H 175"/>
  <path d="M 467 190 H 402 L 367 155 H 327"/>
  <path d="M 467 320 H 407 L 377 350 H 337"/>
</g>
<g fill="#020914" stroke="url(#neonCyan)" stroke-width="2.5" opacity="0.9">
  <circle cx="45" cy="190" r="5"/>
  <circle cx="45" cy="320" r="5"/>
  <circle cx="467" cy="190" r="5"/>
  <circle cx="467" cy="320" r="5"/>
</g>

<!-- Tech Halo Ring -->
<circle cx="256" cy="256" r="182" fill="none" stroke="url(#neonCyan)" stroke-width="1.8" stroke-dasharray="10 8 4 8" opacity="0.4" filter="url(#softGlow)"/>

<!-- Computer Unit (Center Stage) -->
<g filter="url(#ultraGlow)">
  <!-- Main Display Outer Frame -->
  <rect x="118" y="142" width="228" height="150" rx="16" fill="url(#glassPanel)" stroke="url(#neonCyan)" stroke-width="4.5"/>
  <!-- Glass Reflection Effect -->
  <path d="M 120 144 L 270 144 L 120 288 Z" fill="url(#glassReflect)" opacity="0.6"/>
  
  <!-- Stand & Base Structure -->
  <path d="M 212 292 L 198 340 H 268 L 254 292 Z" fill="#06182B" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="168" y="340" width="128" height="11" rx="5.5" fill="#07223D" stroke="url(#neonCyan)" stroke-width="2.5"/>
</g>

<!-- Central Code Symbol inside Screen (< />) -->
<g fill="none" stroke="url(#accentGradient)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#ultraGlow)">
  <path d="M 174 196 L 152 217 L 174 238"/>
  <path d="M 290 196 L 312 217 L 290 238"/>
  <path d="M 248 188 L 214 246"/>
</g>

<!-- Smartphone Overlay (Right Alignment) -->
<g filter="url(#ultraGlow)">
  <rect x="326" y="200" width="76" height="148" rx="16" fill="url(#glassPanel)" stroke="url(#neonCyan)" stroke-width="4"/>
  <!-- Phone Screen Reflection -->
  <path d="M 328 202 L 392 202 L 328 310 Z" fill="url(#glassReflect)" opacity="0.5"/>
  <!-- Inner Screen Border -->
  <rect x="333" y="213" width="62" height="112" rx="8" fill="#010A14" stroke="#00F7FF" stroke-width="1" opacity="0.65"/>
  <!-- Home Indicator Line -->
  <line x1="354" y1="337" x2="374" y2="337" stroke="#00FF9D" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Mobile Code Preview & Matrix Bars -->
<g fill="none" stroke="#00F7FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
  <path d="M 353 258 L 346 265 L 353 272"/>
  <path d="M 373 258 L 380 265 L 373 272"/>
  <line x1="350" y1="288" x2="376" y2="288" stroke="#00FF9D" stroke-width="2" opacity="0.6"/>
  <line x1="350" y1="295" x2="368" y2="295" stroke="#00F7FF" stroke-width="2" opacity="0.4"/>
</g>

<!-- Top Wireless Connectivity Signal -->
<g fill="none" stroke="url(#neonCyan)" stroke-width="5.5" stroke-linecap="round" filter="url(#ultraGlow)">
  <path d="M 186 110 A 82 82 0 0 1 286 110"/>
  <path d="M 202 125 A 56 56 0 0 1 270 125"/>
  <path d="M 218 140 A 30 30 0 0 1 254 140"/>
</g>

<!-- Innovation Compass Spark Star -->
<g transform="translate(392, 106)" filter="url(#ultraGlow)">
  <path d="M 0 -20 Q 0 0 20 0 Q 0 0 0 20 Q 0 0 -20 0 Q 0 0 0 -20 Z" fill="#00FF9D"/>
  <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
</g>

<!-- Floating Cyber Sparks & Ambient Light Particles -->
<g fill="#00F7FF" opacity="0.9" filter="url(#softGlow)">
  <circle cx="110" cy="105" r="2.5"/>
  <circle cx="415" cy="385" r="3"/>
  <circle cx="95" cy="380" r="2"/>
  <circle cx="256" cy="76" r="2.2" fill="#00FF9D"/>
  <circle cx="425" cy="155" r="2" fill="#00FF9D"/>
  <circle cx="75" cy="256" r="1.8"/>
</g>

</svg>
