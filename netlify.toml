[build]
  publish = "."

[build.processing]
  skip_processing = true


[[headers]]
  for = "/css/fontawesome/*"
  [headers.values]
    Content-Type = "text/css"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Content-Type = "font/woff2"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.ttf"
  [headers.values]
    Content-Type = "font/ttf"
    Cache-Control = "public, max-age=31536000, immutable"