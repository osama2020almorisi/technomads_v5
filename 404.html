<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة غير موجودة - TechNomads</title>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1a3e, #2A2D7C);
            color: white;
            text-align: center;
        }
        .error-container h1 {
            font-size: 6rem;
            margin: 0;
            color: #4ECDC4;
        }
        .error-container h2 {
            font-size: 2rem;
        }
        .error-container p {
            opacity: 0.8;
        }
        .error-container a {
            color: #4ECDC4;
            text-decoration: none;
            border: 2px solid #4ECDC4;
            padding: 10px 30px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        .error-container a:hover {
            background: #4ECDC4;
            color: #1a1a3e;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>الصفحة غير موجودة</h2>
        <p>عذراً، الصفحة التي تبحث عنها غير متوفرة</p>
        <a href="/">العودة إلى الرئيسية</a>
    </div>
</body>
</html>
