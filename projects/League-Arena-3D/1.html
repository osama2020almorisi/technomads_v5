<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#0B6E4F">
  <meta name="description" content="مدير الدوري الرياضي — نظام احترافي لإدارة الفرق والمباريات والترتيب والإحصائيات.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مدير الدوري">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">

  <title>مدير الدوري | League Manager</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Icons -->
  <link rel="icon" href="icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.svg">

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Fonts: Cairo + Tajawal + JetBrains Mono -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;700;900&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  >
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;700;900&display=swap"
    >
  </noscript>

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css">
</head>

<body>

  <!-- ============================================================
       AMBIENT BACKGROUND (خلفية متحركة)
       ============================================================ -->
  <div class="ambient-bg" aria-hidden="true"></div>

  <!-- ============================================================
       SPLASH SCREEN
       ============================================================ -->
  <div id="splash" class="splash" aria-label="جاري التحميل" role="status">
    <div class="splash-mark">
      <svg viewBox="0 0 100 100" role="img" aria-label="شعار مدير الدوري">
        <circle cx="50" cy="50" r="43" fill="none" stroke="currentColor" stroke-width="5"/>
        <path d="M50 25 67 38 61 59 39 59 33 38Z" fill="currentColor"/>
        <path d="m50 25 0-12M67 38l13-4M61 59l8 14M39 59l-8 14M33 38l-13-4"
              stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>مدير الدوري</h1>
    <p>كل البطولة في مكان واحد</p>
    <div class="splash-track"><span></span></div>
  </div>

  <!-- ============================================================
       APP SHELL
       ============================================================ -->
  <div id="app" class="app-shell" hidden>

    <!-- ============================================================
         TOP BAR
         ============================================================ -->
    <header class="topbar glass-topbar" role="banner">
      <button
        class="icon-button"
        id="menuLeague"
        aria-label="معلومات البطولة"
        type="button"
      >
        <span class="league-emblem" aria-hidden="true">⚽</span>
      </button>

      <div class="topbar__brand">
        <strong id="leagueName">دوري المحترفين</strong>
        <small id="leagueSeason">الموسم 2025/2026</small>
      </div>

      <div class="top-actions">
        <button
          class="icon-button"
          id="checkUpdates"
          title="التحقق من التحديثات"
          aria-label="التحقق من التحديثات"
          type="button"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 7v5h-5M4 17v-5h5M5.6 9a7 7 0 0 1 11.7-2L20 12M4 12l2.7 5a7 7 0 0 0 11.7-2"/>
          </svg>
          <i id="updateDot" class="status-dot" aria-hidden="true"></i>
        </button>

        <button
          class="icon-button"
          id="themeToggle"
          title="تغيير المظهر"
          aria-label="تغيير المظهر"
          type="button"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ============================================================
         MAIN CONTENT — All Screens
         ============================================================ -->
    <main id="mainContent" class="main-content" tabindex="-1">
      <div id="pageHost">

        <!-- HOME SCREEN -->
        <section class="screen screen-home" data-screen="home" aria-label="الرئيسية" hidden></section>

        <!-- TEAMS SCREEN -->
        <section class="screen screen-teams" data-screen="teams" aria-label="الفرق" hidden></section>

        <!-- TEAM DETAIL SCREEN -->
        <section class="screen screen-team" data-screen="team" aria-label="تفاصيل الفريق" hidden></section>

        <!-- MATCHES SCREEN -->
        <section class="screen screen-matches" data-screen="matches" aria-label="المباريات" hidden></section>

        <!-- MATCH LIVE SCREEN -->
        <section class="screen screen-live" data-screen="live" aria-label="المباراة الحية" hidden></section>

        <!-- STANDINGS SCREEN -->
        <section class="screen screen-standings" data-screen="standings" aria-label="الترتيب" hidden></section>

        <!-- STATS SCREEN -->
        <section class="screen screen-stats" data-screen="stats" aria-label="الإحصائيات" hidden></section>

        <!-- DISCIPLINE SCREEN -->
        <section class="screen screen-discipline" data-screen="discipline" aria-label="الانضباط" hidden></section>

        <!-- SETTINGS SCREEN -->
        <section class="screen screen-settings" data-screen="settings" aria-label="الإعدادات" hidden></section>

        <!-- ADMIN SCREEN (container) -->
        <section class="screen screen-admin" data-screen="admin" aria-label="لوحة الإدارة" hidden></section>

      </div>
    </main>

    <!-- ============================================================
         FLOATING ACTION BUTTON (FAB)
         ============================================================ -->
    <button
      id="fabImport"
      class="fab"
      aria-label="استيراد بيانات"
      title="استيراد بيانات"
      type="button"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/>
      </svg>
    </button>

    <!-- Hidden file input for JSON import -->
    <input
      type="file"
      id="importInput"
      accept="application/json,.json"
      hidden
    >

    <!-- ============================================================
         BOTTOM NAVIGATION (6 items)
         ============================================================ -->
    <nav
      class="bottom-nav glass-nav"
      id="bottomNav"
      role="navigation"
      aria-label="التنقل الرئيسي"
    >
      <span class="nav-indicator" id="navIndicator" aria-hidden="true"></span>

      <button
        class="nav-item active"
        data-page="home"
        aria-label="الرئيسية"
        type="button"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1Z"/>
        </svg>
        <span>الرئيسية</span>
      </button>

      <button
        class="nav-item"
        data-page="matches"
        aria-label="المباريات"
        type="button"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="m12 7 3 2-1 4h-4L9 9Zm-3 2-3-1m8 5 2 3m-6-3-2 3m7-7 3-2"/>
        </svg>
        <span>المباريات</span>
      </button>

      <button
        class="nav-item"
        data-page="standings"
        aria-label="الترتيب"
        type="button"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 4h8v4a4 4 0 0 1-8 0Zm4 8v5m-5 3h10M5 5H3v2a4 4 0 0 0 5 4m11-6h2v2a4 4 0 0 1-5 4"/>
        </svg>
        <span>الترتيب</span>
      </button>

      <button
        class="nav-item"
        data-page="stats"
        aria-label="الإحصائيات"
        type="button"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 20V10h4v10M10 20V4h4v16M16 20v-7h4v7M2 20h20"/>
        </svg>
        <span>الإحصائيات</span>
      </button>

      <button
        class="nav-item"
        data-page="admin"
        aria-label="الإدارة"
        type="button"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 20 7v5c0 5-3.4 8-8 9-4.6-1-8-4-8-9V7Z"/>
          <path d="m8 12 2.5 2.5L16 9"/>
        </svg>
        <span>الإدارة</span>
      </button>

      <button
        class="nav-item"
        data-page="settings"
        aria-label="الإعدادات"
        type="button"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="m19.4 15 .1.1 1.2 1-1.5 2.6-1.5-.6a7 7 0 0 1-2 .9l-.3 1.6h-3l-.3-1.6a7 7 0 0 1-2-.9l-1.5.6-1.5-2.6 1.2-1a7 7 0 0 1 0-2l-1.2-1 1.5-2.6 1.5.6a7 7 0 0 1 2-.9l.3-1.6h3l.3 1.6a7 7 0 0 1 2 .9l1.5-.6 1.5 2.6-1.2 1a7 7 0 0 1 0 2Z"/>
        </svg>
        <span>الإعدادات</span>
      </button>
    </nav>

  </div>

  <!-- ============================================================
       TOAST REGION
       ============================================================ -->
  <div
    id="toastRegion"
    class="toast-region"
    aria-live="polite"
    aria-atomic="true"
  ></div>

  <!-- ============================================================
       MODAL ROOT
       ============================================================ -->
  <div id="modalRoot"></div>

  <!-- ============================================================
       SCRIPTS — Load Order Matters
       ============================================================ -->
  <script src="js/core.js"></script>
  <script src="js/engines.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
