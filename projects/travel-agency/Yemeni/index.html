<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متطلبات السفر - الخطوط الجوية اليمنية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- الهيدر -->
        <header>
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-plane-departure"></i>
                    <h1>متطلبات السفر الدولي</h1>
                </div>
                <p class="subtitle">الخطوط الجوية اليمنية - تأكد من متطلبات سفرك قبل المغادرة</p>
            </div>
            <div class="header-decoration">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>

        <!-- قسم البحث -->
        <div class="search-section">
            <div class="search-header">
                <i class="fas fa-search"></i>
                <h2>ابحث عن متطلبات السفر</h2>
            </div>
            
            <div class="search-grid">
                <div class="form-group">
                    <label for="nationality">
                        <i class="fas fa-user"></i> الجنسية:
                    </label>
                    <select id="nationality">
                        <option value="">-- اختر الجنسية --</option>
                        <option value="يمني">يمني</option>
                        <option value="سعودي">سعودي</option>
                        <option value="أردني">أردني</option>
                        <option value="مصري">مصري</option>
                        <option value="سوداني">سوداني</option>
                        <option value="سوري">سوري</option>
                        <option value="إماراتي">إماراتي</option>
                        <option value="كويتي">كويتي</option>
                        <option value="هندي">هندي</option>
                        <option value="ماليزي">ماليزي</option>
                        <option value="إثيوبي">إثيوبي</option>
                        <option value="لبناني">لبناني</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="destination">
                        <i class="fas fa-globe"></i> الوجهة:
                    </label>
                    <select id="destination">
                        <option value="">-- اختر الوجهة --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="city">
                        <i class="fas fa-city"></i> المدينة:
                    </label>
                    <select id="city">
                        <option value="">-- اختر المدينة --</option>
                    </select>
                </div>

                <button id="searchBtn">
                    <i class="fas fa-paper-plane"></i> ابحث عن المتطلبات
                </button>
            </div>

            <!-- مؤشر التحميل -->
            <div id="loadingIndicator" class="loading-indicator" style="display: none;">
                <i class="fas fa-spinner fa-spin"></i>
                <span>جاري البحث...</span>
            </div>
        </div>

        <!-- نتائج البحث -->
        <div id="results" class="results-section" style="display: none;">
            <div class="requirements-card" id="requirementsCard">
                <!-- المحتوى سيأتي من JavaScript -->
            </div>
        </div>

        <!-- المعلومات العامة -->
        <div id="generalInfo" class="general-info">
            <div class="general-header">
                <i class="fas fa-info-circle"></i>
                <h2>📜 التعليمات العامة</h2>
            </div>
            <div id="generalInstructions"></div>
        </div>

        <!-- الفوتر -->
        <footer>
            <p>© 2026 الخطوط الجوية اليمنية - جميع الحقوق محفوظة</p>
            <p class="footer-note">للحصول على أحدث المعلومات، يرجى التواصل مع خدمة العملاء</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
