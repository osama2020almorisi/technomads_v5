<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متطلبات السفر - الخطوط الجوية اليمنية</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- شريط التحميل -->
    <div id="loader" class="loader">
        <div class="loader-spinner"></div>
        <p>جاري تحميل البيانات...</p>
    </div>

    <div class="container" id="mainContent" style="display: none;">
        <!-- رأس الصفحة -->
        <header>
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-plane-departure"></i>
                    <h1>متطلبات السفر الدولي</h1>
                </div>
                <p class="subtitle">الخطوط الجوية اليمنية - تأكد من متطلبات سفرك قبل المغادرة</p>
            </div>
            <div class="header-decoration">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>

        <!-- قسم البحث -->
        <section class="search-section" id="searchSection">
            <div class="search-header">
                <i class="fas fa-search"></i>
                <h2>ابحث عن متطلبات السفر</h2>
                <p>اختر جنسيتك ووجهتك للاطلاع على كافة المتطلبات</p>
            </div>

            <div class="search-grid">
                <div class="form-group">
                    <label for="nationality">
                        <i class="fas fa-user"></i> الجنسية
                    </label>
                    <select id="nationality" class="custom-select">
                        <option value="">-- اختر الجنسية --</option>
                        <option value="يمني">🇾🇪 يمني</option>
                        <option value="سعودي">🇸🇦 سعودي</option>
                        <option value="أردني">🇯🇴 أردني</option>
                        <option value="مصري">🇪🇬 مصري</option>
                        <option value="سوداني">🇸🇩 سوداني</option>
                        <option value="سوري">🇸🇾 سوري</option>
                        <option value="إماراتي">🇦🇪 إماراتي</option>
                        <option value="كويتي">🇰🇼 كويتي</option>
                        <option value="هندي">🇮🇳 هندي</option>
                        <option value="ماليزي">🇲🇾 ماليزي</option>
                        <option value="إثيوبي">🇪🇹 إثيوبي</option>
                        <option value="أجنبي">🌍 أجنبي (جنسية أخرى)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="destination">
                        <i class="fas fa-globe"></i> الوجهة
                    </label>
                    <select id="destination" class="custom-select">
                        <option value="">-- اختر الوجهة --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="city">
                        <i class="fas fa-city"></i> المدينة
                    </label>
                    <select id="city" class="custom-select">
                        <option value="">-- اختر المدينة --</option>
                    </select>
                </div>

                <div class="form-group search-actions">
                    <button id="searchBtn" class="btn-primary">
                        <i class="fas fa-search"></i> ابحث عن المتطلبات
                    </button>
                    <button id="clearBtn" class="btn-secondary">
                        <i class="fas fa-undo"></i> مسح
                    </button>
                </div>
            </div>

            <!-- مؤشر البحث -->
            <div id="searchIndicator" class="search-indicator" style="display: none;">
                <div class="search-spinner"></div>
                <span>جاري البحث...</span>
            </div>
        </section>

        <!-- نتائج البحث -->
        <section id="results" class="results-section" style="display: none;">
            <div class="results-header">
                <h2><i class="fas fa-clipboard-list"></i> <span id="resultTitle">متطلبات السفر</span></h2>
                <button id="closeResults" class="btn-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="requirements-card" id="requirementsCard">
                <!-- المحتوى يضاف ديناميكياً -->
            </div>
        </section>

        <!-- المعلومات العامة -->
        <section class="general-info" id="generalInfo">
            <div class="general-header">
                <h2><i class="fas fa-info-circle"></i> التعليمات العامة</h2>
                <button id="toggleGeneral" class="btn-toggle">
                    <i class="fas fa-chevron-up"></i>
                </button>
            </div>
            <div class="general-body" id="generalBody">
                <!-- المحتوى يضاف ديناميكياً -->
            </div>
        </section>

        <!-- تذييل الصفحة -->
        <footer>
            <p>© 2026 الخطوط الجوية اليمنية - جميع الحقوق محفوظة</p>
            <p class="footer-note">تحديث: <span id="updateDate"></span></p>
        </footer>
    </div>

    <!-- زر العودة للأعلى -->
    <button id="scrollTop" class="scroll-top" style="display: none;">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="script.js"></script>
</body>
</html>
