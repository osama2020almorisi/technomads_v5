<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="الأعياد القادمة - TechNomads">
    <title>الأعياد القادمة | TechNomads</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <div class="logo-loader">
                <svg viewBox="0 0 100 100" class="logo-svg">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#grad1)" stroke-width="2" class="logo-ring"/>
                    <path d="M50 15 L65 40 L85 40 L70 55 L75 80 L50 65 L25 80 L30 55 L15 40 L35 40 Z" fill="url(#grad1)" class="logo-star"/>
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#6366f1"/>
                            <stop offset="100%" style="stop-color:#ec4899"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h2 class="loading-title">TechNomads</h2>
            <p class="loading-subtitle">الريادة التقنية اليمنية</p>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
        </div>
    </div>

    <!-- Mobile Header -->
    <header class="app-header" id="appHeader">
        <div class="header-content">
            <button class="menu-toggle" id="menuToggle" aria-label="القائمة">
                <span></span><span></span><span></span>
            </button>
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 100 100" width="32" height="32">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="url(#brandGrad)" stroke-width="2"/>
                        <path d="M50 15 L65 40 L85 40 L70 55 L75 80 L50 65 L25 80 L30 55 L15 40 L35 40 Z" fill="url(#brandGrad)"/>
                        <defs>
                            <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#6366f1"/>
                                <stop offset="100%" style="stop-color:#ec4899"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="brand-name">TechNomads</span>
                    <span class="brand-tag">الأعياد القادمة</span>
                </div>
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Mobile Navigation Drawer -->
    <nav class="nav-drawer" id="navDrawer">
        <div class="drawer-overlay" id="drawerOverlay"></div>
        <div class="drawer-content">
            <div class="drawer-header">
                <div class="drawer-brand">
                    <svg viewBox="0 0 100 100" width="40" height="40">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="url(#drawerGrad)" stroke-width="2"/>
                        <path d="M50 15 L65 40 L85 40 L70 55 L75 80 L50 65 L25 80 L30 55 L15 40 L35 40 Z" fill="url(#drawerGrad)"/>
                        <defs>
                            <linearGradient id="drawerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#6366f1"/>
                                <stop offset="100%" style="stop-color:#ec4899"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <div>
                        <h3>TechNomads</h3>
                        <p>الريادة التقنية اليمنية</p>
                    </div>
                </div>
            </div>
            <div class="drawer-links">
                <a href="index.html" class="drawer-link">
                    <div class="link-icon"><i class="fas fa-th-large"></i></div>
                    <span>لوحة التحكم</span>
                    <i class="fas fa-chevron-left link-arrow"></i>
                </a>
                <a href="calculator.html" class="drawer-link">
                    <div class="link-icon"><i class="fas fa-calculator"></i></div>
                    <span>حاسبة العمر</span>
                    <i class="fas fa-chevron-left link-arrow"></i>
                </a>
                <a href="upcoming.html" class="drawer-link active">
                    <div class="link-icon"><i class="fas fa-gift"></i></div>
                    <span>الأعياد القادمة</span>
                    <i class="fas fa-chevron-left link-arrow"></i>
                </a>
                <a href="add-birthday.html" class="drawer-link">
                    <div class="link-icon"><i class="fas fa-user-plus"></i></div>
                    <span>إضافة مولود</span>
                    <i class="fas fa-chevron-left link-arrow"></i>
                </a>
            </div>
            <div class="drawer-footer">
                <p>© 2025 TechNomads</p>
                <p class="version">v3.0 Premium</p>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content upcoming-main" id="mainContent">
        <!-- Page Hero -->
        <section class="upcoming-hero">
            <div class="upcoming-hero-bg">
                <div class="hero-blob blob-pink"></div>
                <div class="hero-blob blob-purple"></div>
            </div>
            <div class="upcoming-hero-content">
                <div class="upcoming-icon">
                    <i class="fas fa-gift"></i>
                </div>
                <h1>الأعياد القادمة</h1>
                <p>لا تفوت أي عيد ميلاد مهم</p>
            </div>
        </section>

        <!-- Range Selector -->
        <section class="range-section">
            <div class="range-label">عرض خلال:</div>
            <div class="range-chips" id="rangeChips">
                <button class="range-chip" data-range="7">7 أيام</button>
                <button class="range-chip active" data-range="30">30 يوم</button>
                <button class="range-chip" data-range="90">3 أشهر</button>
                <button class="range-chip" data-range="365">سنة</button>
            </div>
        </section>

        <!-- Upcoming List -->
        <section class="upcoming-section">
            <div class="section-header">
                <h2><i class="fas fa-list"></i> القائمة</h2>
                <span class="count-badge" id="upcomingBadge">0</span>
            </div>
            <div class="upcoming-list" id="upcomingList">
                <!-- Dynamic content -->
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-th-large"></i>
            <span>الرئيسية</span>
        </a>
        <a href="calculator.html" class="nav-item">
            <i class="fas fa-calculator"></i>
            <span>الحاسبة</span>
        </a>
        <a href="upcoming.html" class="nav-item active">
            <i class="fas fa-gift"></i>
            <span>الأعياد</span>
        </a>
        <a href="add-birthday.html" class="nav-item">
            <i class="fas fa-plus"></i>
            <span>إضافة</span>
        </a>
    </nav>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/upcoming.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initApp();
        });
    </script>
</body>
</html>
