<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>معرض الروابط الذكي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-primary: #0b0e14;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border-card: rgba(255, 255, 255, 0.06);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0e14;
            min-height: 100vh;
            padding: 12px 10px;
            background-image: 
                radial-gradient(circle at 20% 50%, #1a1f2e 0%, #0b0e14 100%),
                repeating-linear-gradient(0deg, transparent, transparent 49px, rgba(255,255,255,0.02) 49px, rgba(255,255,255,0.02) 50px),
                repeating-linear-gradient(90deg, transparent, transparent 49px, rgba(255,255,255,0.02) 49px, rgba(255,255,255,0.02) 50px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ========== HEADER ========== */
        .header {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
            padding: 18px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #f0f4ff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 i {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            padding: 10px;
            border-radius: 14px;
            font-size: 18px;
            -webkit-text-fill-color: white;
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
        }

        .header .stats {
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.03);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .header .stats span {
            color: #e2e8f0;
            font-weight: 700;
            font-size: 18px;
        }

        /* ========== SEARCH BAR ========== */
        .search-bar {
            position: relative;
            width: 100%;
        }

        .search-bar input {
            width: 100%;
            padding: 14px 48px 14px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .search-bar input::placeholder {
            color: #64748b;
        }

        .search-bar input:focus {
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        .search-bar i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 16px;
        }

        /* ========== TOOLS GRID ========== */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .tools-grid button {
            padding: 11px 8px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            backdrop-filter: blur(10px);
            font-family: 'Inter', sans-serif;
        }

        .tools-grid button i {
            font-size: 13px;
        }

        .tools-grid button:active {
            transform: scale(0.95);
        }

        .tools-grid .btn-categories {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.35);
            color: #c4b5fd;
        }

        .tools-grid .btn-categories:hover {
            background: rgba(139, 92, 246, 0.35);
            color: white;
        }

        .tools-grid .btn-export {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.35);
            color: #93c5fd;
        }

        .tools-grid .btn-export:hover {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .tools-grid .btn-import {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        .tools-grid .btn-import:hover {
            background: rgba(16, 185, 129, 0.3);
            color: white;
        }

        .tools-grid .btn-danger {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.25);
            color: #fca5a5;
        }

        .tools-grid .btn-danger:hover {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }

        /* ========== ADD FORM ========== */
        .add-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 22px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .add-form input,
        .add-form select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .add-form input::placeholder {
            color: #475569;
        }

        .add-form input:focus,
        .add-form select:focus {
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.06);
        }

        .add-form select option {
            background: #1a1f2e;
            color: #e2e8f0;
        }

        .add-form button {
            padding: 14px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }

        .add-form button:active {
            transform: scale(0.96);
        }

        /* ========== CATEGORIES ========== */
        .category {
            margin-bottom: 22px;
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .category-title {
            font-size: 17px;
            font-weight: 700;
            color: #e2e8f0;
            padding: 8px 0 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .category-title span {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
        }

        .category-title .count {
            background: rgba(59, 130, 246, 0.15);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: #60a5fa;
            font-weight: 600;
        }

        .category-title i {
            transition: 0.3s;
            color: #475569;
            font-size: 16px;
        }

        .category-links {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-top: 14px;
            transition: 0.3s;
        }

        .category-links.hidden {
            display: none;
        }

        /* ========== LINK CARD ========== */
        .link-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            transition: 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .link-card:active {
            transform: scale(0.98);
        }

        .link-card.dragging {
            opacity: 0.4;
            transform: scale(0.95);
        }

        .link-card.drag-over {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.3);
        }

        .thumbnail {
            width: 100%;
            height: 160px;
            background: #0f1219;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .thumbnail .fallback {
            display: none;
            position: absolute;
            inset: 0;
            align-items: center;
            justify-content: center;
            background: #0f1219;
            font-size: 50px;
            color: rgba(255,255,255,0.06);
        }

        .thumbnail .domain-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 11px;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 5px;
            max-width: calc(100% - 20px);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .thumbnail .badge-actions {
            position: absolute;
            bottom: 10px;
            right: 10px;
            left: 10px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .thumbnail .badge-actions button,
        .thumbnail .badge-actions a {
            padding: 7px 14px;
            border-radius: 30px;
            border: none;
            font-size: 11px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            color: white;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: 'Inter', sans-serif;
        }

        .card-content {
            padding: 14px 16px 16px;
        }

        .card-content .title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
            gap: 10px;
        }

        .card-content h3 {
            font-size: 16px;
            font-weight: 700;
            color: #f1f5f9;
            flex: 1;
            line-height: 1.3;
        }

        .card-content .category-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 30px;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.1);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .card-content .url-preview {
            font-size: 12px;
            color: #475569;
            margin-bottom: 12px;
            word-break: break-all;
            font-weight: 400;
            line-height: 1.4;
        }

        .card-content .actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .card-content .actions button {
            padding: 9px 6px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            backdrop-filter: blur(10px);
            font-family: 'Inter', sans-serif;
        }

        .card-content .actions button i {
            font-size: 11px;
        }

        .card-content .actions button:active {
            transform: scale(0.95);
        }

        .card-content .actions .copy-btn {
            color: #93c5fd;
        }

        .card-content .actions .edit-btn {
            color: #c4b5fd;
        }

        .card-content .actions .delete-btn {
            color: #fca5a5;
        }

        .card-content .actions .delete-btn:active {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }

        /* ========== MODALS ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.25s ease;
            padding: 16px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Preview Modal */
        .preview-modal {
            background: linear-gradient(160deg, #111827 0%, #0f172a 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .preview-modal::-webkit-scrollbar { width: 4px; }
        .preview-modal::-webkit-scrollbar-track { background: transparent; }
        .preview-modal::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 20px; }

        .preview-modal-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px 28px 0 0;
        }

        .preview-modal-header .modal-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 30px;
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        .preview-modal-header .modal-close {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 40px;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
        }

        .preview-modal-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .preview-modal-thumb {
            width: 100%;
            height: 200px;
            border-radius: 18px;
            overflow: hidden;
            background: #020617;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .preview-modal-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-modal-info .modal-title {
            font-size: 22px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 10px;
        }

        .preview-modal-info .modal-domain {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 8px;
        }

        .preview-modal-info .modal-url {
            color: #64748b;
            font-size: 12px;
            word-break: break-all;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            font-family: 'SF Mono', 'Fira Code', monospace;
            direction: ltr;
            text-align: left;
            line-height: 1.5;
        }

        .preview-modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .preview-modal-actions button,
        .preview-modal-actions a {
            padding: 12px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            backdrop-filter: blur(10px);
            font-family: 'Inter', sans-serif;
        }

        .preview-modal-actions .visit-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            grid-column: 1 / -1;
        }

        .preview-modal-actions .delete-btn:active {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }

        .preview-modal-footer {
            padding: 0 18px 18px;
        }

        /* Categories Modal */
        .categories-modal {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 22px;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
            animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .categories-modal h2 {
            color: #f1f5f9;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .categories-modal .subtitle {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 18px;
        }

        .categories-modal .add-category-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
            background: rgba(255,255,255,0.03);
            padding: 14px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .categories-modal .add-category-form input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .categories-modal .add-category-form input:focus {
            border-color: #3b82f6;
        }

        .icon-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            max-height: 120px;
            overflow-y: auto;
            padding: 4px;
        }

        .icon-picker .icon-option {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 2px solid transparent;
            background: rgba(255,255,255,0.03);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .icon-picker .icon-option:active {
            transform: scale(0.9);
        }

        .icon-picker .icon-option.selected {
            border-color: #3b82f6;
            background: rgba(59,130,246,0.2);
            transform: scale(1.1);
        }

        .categories-modal .add-category-form button {
            padding: 13px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }

        .categories-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }

        .categories-list .cat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .categories-list .cat-item .cat-icon-display {
            font-size: 28px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            flex-shrink: 0;
        }

        .categories-list .cat-item .cat-details {
            flex: 1;
            min-width: 0;
        }

        .categories-list .cat-item .cat-name {
            color: #e2e8f0;
            font-weight: 700;
            font-size: 14px;
        }

        .categories-list .cat-item .cat-count {
            color: #64748b;
            font-size: 11px;
        }

        .categories-list .cat-item .cat-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .categories-list .cat-item .cat-actions button {
            padding: 7px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: #94a3b8;
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }

        .categories-list .cat-item .cat-actions .delete-cat:active {
            background: #ef4444;
            border-color: #ef4444;
            color: white;
        }

        .modal-close-btn {
            padding: 13px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: #94a3b8;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            margin-top: 16px;
            width: 100%;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }

        /* Edit Modal */
        .edit-modal {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 22px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
            animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .edit-modal h2 {
            color: #f1f5f9;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .edit-modal .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }

        .edit-modal input,
        .edit-modal select {
            padding: 13px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .edit-modal select option {
            background: #1a1f2e;
            color: #e2e8f0;
        }

        .edit-modal .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .edit-modal .modal-buttons button {
            padding: 13px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #cbd5e1;
            font-family: 'Inter', sans-serif;
        }

        .edit-modal .modal-buttons button.save-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
        }

        /* Empty State */
        .empty-msg {
            text-align: center;
            padding: 50px 16px;
            color: #475569;
            grid-column: 1 / -1;
        }

        .empty-msg i {
            font-size: 50px;
            margin-bottom: 12px;
            opacity: 0.2;
        }

        .empty-msg h2 {
            color: #64748b;
            font-weight: 400;
            font-size: 16px;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            color: white;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: 0.4s;
            z-index: 99999;
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ========== TABLET ========== */
        @media (min-width: 600px) {
            body {
                padding: 20px 24px;
            }

            .header {
                padding: 20px 24px;
                border-radius: 28px;
            }

            .header h1 {
                font-size: 26px;
            }

            .tools-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 10px;
            }

            .tools-grid button {
                padding: 12px 10px;
                font-size: 13px;
                border-radius: 16px;
            }

            .add-form {
                flex-direction: row;
                flex-wrap: wrap;
                padding: 18px 20px;
                gap: 10px;
            }

            .add-form input {
                flex: 1;
                min-width: 140px;
            }

            .add-form select {
                flex: 0 0 140px;
            }

            .add-form button {
                flex: 0 0 auto;
                padding: 14px 24px;
            }

            .category-links {
                grid-template-columns: repeat(2, 1fr);
                gap: 18px;
            }

            .card-content .actions {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        /* ========== DESKTOP ========== */
        @media (min-width: 900px) {
            .header {
                flex-direction: row;
                align-items: center;
                gap: 16px;
            }

            .header-top {
                flex: 0 0 auto;
            }

            .search-bar {
                flex: 1;
                min-width: 200px;
            }

            .tools-grid {
                flex: 0 0 auto;
                grid-template-columns: auto auto auto auto;
                gap: 8px;
            }

            .tools-grid button {
                padding: 12px 20px;
                font-size: 13px;
            }

            .category-links {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }

            .add-form {
                flex-wrap: nowrap;
            }
        }

        @media (min-width: 1200px) {
            .category-links {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-top">
                <h1><i class="fas fa-th-large"></i> معرض الروابط</h1>
                <div class="stats">
                    <i class="fas fa-link"></i> <span id="totalCount">0</span>
                </div>
            </div>
            
            <!-- Search Bar -->
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن رابط..." oninput="renderLinks()" />
            </div>
            
            <!-- Tools Grid -->
            <div class="tools-grid">
                <button class="btn-categories" onclick="openCategoriesModal()">
                    <i class="fas fa-tags"></i> <span>تصنيفات</span>
                </button>
                <button class="btn-export" onclick="exportLinks()">
                    <i class="fas fa-download"></i> <span>تصدير</span>
                </button>
                <button class="btn-import" onclick="document.getElementById('importFile').click()">
                    <i class="fas fa-upload"></i> <span>استيراد</span>
                </button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importLinks(event)" />
                <button class="btn-danger" onclick="clearAll()">
                    <i class="fas fa-trash-alt"></i> <span>حذف الكل</span>
                </button>
            </div>
        </div>

        <!-- Add Form -->
        <div class="add-form">
            <input type="text" id="linkTitle" placeholder="🏷️ العنوان" />
            <input type="url" id="linkUrl" placeholder="🔗 الرابط (https://...)" />
            <select id="linkCategory"></select>
            <button onclick="addLink()"><i class="fas fa-plus-circle"></i> إضافة</button>
        </div>

        <!-- Links Container -->
        <div id="linksContainer"></div>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="modal-overlay" style="display: none;">
        <div class="preview-modal" id="previewModalContent"></div>
    </div>

    <!-- Categories Modal -->
    <div id="categoriesModal" class="modal-overlay" style="display: none;">
        <div class="categories-modal">
            <h2><i class="fas fa-tags"></i> إدارة التصنيفات</h2>
            <p class="subtitle">أضف، عدل أو احذف التصنيفات واختر أيقونة لكل تصنيف</p>
            
            <div class="add-category-form">
                <input type="text" id="newCatName" placeholder="✍️ اسم التصنيف الجديد..." />
                <div class="icon-picker" id="iconPicker"></div>
                <button onclick="addCategory()"><i class="fas fa-plus"></i> إضافة تصنيف</button>
            </div>
            
            <div class="categories-list" id="categoriesList"></div>
            <button class="modal-close-btn" onclick="closeCategoriesModal()"><i class="fas fa-check-circle"></i> تم - إغلاق</button>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay" style="display: none;">
        <div class="edit-modal">
            <h2><i class="fas fa-pen-to-square"></i> تعديل الرابط</h2>
            <div class="form-group">
                <input type="text" id="editTitle" placeholder="العنوان" />
                <input type="url" id="editUrl" placeholder="الرابط" />
                <select id="editCategory"></select>
            </div>
            <div class="modal-buttons">
                <button onclick="closeEditModal()">إلغاء</button>
                <button class="save-btn" onclick="saveEdit()">💾 حفظ</button>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // ========== DATA ==========
        let links = [];
        let categories = [];
        let editingId = null;
        let selectedIcon = '📂';

        const iconOptions = [
            '📂', '💬', '💼', '📚', '🛒', '🎮', '📰', '🏠', '❤️', '⭐',
            '🔥', '💡', '🎯', '🚀', '💎', '🌍', '📱', '🎨', '🎵', '📸',
            '✈️', '🏆', '💰', '🔧', '📝', '☕', '🍕', '🎓', '🏥', '⚽',
            '🎪', '🎭', '🌮', '🎸', '📡', '🔬', '🗺️', '🎁', '🏗️', '🧠'
        ];

        const defaultCategories = [
            { name: 'عام', icon: '📂' },
            { name: 'تواصل', icon: '💬' },
            { name: 'عمل', icon: '💼' },
            { name: 'تعليم', icon: '📚' },
            { name: 'تسوق', icon: '🛒' },
            { name: 'ترفيه', icon: '🎮' },
            { name: 'أخبار', icon: '📰' }
        ];

        function loadData() {
            const storedLinks = localStorage.getItem('galleryLinksV7');
            const storedCategories = localStorage.getItem('galleryCategoriesV7');
            if (storedLinks) { try { links = JSON.parse(storedLinks); } catch (e) { links = []; } }
            else {
                links = [
                    { id: 1, title: 'GitHub', url: 'https://github.com', category: 'عمل' },
                    { id: 2, title: 'YouTube', url: 'https://youtube.com', category: 'ترفيه' },
                    { id: 3, title: 'X (Twitter)', url: 'https://x.com', category: 'تواصل' },
                    { id: 4, title: 'Wikipedia', url: 'https://wikipedia.org', category: 'تعليم' },
                ];
                saveLinks();
            }
            if (storedCategories) { try { categories = JSON.parse(storedCategories); } catch (e) { categories = []; } }
            if (categories.length === 0) { categories = [...defaultCategories]; saveCategories(); }
        }

        function saveLinks() { localStorage.setItem('galleryLinksV7', JSON.stringify(links)); }
        function saveCategories() { localStorage.setItem('galleryCategoriesV7', JSON.stringify(categories)); }
        function getCategoryIcon(catName) { const cat = categories.find(c => c.name === catName); return cat ? cat.icon : '📁'; }
        function getDomain(url) { try { return new URL(url).hostname.replace('www.', ''); } catch { return url.split('/')[2] || url; } }
        function getThumbnail(url) { return `https://api.microlink.io/?url=${encodeURIComponent(url)}&screenshot=true&embed=screenshot.url&meta=false`; }

        function populateCategorySelects() {
            ['linkCategory', 'editCategory'].forEach(id => {
                const s = document.getElementById(id);
                if (s) s.innerHTML = categories.map(c => `<option value="${c.name}">${c.icon} ${c.name}</option>`).join('');
            });
        }

        function renderIconPicker() {
            const p = document.getElementById('iconPicker');
            if (p) p.innerHTML = iconOptions.map(i => `<span class="icon-option${i===selectedIcon?' selected':''}" onclick="selectIcon('${i}')">${i}</span>`).join('');
        }

        function selectIcon(icon) { selectedIcon = icon; renderIconPicker(); }

        // ========== RENDER ==========
        function renderLinks() {
            const container = document.getElementById('linksContainer');
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            let filtered = links.filter(l => l.title.toLowerCase().includes(search) || l.url.toLowerCase().includes(search) || l.category.toLowerCase().includes(search));
            document.getElementById('totalCount').textContent = links.length;
            if (!filtered.length) {
                container.innerHTML = `<div class="empty-msg"><i class="fas fa-images"></i><h2>${search?'🔍 لا توجد نتائج':'✨ أضف روابطك الأولى'}</h2></div>`;
                return;
            }
            const groups = {};
            filtered.forEach(l => { if (!groups[l.category]) groups[l.category] = []; groups[l.category].push(l); });
            let html = '';
            for (const [cat, items] of Object.entries(groups)) {
                html += `<div class="category"><div class="category-title" onclick="toggleCategory(this)"><span>${getCategoryIcon(cat)} ${cat} <span class="count">${items.length}</span></span><i class="fas fa-chevron-down"></i></div><div class="category-links">`;
                items.forEach(l => {
                    const domain = getDomain(l.url);
                    html += `
                    <div class="link-card" data-id="${l.id}" draggable="true" ondragstart="dragStart(event)" ondragend="dragEnd(event)" ondragover="dragOver(event)" ondrop="drop(event)">
                        <div class="thumbnail" onclick="openPreviewModal(${l.id})">
                            <img src="${getThumbnail(l.url)}" alt="${l.title}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
                            <div class="fallback"><i class="fas fa-globe"></i></div>
                            <div class="domain-badge"><i class="fas fa-link"></i> ${domain}</div>
                            <div class="badge-actions">
                                <button onclick="event.stopPropagation();openPreviewModal(${l.id})"><i class="fas fa-eye"></i> معاينة</button>
                                <a href="${l.url}" target="_blank" onclick="event.stopPropagation()"><i class="fas fa-external-link-alt"></i> فتح</a>
                            </div>
                        </div>
                        <div class="card-content" onclick="openPreviewModal(${l.id})">
                            <div class="title-row"><h3>${l.title}</h3><span class="category-tag">${getCategoryIcon(l.category)} ${l.category}</span></div>
                            <div class="url-preview">${l.url}</div>
                            <div class="actions">
                                <button class="copy-btn" onclick="event.stopPropagation();copyLink('${l.url}')"><i class="fas fa-copy"></i> نسخ</button>
                                <button class="edit-btn" onclick="event.stopPropagation();openEditModal(${l.id})"><i class="fas fa-pen"></i> تعديل</button>
                                <button class="delete-btn" onclick="event.stopPropagation();deleteLink(${l.id})"><i class="fas fa-trash"></i> حذف</button>
                            </div>
                        </div>
                    </div>`;
                });
                html += `</div></div>`;
            }
            container.innerHTML = html;
        }

        function toggleCategory(el) {
            const div = el.nextElementSibling;
            div.classList.toggle('hidden');
            const icon = el.querySelector('i:last-child');
            icon.classList.toggle('fa-chevron-down');
            icon.classList.toggle('fa-chevron-up');
        }

        // ========== MODALS ==========
        function openPreviewModal(id) {
            const link = links.find(l => l.id === id);
            if (!link) return;
            const modal = document.getElementById('previewModal');
            modal.querySelector('#previewModalContent').innerHTML = `
                <div class="preview-modal-header">
                    <div class="modal-badge"><i class="fas fa-tag"></i> ${getCategoryIcon(link.category)} ${link.category}</div>
                    <button class="modal-close" onclick="closePreviewModal()"><i class="fas fa-times"></i> إغلاق</button>
                </div>
                <div class="preview-modal-body">
                    <div class="preview-modal-thumb"><img src="${getThumbnail(link.url)}" alt="${link.title}" onerror="this.style.display='none'" /></div>
                    <div class="preview-modal-info">
                        <div class="modal-title">${link.title}</div>
                        <div class="modal-domain"><i class="fas fa-globe"></i> ${getDomain(link.url)}</div>
                        <div class="modal-url">${link.url}</div>
                    </div>
                    <div class="preview-modal-actions">
                        <button onclick="copyLink('${link.url}')"><i class="fas fa-copy"></i> نسخ</button>
                        <button onclick="closePreviewModal();openEditModal(${link.id})"><i class="fas fa-pen"></i> تعديل</button>
                        <a href="${link.url}" target="_blank" class="visit-btn"><i class="fas fa-external-link-alt"></i> زيارة الموقع</a>
                        <button class="delete-btn" onclick="deleteLinkFromPreview(${link.id})"><i class="fas fa-trash"></i> حذف</button>
                    </div>
                </div>`;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closePreviewModal() { document.getElementById('previewModal').style.display = 'none'; document.body.style.overflow = ''; }
        function deleteLinkFromPreview(id) { if (!confirm('حذف هذا الرابط؟')) return; links = links.filter(l => l.id !== id); saveLinks(); closePreviewModal(); renderLinks(); showToast('🗑️ تم الحذف'); }

        function openEditModal(id) {
            const link = links.find(l => l.id === id);
            if (!link) return;
            editingId = id;
            populateCategorySelects();
            document.getElementById('editTitle').value = link.title;
            document.getElementById('editUrl').value = link.url;
            document.getElementById('editCategory').value = link.category;
            document.getElementById('editModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; document.body.style.overflow = ''; editingId = null; }

        function saveEdit() {
            if (!editingId) return;
            const title = document.getElementById('editTitle').value.trim();
            const url = document.getElementById('editUrl').value.trim();
            const category = document.getElementById('editCategory').value;
            if (!title || !url) { showToast('⚠️ العنوان والرابط مطلوبان'); return; }
            if (!url.startsWith('http://') && !url.startsWith('https://')) { showToast('⚠️ رابط غير صالح'); return; }
            const link = links.find(l => l.id === editingId);
            if (link) { link.title = title; link.url = url; link.category = category; }
            saveLinks(); closeEditModal(); renderLinks(); showToast('✏️ تم التعديل');
        }

        function openCategoriesModal() {
            document.getElementById('categoriesModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            selectedIcon = '📂';
            renderIconPicker();
            renderCategoriesList();
        }

        function closeCategoriesModal() {
            document.getElementById('categoriesModal').style.display = 'none';
            document.body.style.overflow = '';
            populateCategorySelects();
            renderLinks();
        }

        function renderCategoriesList() {
            document.getElementById('categoriesList').innerHTML = categories.map((c, i) => `
                <div class="cat-item">
                    <div class="cat-icon-display">${c.icon}</div>
                    <div class="cat-details"><div class="cat-name">${c.name}</div><div class="cat-count">${links.filter(l=>l.category===c.name).length} روابط</div></div>
                    <div class="cat-actions">
                        <button onclick="editCategory(${i})"><i class="fas fa-pen"></i></button>
                        <button class="delete-cat" onclick="deleteCategory(${i})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`).join('');
        }

        function addCategory() {
            const name = document.getElementById('newCatName').value.trim();
            if (!name) { showToast('⚠️ أدخل اسم التصنيف'); return; }
            if (categories.find(c => c.name === name)) { showToast('⚠️ موجود مسبقاً'); return; }
            categories.push({ name, icon: selectedIcon });
            saveCategories();
            document.getElementById('newCatName').value = '';
            selectedIcon = '📂';
            renderIconPicker();
            renderCategoriesList();
            populateCategorySelects();
            showToast('✅ تمت الإضافة');
        }

        function editCategory(index) {
            const cat = categories[index];
            const newName = prompt('اسم التصنيف:', cat.name);
            if (!newName || !newName.trim()) return;
            const trimmed = newName.trim();
            if (categories.find((c, i) => i !== index && c.name === trimmed)) { showToast('⚠️ مكرر'); return; }
            const newIcon = prompt('الأيقونة (إيموجي):', cat.icon);
            const oldName = cat.name;
            categories[index].name = trimmed;
            categories[index].icon = newIcon || cat.icon;
            links.forEach(l => { if (l.category === oldName) l.category = trimmed; });
            saveCategories(); saveLinks();
            renderCategoriesList(); populateCategorySelects(); renderLinks();
            showToast('✏️ تم التعديل');
        }

        function deleteCategory(index) {
            if (categories.length <= 1) { showToast('⚠️ يجب بقاء تصنيف واحد'); return; }
            const cat = categories[index];
            if (!confirm(`حذف "${cat.name}"؟`)) return;
            links.forEach(l => { if (l.category === cat.name) l.category = categories[0].name; });
            categories.splice(index, 1);
            saveCategories(); saveLinks();
            renderCategoriesList(); populateCategorySelects(); renderLinks();
            showToast('🗑️ تم الحذف');
        }

        // ========== DRAG & DROP ==========
        let draggedId = null;
        function dragStart(e) { const c = e.target.closest('.link-card'); if (!c) return; draggedId = parseInt(c.dataset.id); c.classList.add('dragging'); }
        function dragEnd(e) { document.querySelectorAll('.link-card').forEach(c => c.classList.remove('dragging','drag-over')); }
        function dragOver(e) { e.preventDefault(); const c = e.target.closest('.link-card'); if (c) { document.querySelectorAll('.link-card').forEach(x => x.classList.remove('drag-over')); c.classList.add('drag-over'); } }
        function drop(e) {
            e.preventDefault();
            const c = e.target.closest('.link-card');
            if (!c || !draggedId) return;
            const tid = parseInt(c.dataset.id);
            if (draggedId === tid) return;
            const from = links.findIndex(l => l.id === draggedId);
            const to = links.findIndex(l => l.id === tid);
            if (from===-1||to===-1) return;
            const [m] = links.splice(from, 1);
            links.splice(to, 0, m);
            saveLinks(); renderLinks(); showToast('🔄 تم الترتيب');
        }

        // ========== CRUD ==========
        function addLink() {
            const title = document.getElementById('linkTitle').value.trim();
            const url = document.getElementById('linkUrl').value.trim();
            const category = document.getElementById('linkCategory').value;
            if (!title || !url) { showToast('⚠️ أدخل العنوان والرابط'); return; }
            if (!url.startsWith('http://') && !url.startsWith('https://')) { showToast('⚠️ رابط غير صالح'); return; }
            links.push({ id: Date.now(), title, url, category });
            saveLinks(); renderLinks();
            document.getElementById('linkTitle').value = '';
            document.getElementById('linkUrl').value = '';
            showToast('✅ تمت الإضافة');
        }

        function deleteLink(id) { if (!confirm('حذف هذا الرابط؟')) return; links = links.filter(l => l.id !== id); saveLinks(); renderLinks(); showToast('🗑️ تم الحذف'); }
        function copyLink(url) { navigator.clipboard.writeText(url).then(() => showToast('📋 تم النسخ')).catch(() => showToast('📋 تم النسخ')); }
        function clearAll() { if (!confirm('⚠️ حذف جميع الروابط؟')) return; links = []; saveLinks(); renderLinks(); showToast('🗑️ تم حذف الكل'); }

        function exportLinks() {
            const data = JSON.stringify({ links, categories }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'معرض_روابطي.json';
            a.click();
            showToast('📤 تم التصدير');
        }

        function importLinks(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.links) { links = data.links; if (data.categories) categories = data.categories; }
                    else if (Array.isArray(data)) links = data;
                    else { showToast('⚠️ ملف غير صالح'); return; }
                    saveLinks(); saveCategories();
                    populateCategorySelects(); renderLinks();
                    showToast('📥 تم الاستيراد');
                } catch { showToast('⚠️ خطأ في الملف'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        document.addEventListener('click', e => {
            if (e.target.id === 'previewModal') closePreviewModal();
            if (e.target.id === 'editModal') closeEditModal();
            if (e.target.id === 'categoriesModal') closeCategoriesModal();
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePreviewModal(); closeEditModal(); closeCategoriesModal(); } });

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        loadData();
        populateCategorySelects();
        renderLinks();
    </script>
</body>
</html>
