<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🌳 شجرة العائلة Pro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<style>
  :root{
    --bg:#f3f6fb; --surface:#ffffff; --surface2:#edf2f7; --surface3:#e2e8f0;
    --text:#152033; --text-strong:#0b1220; --muted:#64748b;
    --line:#d6dfeb; --line-strong:#b8c4d4;
    --primary:#0f766e; --primary-dark:#0d5e57; --primary-light:#14b8a6;
    --danger:#dc2626; --warn:#f59e0b; --success:#16a34a; --info:#2563eb;
    --gold:#fbbf24; --gold-dark:#d97706;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-left:env(safe-area-inset-left,0px);
    --safe-right:env(safe-area-inset-right,0px);
    --nav:rgba(255,255,255,.97);
    --btn-sm:38px;
    --btn-md:44px;
    --btn-lg:48px;
    --btn-xl:52px;
    --topbar-h:62px;
  }
  html.dark{
    --bg:#090f1b; --surface:#101a2b; --surface2:#172337; --surface3:#1e2d44;
    --text:#edf4ff; --text-strong:#ffffff; --muted:#9ba9bc;
    --line:#293950; --line-strong:#3d5273;
    --primary:#14b8a6; --primary-dark:#0f766e; --primary-light:#2dd4bf;
    --nav:rgba(16,26,43,.98);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:Cairo,'Segoe UI',Tahoma,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  /* ============================================================
     الشريط العلوي
     ============================================================ */
  .topbar{
    position:relative;z-index:50;
    display:flex;align-items:center;gap:6px;
    padding:calc(8px + var(--safe-top)) 10px 8px;
    background:var(--nav);border-bottom:1px solid var(--line);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    flex-shrink:0;
    min-height:var(--topbar-h);
  }

  .brand{
    font-size:14px;font-weight:900;color:var(--text-strong);
    display:flex;align-items:center;gap:4px;flex-shrink:0;
    padding-inline-end:4px;
  }
  .brand span{
    font-size:8px;
    background:linear-gradient(135deg,var(--primary),var(--primary-light));
    color:#fff;border-radius:5px;padding:2px 5px;font-weight:900;
    letter-spacing:.5px;
  }

  .search-wrap{
    flex:1;display:flex;align-items:center;gap:4px;
    background:var(--surface2);border:1.5px solid var(--line);
    border-radius:12px;padding:0 6px;min-width:0;height:var(--btn-md);
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .search-wrap:focus-within{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(15,118,110,.14);
    background:var(--surface);
  }
  .search-wrap input{
    flex:1;border:0;outline:0;background:transparent;color:var(--text);
    padding:6px 4px;font-size:13px;min-width:0;font-family:inherit;
    -webkit-user-select:text;user-select:text;
  }
  .search-wrap input::placeholder{color:var(--muted);opacity:.65;font-size:12px}
  .search-wrap .s-icon{
    color:var(--muted);font-size:14px;flex-shrink:0;
    padding-inline-start:2px;
  }

  .search-counter{
    display:none;align-items:center;gap:2px;
    font-size:11px;font-weight:900;color:var(--primary);
    padding:3px 8px;border-radius:7px;background:rgba(15,118,110,.14);
    flex-shrink:0;font-variant-numeric:tabular-nums;
    transition:transform .2s ease;
  }
  .search-counter.show{display:inline-flex;animation:popIn .25s cubic-bezier(.2,.9,.3,1)}
  @keyframes popIn{
    from{transform:scale(.7);opacity:0}
    to{transform:scale(1);opacity:1}
  }
  .search-counter .current{color:var(--primary-dark);font-size:12px}
  .search-counter .sep{opacity:.4;font-size:10px}
  .search-counter .total{opacity:.75;font-size:10px}

  .search-nav{display:none;gap:2px;flex-shrink:0}
  .search-nav.show{display:flex}
  .search-nav-btn{
    width:32px;height:32px;border-radius:8px;
    border:1px solid var(--line);background:var(--surface);
    color:var(--text);font-size:13px;cursor:pointer;
    display:grid;place-items:center;font-family:inherit;
    transition:transform .1s ease, background .12s ease, color .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .search-nav-btn:active{transform:scale(.88);background:var(--primary);color:#fff}
  .search-nav-btn:disabled{opacity:.3;cursor:not-allowed}
  .search-nav-btn:disabled:active{background:var(--surface);color:var(--text)}

  .clear-btn{
    display:none;color:var(--muted);font-size:15px;cursor:pointer;
    padding:4px 6px;background:none;border:0;font-family:inherit;
    border-radius:6px;transition:background .12s ease;
    flex-shrink:0;
  }
  .clear-btn:active{background:var(--surface3)}
  .search-wrap.has-value .clear-btn{display:block}

  .top-actions{
    display:flex;gap:5px;flex-shrink:0;
  }
  .icon-btn{
    width:var(--btn-md);height:var(--btn-md);
    border:1.5px solid var(--line);border-radius:12px;
    background:var(--surface);color:var(--text);font-size:17px;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;font-family:inherit;
    transition:transform .12s ease, background .12s ease, border-color .12s ease, color .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .icon-btn:active{transform:scale(.88)}
  .icon-btn:hover{background:var(--surface2)}
  .icon-btn.primary-icon{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    border-color:var(--primary-dark);color:#fff;
    box-shadow:0 3px 10px rgba(15,118,110,.3);
  }
  .icon-btn.primary-icon:active{
    transform:scale(.88);
    box-shadow:0 1px 4px rgba(15,118,110,.4);
  }

  .search-results{
    position:absolute;
    top:calc(var(--topbar-h) + var(--safe-top) - 4px);
    left:calc(10px + var(--safe-left));
    right:calc(10px + var(--safe-right));
    z-index:80;
    max-height:min(58vh, 420px);
    overflow-y:auto;overflow-x:hidden;
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:16px;
    box-shadow:0 24px 60px rgba(0,0,0,.28);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    animation:dropIn .24s cubic-bezier(.2,.9,.3,1);
    -webkit-overflow-scrolling:touch;
    transform-origin:top center;
  }
  .search-results.hidden{display:none}
  @keyframes dropIn{
    from{opacity:0;transform:translateY(-10px) scale(.96)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  .sr-header{
    padding:10px 14px;
    background:linear-gradient(180deg, var(--surface2), var(--surface));
    border-bottom:1px solid var(--line);
    font-size:10px;color:var(--muted);font-weight:800;
    display:flex;justify-content:space-between;align-items:center;
    position:sticky;top:0;z-index:2;
    backdrop-filter:blur(8px);
  }
  .sr-header b{color:var(--primary);font-weight:900;font-size:12px}
  .sr-hint{
    font-size:9px;color:var(--muted);opacity:.85;
    display:flex;gap:5px;align-items:center;
  }
  .sr-hint kbd{
    background:var(--surface3);border:1px solid var(--line);
    border-radius:4px;padding:1px 5px;font-family:inherit;font-size:8px;
    font-weight:800;color:var(--text);
  }

  .sr-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
    transition:background .12s ease;
    position:relative;
    min-height:58px;
  }
  .sr-item:last-child{border-bottom:0}
  .sr-item:active, .sr-item.active{background:var(--surface2)}
  .sr-item.active::before{
    content:"";position:absolute;right:0;top:0;bottom:0;
    width:3px;background:var(--primary);
    border-radius:0 4px 4px 0;
  }

  .sr-avatar{
    width:36px;height:36px;border-radius:50%;
    display:grid;place-items:center;
    font-size:15px;font-weight:900;color:#fff;
    flex-shrink:0;
    background:linear-gradient(135deg,#64748b,#94a3b8);
  }
  .sr-avatar.male{background:linear-gradient(135deg,#2563eb,#3b82f6)}
  .sr-avatar.female{background:linear-gradient(135deg,#db2777,#ec4899)}
  .sr-avatar.unknown{background:linear-gradient(135deg,#64748b,#94a3b8)}

  .sr-info{flex:1;min-width:0}
  .sr-name{
    font-size:13px;font-weight:800;color:var(--text-strong);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .sr-name mark{
    background:var(--gold);color:#0b1220;
    padding:0 3px;border-radius:3px;font-weight:900;
  }
  .sr-meta{
    font-size:10px;color:var(--muted);margin-top:3px;
    display:flex;gap:6px;align-items:center;font-weight:700;
    flex-wrap:wrap;
  }
  .sr-id{
    font-size:9px;font-weight:900;color:var(--primary);
    background:rgba(15,118,110,.12);
    padding:2px 6px;border-radius:5px;
    direction:ltr;font-variant-numeric:tabular-nums;
  }
  .sr-item.active .sr-id{
    background:var(--primary);color:#fff;
  }
  .sr-badge{
    font-size:8px;font-weight:900;
    padding:2px 5px;border-radius:4px;
    background:var(--surface3);color:var(--muted);
    text-transform:uppercase;
  }
  .sr-empty{
    padding:32px 14px;text-align:center;
    color:var(--muted);font-size:13px;font-weight:700;
  }
  .sr-empty .emoji{font-size:36px;display:block;margin-bottom:8px;opacity:.5}

  .stats-bar{
    position:absolute;
    top:calc(var(--topbar-h) + var(--safe-top) + 6px);
    left:calc(10px + var(--safe-left));
    right:calc(10px + var(--safe-right));
    z-index:20;
    display:flex;gap:6px;justify-content:flex-end;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .stats-bar.hidden{opacity:0;transform:translateY(-8px);pointer-events:none}

  .stat-card{
    pointer-events:auto;min-width:60px;padding:6px 10px;
    border-radius:12px;background:var(--surface);
    border:1.5px solid var(--line);
    text-align:center;
    box-shadow:0 2px 10px rgba(15,23,42,.06);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .stat-card:active{transform:scale(.95)}
  .stat-card .num{font-size:16px;font-weight:900;color:var(--primary);line-height:1}
  .stat-card .lbl{font-size:9px;color:var(--muted);margin-top:2px;font-weight:800}

  .focus-banner{
    position:absolute;
    top:calc(var(--topbar-h) + var(--safe-top) + 6px);
    left:calc(10px + var(--safe-left));
    right:calc(10px + var(--safe-right));
    z-index:25;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 14px;
    background:linear-gradient(135deg,#f59e0b,#ea580c);
    color:#fff;border-radius:14px;
    box-shadow:0 12px 32px rgba(245,158,11,.45);
    animation:focusSlide .32s cubic-bezier(.2,.9,.3,1);
    pointer-events:auto;
  }
  .focus-banner.hidden{display:none!important}
  @keyframes focusSlide{
    from{opacity:0;transform:translateY(-12px) scale(.96)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  .focus-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .focus-icon{font-size:22px;flex-shrink:0}
  .focus-text{min-width:0}
  .focus-text b{display:block;font-size:14px;font-weight:900;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .focus-text small{display:block;font-size:10px;opacity:.95;font-weight:700;margin-top:2px}
  .focus-stats{display:flex;gap:4px;flex-shrink:0;align-items:center}
  .focus-stat{
    background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.38);
    border-radius:9px;padding:5px 9px;text-align:center;min-width:46px;
  }
  .focus-stat .num{font-size:14px;font-weight:900;line-height:1;color:#fff}
  .focus-stat .lbl{font-size:8px;opacity:.95;font-weight:800;margin-top:2px;color:#fff}
  .focus-exit{
    padding:9px 12px;border:1.5px solid rgba(255,255,255,.55);
    border-radius:10px;background:rgba(255,255,255,.22);color:#fff;
    font-weight:900;font-size:11px;cursor:pointer;font-family:inherit;
    flex-shrink:0;transition:.15s;
  }
  .focus-exit:active{transform:scale(.92);background:rgba(255,255,255,.4)}

  .tree-container{
    flex:1;position:relative;overflow:hidden;
    background:radial-gradient(ellipse at center, var(--surface) 0%, var(--bg) 100%);
  }
  #svg{
    display:block;width:100%;height:100%;
    cursor:grab;touch-action:none;
    shape-rendering:geometricPrecision;text-rendering:geometricPrecision;
  }
  #svg.grabbing{cursor:grabbing}
  #viewport{
    transform-origin:0 0;will-change:transform;
    transform:translate3d(0,0,0);
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
  }
  .node{cursor:pointer}
  .node-card{
    fill:var(--surface);stroke:var(--line);stroke-width:1.6;
    transition:stroke .15s ease, stroke-width .15s ease, filter .2s ease, opacity .2s ease;
    shape-rendering:geometricPrecision;
  }
  .node-card:hover{stroke:var(--primary);stroke-width:2.2}
  .node-card.selected{stroke:var(--warn);stroke-width:4}
  .node-card.focus-node{stroke:var(--warn);stroke-width:5;filter:url(#focusGlow)}
  .node-card.root-node{stroke:var(--primary);stroke-width:3}
  .node-card.search-hit{
    stroke:var(--gold);stroke-width:4;
    filter:url(#searchGlow);
  }
  .node-card.search-current{
    stroke:#fbbf24;stroke-width:5;
    filter:url(#searchGlowStrong);
    animation:pulseSearch 1.6s ease-in-out infinite;
  }
  @keyframes pulseSearch{
    0%,100%{stroke-width:5}
    50%{stroke-width:6.5}
  }
  .node.dimmed{opacity:.08;transition:opacity .25s ease}

  .node text{
    pointer-events:none;user-select:none;
    text-rendering:geometricPrecision;shape-rendering:geometricPrecision;
    font-family:Cairo,'Segoe UI',Tahoma,sans-serif;
  }
  .node-name{font-weight:900;font-size:13px;fill:var(--text-strong);text-anchor:middle}
  .node-meta{font-size:10px;fill:var(--muted);font-weight:700;text-anchor:middle}
  .node-gender{fill:#fff;font-family:Arial;font-size:12px;font-weight:900;text-anchor:middle}

  .link{
    fill:none;stroke-linecap:round;
    shape-rendering:geometricPrecision;
    transition:stroke .25s ease, stroke-width .25s ease, opacity .25s ease, filter .25s ease;
  }
  .link.ancestor-path{
    stroke:var(--gold) !important;
    stroke-width:3.5 !important;
    opacity:1 !important;
    filter:url(#searchGlowPath);
    stroke-dasharray: 6 4;
    animation:dashFlow 1s linear infinite;
  }
  @keyframes dashFlow{
    from{stroke-dashoffset:0}
    to{stroke-dashoffset:-20}
  }
  .link.dimmed{opacity:.04}

  .search-ring{
    fill:none;stroke:var(--gold);stroke-width:2;
    opacity:0;pointer-events:none;
  }
  .search-ring.active{
    opacity:.9;
    animation:ringPulse 1.8s ease-out infinite;
  }
  @keyframes ringPulse{
    0%{r:26;opacity:.9}
    100%{r:60;opacity:0}
  }

  .bottom-tools{
    position:absolute;
    bottom:calc(14px + var(--safe-bottom));
    left:calc(12px + var(--safe-left));
    right:calc(12px + var(--safe-right));
    z-index:40;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:8px;
    pointer-events:none;
  }

  .tool-group{
    display:flex;
    flex-direction:column;
    gap:6px;
    pointer-events:auto;
  }

  .tool-btn{
    width:var(--btn-lg);height:var(--btn-lg);
    border-radius:14px;
    background:var(--surface);
    border:1.5px solid var(--line);
    color:var(--text);
    font-size:20px;
    cursor:pointer;font-family:inherit;
    display:grid;place-items:center;
    transition:transform .12s ease, background .12s ease, box-shadow .12s ease;
    box-shadow:0 4px 14px rgba(15,23,42,.10);
    -webkit-tap-highlight-color:transparent;
    font-weight:700;
  }
  .tool-btn:active{
    transform:scale(.88);
    background:var(--surface2);
    box-shadow:0 2px 6px rgba(15,23,42,.15);
  }
  .tool-btn.zoom-label{
    font-size:11px;
    font-weight:900;
    letter-spacing:-.5px;
  }
  .tool-btn.primary-tool{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    border-color:var(--primary-dark);
    color:#fff;
    box-shadow:0 6px 16px rgba(15,118,110,.35);
  }
  .tool-btn.primary-tool:active{
    background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  }

  .nav-group{
    display:flex;
    flex-direction:column;
    gap:6px;
    pointer-events:auto;
  }
  .nav-btn{
    width:var(--btn-lg);height:var(--btn-lg);
    border-radius:50%;
    background:var(--surface);
    border:1.5px solid var(--line);
    color:var(--text);
    font-size:17px;
    cursor:pointer;font-family:inherit;
    display:grid;place-items:center;
    transition:transform .12s ease, background .12s ease;
    box-shadow:0 4px 14px rgba(15,23,42,.10);
    -webkit-tap-highlight-color:transparent;
  }
  .nav-btn:active{transform:scale(.88);background:var(--surface2)}

  /* ============================================================
     لوحة التفاصيل — Bottom Sheet احترافي
     ============================================================ */
  .info-panel{
    position:absolute;
    left:0; right:0; bottom:0;
    width:100%;
    max-height:68vh;
    background:var(--surface);
    border-radius:22px 22px 0 0;
    border-top:1px solid var(--line);
    transform:translateY(110%);
    transition:transform .38s cubic-bezier(.32,.72,0,1);
    z-index:70;
    display:flex;flex-direction:column;
    box-shadow:0 -18px 50px rgba(0,0,0,.28);
    will-change:transform;
    -webkit-backface-visibility:hidden;
  }
  .info-panel.open{transform:translateY(0)}

  .sheet-handle{
    width:44px;height:5px;border-radius:3px;
    background:var(--line-strong);
    margin:10px auto 4px;
    flex-shrink:0;
    cursor:grab;
    transition:background .15s, transform .15s;
  }
  .sheet-handle:active{background:var(--primary);transform:scaleX(1.15)}

  .info-head{
    display:flex;align-items:center;gap:11px;
    padding:6px 16px 12px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
    position:relative;
  }
  .avatar{
    width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;
    font-size:18px;color:#fff;font-weight:900;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    border:2px solid rgba(255,255,255,.18);
    flex:0 0 auto;
    box-shadow:0 4px 14px rgba(59,130,246,.3);
  }
  .info-head-text{flex:1;min-width:0}
  .info-head .name{
    font-size:15px;font-weight:900;line-height:1.25;
    color:var(--text-strong);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .info-head .sub{
    font-size:10px;color:var(--muted);
    margin-top:2px;font-weight:800;
    display:flex;gap:6px;align-items:center;
  }
  .info-head .sub .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--primary);display:inline-block;
  }

  .close-panel{
    position:absolute;
    top:12px;left:12px;
    width:32px;height:32px;border-radius:50%;
    background:var(--surface2);
    border:0;color:var(--muted);
    cursor:pointer;display:grid;place-items:center;
    font-size:14px;font-family:inherit;
    transition:transform .12s, background .12s, color .12s;
    z-index:2;
  }
  .close-panel:active{
    transform:scale(.85);
    background:var(--danger);color:#fff;
  }

  .info-body{
    padding:12px 14px calc(14px + var(--safe-bottom));
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    flex:1;
    overscroll-behavior:contain;
  }

  .info-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:6px;
    margin-bottom:12px;
  }
  .info-cell{
    background:var(--surface2);
    border:1px solid var(--line);
    border-radius:11px;
    padding:8px 4px;
    text-align:center;
    transition:transform .12s, border-color .12s;

<script>
/* ============================================================
   🌳 Family Tree Pro — النسخة النهائية المحسّنة
   Bottom Sheet Details Panel + Search + Path Highlighting
   ============================================================ */
'use strict';

const $ = id => document.getElementById(id);
const svg = $('svg');
const viewport = $('viewport');

const PALETTE = [
  "#0f766e","#2563eb","#7c3aed","#db2777","#ea580c",
  "#16a34a","#0891b2","#9333ea","#ca8a04","#475569"
];

const state = {
  people: [],
  byId: new Map(),
  children: new Map(),
  parentOf: new Map(),
  roots: [],
  depth: new Map(),
  maxGen: 0,
  focusId: null,
  focusSet: null,
  selectedId: null,
  searchMatches: [],
  searchIndex: -1,
  tx: 0, ty: 0, scale: 1,
  dark: false,
  pointers: new Map(),
  dragStart: null,
  pinch: null,
};

const MIN_SCALE = 0.05;
const MAX_SCALE = 8;
const CARD_W_LARGE = 170;
const CARD_H_LARGE = 72;
const CARD_W_SMALL = 145;
const CARD_H_SMALL = 62;

/* ============================================================
   1) تحميل البيانات
   ============================================================ */
async function loadData(){
  try{
    const res = await fetch('tree-data.json', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    state.people = Array.isArray(data.people) ? data.people : [];
    buildMaps();
    computeGenerations();
    render();
    updateStats();
    requestAnimationFrame(fitToScreen);
    setTimeout(fitToScreen, 200);
    $('loader').classList.add('hide');
  }catch(err){
    console.error(err);
    $('loader').innerHTML = `
      <p style="color:#ef4444;font-size:15px;font-weight:900">⚠ تعذر تحميل tree-data.json</p>
      <p style="color:#64748b;font-size:12px;max-width:300px">
        تأكد من وجود الملف بجانب index.html<br>وشغّل عبر Live Server
      </p>`;
  }
}

function buildMaps(){
  state.byId.clear();
  state.children.clear();
  state.parentOf.clear();
  state.people.forEach(p => state.byId.set(Number(p.id), p));
  state.people.forEach(p => {
    if(p.father_id != null && state.byId.has(Number(p.father_id))){
      const fid = Number(p.father_id);
      if(!state.children.has(fid)) state.children.set(fid, []);
      state.children.get(fid).push(Number(p.id));
      state.parentOf.set(Number(p.id), fid);
    }
  });
  state.children.forEach(arr => arr.sort((a,b)=>a-b));
}

function computeGenerations(){
  state.depth.clear();
  const hasParent = id => {
    const p = state.byId.get(Number(id));
    return p && p.father_id != null && state.byId.has(Number(p.father_id));
  };
  state.roots = state.people.filter(p => !hasParent(p.id)).map(p => Number(p.id));
  const q = [];
  state.roots.forEach(id => { state.depth.set(id, 0); q.push(id); });
  let head = 0;
  while(head < q.length){
    const id = q[head++];
    const d = state.depth.get(id) || 0;
    (state.children.get(id) || []).forEach(k=>{
      if(!state.depth.has(k) || state.depth.get(k) < d+1){
        state.depth.set(k, d+1);
        q.push(k);
      }
    });
  }
  state.people.forEach(p => { if(!state.depth.has(Number(p.id))) state.depth.set(Number(p.id), 0); });
  state.maxGen = 0;
  state.depth.forEach(v => { if(v > state.maxGen) state.maxGen = v; });
}

/* ============================================================
   2) بناء الشجرة
   ============================================================ */
function buildTree(rootId, maxDepth){
  const seen = new Set([rootId]);
  function buildNode(pid, d){
    const p = state.byId.get(pid);
    if(!p) return null;
    const node = {id: pid, name: p.name, gender: p.gender, depth: d, children: []};
    if(d < maxDepth){
      for(const cid of (state.children.get(pid) || [])){
        if(seen.has(cid)) continue;
        seen.add(cid);
        const child = buildNode(cid, d+1);
        if(child) node.children.push(child);
      }
    }
    return node;
  }
  return buildNode(rootId, 0);
}

/* ============================================================
   3) Radial Layout
   ============================================================ */
function layoutRadial(root, dy){
  function countLeaves(node){
    if(!node.children || !node.children.length) return 1;
    let total = 0;
    for(const c of node.children) total += countLeaves(c);
    return total;
  }
  let maxDepth = 0, maxSiblings = 1;
  const nodesByDepth = {};
  (function scan(n, d){
    if(d > maxDepth) maxDepth = d;
    const c = (n.children || []).length;
    if(c > maxSiblings) maxSiblings = c;
    nodesByDepth[d] = (nodesByDepth[d] || 0) + 1;
    for(const ch of n.children || []) scan(ch, d+1);
  })(root, 0);

  const totalNodes = Object.values(nodesByDepth).reduce((s,v)=>s+v, 0);
  const compact = totalNodes > 60;
  const cardWidth = compact ? CARD_W_SMALL : CARD_W_LARGE;
  const minGapX = cardWidth + 40;

  let halfAngleDeg;
  if(maxSiblings <= 2) halfAngleDeg = 60;
  else if(maxSiblings <= 4) halfAngleDeg = 85;
  else if(maxSiblings <= 8) halfAngleDeg = 110;
  else if(maxSiblings <= 15) halfAngleDeg = 135;
  else if(maxSiblings <= 30) halfAngleDeg = 155;
  else halfAngleDeg = 178;

  const HALF_ANGLE = (halfAngleDeg * Math.PI) / 180;
  const FULL_ANGLE = 2 * HALF_ANGLE;
  const requiredRadius = {};
  for(let d = 1; d <= maxDepth; d++){
    const count = nodesByDepth[d] || 1;
    requiredRadius[d] = (count * minGapX) / FULL_ANGLE;
  }
  const BASE_RADIUS = Math.max(dy * 1.8, requiredRadius[1] || 0);
  const radiusByDepth = {0: 0};
  radiusByDepth[1] = BASE_RADIUS;
  for(let d = 2; d <= maxDepth; d++){
    const depthBonus = (d-1) * 45;
    const minStep = dy + depthBonus;
    const stepRadius = radiusByDepth[d-1] + minStep;
    const reqRadius = requiredRadius[d] || 0;
    radiusByDepth[d] = Math.max(stepRadius, reqRadius);
  }
  const all = [];
  function assign(node, depth, angleStart, angleEnd){
    const centerAngle = (angleStart + angleEnd) / 2;
    const radius = radiusByDepth[depth] || 0;
    if(depth === 0){ node._x = 0; node._y = 0; }
    else{
      node._x = Math.sin(centerAngle) * radius;
      node._y = -Math.cos(centerAngle) * radius;
    }
    all.push(node);
    const children = node.children || [];
    if(!children.length) return;
    const totalLeaves = children.reduce((s,c)=>s+countLeaves(c), 0);
    let currentAngle = angleStart;
    for(const child of children){
      const leaves = countLeaves(child);
      const angleSpan = (angleEnd - angleStart) * (leaves / totalLeaves);
      assign(child, depth+1, currentAngle, currentAngle + angleSpan);
      currentAngle += angleSpan;
    }
  }
  assign(root, 0, -HALF_ANGLE, HALF_ANGLE);

  const xs = all.map(n => n._x);
  const ys = all.map(n => n._y);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
  const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  all.forEach(n => { n._x -= cx; n._y -= cy; });

  return {nodes: all, cardWidth, cardHeight: compact ? CARD_H_SMALL : CARD_H_LARGE, compact, maxDepth, totalNodes};
}

function curved(s, t, cardH){
  const halfH = cardH / 2;
  const startX = s._x, startY = s._y + halfH;
  const endX = t._x, endY = t._y - halfH;
  const h = endX - startX, v = endY - startY;
  return `M ${startX} ${startY} C ${startX + h*0.25} ${startY + v*0.45}, ${startX + h*0.75} ${startY + v*0.55}, ${endX} ${endY}`;
}

/* ============================================================
   4) مسار الأسلاف
   ============================================================ */
function getAncestorPath(personId){
  const path = [];
  const seen = new Set();
  let cur = Number(personId);
  while(cur != null && !seen.has(cur)){
    seen.add(cur);
    path.push(cur);
    cur = state.parentOf.get(cur);
    if(cur == null) break;
  }
  return path;
}

/* ============================================================
   5) الرسم
   ============================================================ */
function render(){
  viewport.innerHTML = '';

  const rootId = state.focusId != null ? state.focusId : chooseRoot();
  if(rootId == null) return;

  const maxDepth = state.focusId != null ? 30 : (state.maxGen + 1);
  const root = buildTree(rootId, maxDepth);
  if(!root) return;

  const totalNodes = countTreeNodes(root);
  const dy = totalNodes > 300 ? 240 : totalNodes > 150 ? 220 : totalNodes > 80 ? 200 : 185;

  const result = layoutRadial(root, dy);
  const {nodes, cardWidth, cardHeight, compact} = result;

  const ancestorSet = new Set();
  const ancestorEdges = new Set();
  if(state.searchIndex >= 0 && state.searchMatches.length){
    const currentId = state.searchMatches[state.searchIndex];
    const path = getAncestorPath(currentId);
    path.forEach(id => ancestorSet.add(id));
    for(let i = 0; i < path.length - 1; i++){
      ancestorEdges.add(`${path[i]}-${path[i+1]}`);
    }
  }

  const gLinks = document.createElementNS('http://www.w3.org/2000/svg','g');
  for(const n of nodes){
    for(const c of (n.children || [])){
      const baseColor = PALETTE[c.depth % PALETTE.length];
      const sw = Math.max(1.2, 3 - c.depth * 0.15);
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('class','link');
      path.setAttribute('stroke', baseColor);
      path.setAttribute('stroke-width', sw);
      path.setAttribute('d', curved(n, c, cardHeight));

      const edgeKey = `${c.id}-${n.id}`;
      if(ancestorEdges.has(edgeKey)){
        path.classList.add('ancestor-path');
      } else if(state.searchIndex >= 0 && state.searchMatches.length){
        const currentId = state.searchMatches[state.searchIndex];
        const pathArr = getAncestorPath(currentId);
        const inPath = pathArr.includes(n.id) && pathArr.includes(c.id)
                    && pathArr.indexOf(c.id) === pathArr.indexOf(n.id) + 1;
        if(!inPath) path.classList.add('dimmed');
      }
      gLinks.appendChild(path);
    }
  }

  const gNodes = document.createElementNS('http://www.w3.org/2000/svg','g');
  const circleR = compact ? 13 : 15;
  const circleCX = -cardWidth/2 + circleR + 12;
  const circleCY = 0;

  for(const n of nodes){
    const person = state.byId.get(n.id);
    if(!person) continue;

    const group = document.createElementNS('http://www.w3.org/2000/svg','g');
    group.setAttribute('class','node');
    group.setAttribute('transform', `translate(${n._x},${n._y})`);
    group.dataset.id = n.id;

    const isSelected = state.selectedId === n.id;
    const isRoot = n.depth === 0;
    const isFocus = state.focusId === n.id;
    const isSearchHit = state.searchMatches.includes(n.id);
    const isCurrentSearch = state.searchIndex >= 0 && state.searchMatches[state.searchIndex] === n.id;

    if(state.searchIndex >= 0 && state.searchMatches.length){
      if(!ancestorSet.has(n.id) && !isSearchHit){
        group.classList.add('dimmed');
      }
    }

    const card = document.createElementNS('http://www.w3.org/2000/svg','rect');
    let cls = 'node-card';
    if(isSelected) cls += ' selected';
    if(isSearchHit) cls += ' search-hit';
    if(isCurrentSearch) cls += ' search-current';
    if(isRoot) cls += ' root-node';
    if(isFocus) cls += ' focus-node';
    card.setAttribute('class', cls);
    card.setAttribute('x', -cardWidth/2);
    card.setAttribute('y', -cardHeight/2);
    card.setAttribute('width', cardWidth);
    card.setAttribute('height', cardHeight);
    card.setAttribute('rx', compact ? 14 : 18);
    group.appendChild(card);

    let genderColor = PALETTE[n.depth % PALETTE.length];
    if(person.gender === 'male') genderColor = '#2563eb';
    else if(person.gender === 'female') genderColor = '#db2777';

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', circleCX);
    circle.setAttribute('cy', circleCY);
    circle.setAttribute('r', circleR);
    circle.setAttribute('fill', genderColor);
    group.appendChild(circle);

    const genderIcon = person.gender === 'male' ? '♂' : person.gender === 'female' ? '♀' : '•';
    const gi = document.createElementNS('http://www.w3.org/2000/svg','text');
    gi.setAttribute('class','node-gender');
    gi.setAttribute('x', circleCX);
    gi.setAttribute('y', circleCY + (compact ? 4 : 5));
    gi.setAttribute('font-size', compact ? 12 : 14);
    gi.textContent = genderIcon;
    group.appendChild(gi);

    const nameCenterX = circleCX + circleR + (cardWidth/2 - (circleCX + circleR)) / 2 + 2;
    const name = document.createElementNS('http://www.w3.org/2000/svg','text');
    name.setAttribute('class','node-name');
    name.setAttribute('x', nameCenterX);
    name.setAttribute('y', compact ? -4 : -6);
    name.setAttribute('font-size', compact ? 12 : 13);
    const maxChars = compact ? 12 : 15;
    const displayName = (person.name || 'بدون اسم').trim();
    name.textContent = displayName.length > maxChars ? displayName.slice(0, maxChars-1) + '…' : displayName;
    group.appendChild(name);

    const meta = document.createElementNS('http://www.w3.org/2000/svg','text');
    meta.setAttribute('class','node-meta');
    meta.setAttribute('x', nameCenterX);
    meta.setAttribute('y', compact ? 12 : 15);
    meta.setAttribute('font-size', compact ? 9 : 10);
    meta.textContent = `#${n.id} • ج${n.depth + 1}`;
    group.appendChild(meta);

    if(isRoot){
      const ti = document.createElementNS('http://www.w3.org/2000/svg','text');
      ti.setAttribute('x', cardWidth/2 - 10);
      ti.setAttribute('y', -cardHeight/2 + 16);
      ti.setAttribute('font-size', 14);
      ti.setAttribute('text-anchor','middle');
      ti.textContent = isFocus ? '🎯' : '🌳';
      group.appendChild(ti);
    }

    if(isCurrentSearch){
      const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
      ring.setAttribute('class','search-ring active');
      ring.setAttribute('cx', 0);
      ring.setAttribute('cy', 0);
      ring.setAttribute('r', 26);
      group.appendChild(ring);
    }

    group.addEventListener('click', e => {
      e.stopPropagation();
      selectPerson(n.id);
    });

    let lastTap = 0;
    group.addEventListener('touchend', e => {
      const now = Date.now();
      if(now - lastTap < 300){
        e.preventDefault();
        focusOn(n.id);
        lastTap = 0;
      }else{
        lastTap = now;
      }
    });

    group.addEventListener('dblclick', e => {
      e.stopPropagation();
      focusOn(n.id);
    });

    gNodes.appendChild(group);
  }

  viewport.appendChild(gLinks);
  viewport.appendChild(gNodes);
  applyTransform();
}

function countTreeNodes(node){
  let c = 1;
  for(const ch of node.children || []) c += countTreeNodes(ch);
  return c;
}

function chooseRoot(){
  if(state.focusId != null && state.byId.has(state.focusId)) return state.focusId;
  if(!state.roots.length) return null;
  let best = state.roots[0], bestCount = -1;
  for(const r of state.roots){
    const c = countDescendants(r);
    if(c > bestCount){ bestCount = c; best = r; }
  }
  return best;
}

function countDescendants(rootId){
  let count = 0;
  const stack = [rootId], seen = new Set();
  while(stack.length){
    const cur = stack.pop();
    if(seen.has(cur)) continue;
    seen.add(cur); count++;
    for(const ch of (state.children.get(cur) || [])) stack.push(ch);
  }
  return count;
}

function collectDescendants(rootId){
  const set = new Set();
  const stack = [rootId];
  while(stack.length){
    const cur = stack.pop();
    if(set.has(cur)) continue;
    set.add(cur);
    (state.children.get(cur) || []).forEach(k => stack.push(k));
  }
  return set;
}

/* ============================================================
   6) التركيز
   ============================================================ */
function focusOn(id){
  if(!state.byId.has(id)) return;
  if(state.focusId === id){ exitFocus(); return; }
  state.focusId = id;
  state.focusSet = collectDescendants(id);
  state.selectedId = id;
  render();

  const person = state.byId.get(id);
  $('focusName').textContent = person.name;
  $('focusPeople').textContent = state.focusSet.size;
  $('focusGens').textContent = computeBranchGenerations(state.focusSet);
  $('focusBranches').textContent = (state.children.get(id) || []).length;
  $('statsBar').classList.add('hidden');
  $('focusBanner').classList.remove('hidden');

  toast(`🎯 التركيز على: ${person.name}`);
  requestAnimationFrame(fitToScreen);
  setTimeout(fitToScreen, 250);
}

function computeBranchGenerations(set){
  let minD = Infinity, maxD = -Infinity;
  set.forEach(id => {
    const d = state.depth.get(id);
    if(d == null) return;
    if(d < minD) minD = d;
    if(d > maxD) maxD = d;
  });
  if(minD === Infinity) return 1;
  return maxD - minD + 1;
}

function exitFocus(){
  if(state.focusId == null) return;
  state.focusId = null;
  state.focusSet = null;
  $('statsBar').classList.remove('hidden');
  $('focusBanner').classList.add('hidden');
  render();
  requestAnimationFrame(fitToScreen);
  setTimeout(fitToScreen, 250);
  toast('↩ تم الخروج من وضع التركيز');
}

/* ============================================================
   7) تفاصيل الفرد — Bottom Sheet

};

/* ============================================================
   سحب Bottom Sheet للإغلاق
   ============================================================ */
function enableSheetDrag(){
  const panel = $('infoPanel');
  const handle = $('sheetHandle');
  if(!handle || handle.dataset.bound) return;
  handle.dataset.bound = '1';

  let startY = 0, currentY = 0, dragging = false;

  const onStart = (e)=>{
    if(e.target !== handle) return;
    dragging = true;
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    panel.style.transition = 'none';
  };
  const onMove = (e)=>{
    if(!dragging) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    currentY = Math.max(0, y - startY);
    panel.style.transform = `translateY(${currentY}px)`;
  };
  const onEnd = ()=>{
    if(!dragging) return;
    dragging = false;
    panel.style.transition = '';
    panel.style.transform = '';
    if(currentY > 90) closePanel();
    currentY = 0;
  };

  handle.addEventListener('touchstart', onStart, {passive:true});
  handle.addEventListener('touchmove', onMove, {passive:true});
  handle.addEventListener('touchend', onEnd);
  handle.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onEnd);
}

function closePanel(){
  $('infoPanel').classList.remove('open');
}

function highlightPathToRoot(id){
  const path = getAncestorPath(id);
  if(!path.length) return;
  state.searchMatches = path.slice();
  state.searchIndex = 0;
  render();
  toast(`✨ المسار مضاء حتى الجذر (${path.length} أسلاف)`);
  setTimeout(() => centerOn(path[0]), 100);
}

/* ============================================================
   8) Transform
   ============================================================ */
let rafPending = false;
let pendingTx = 0, pendingTy = 0, pendingScale = 1;
function applyTransform(){
  pendingTx = state.tx; pendingTy = state.ty; pendingScale = state.scale;
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    viewport.style.transform = `translate3d(${pendingTx}px, ${pendingTy}px, 0) scale(${pendingScale})`;
  });
}

function fitToScreen(){
  const g = viewport; if(!g) return;
  const container = document.getElementById('treeContainer');
  if(!container) return;
  const box = container.getBoundingClientRect();
  let bb; try{ bb = g.getBBox(); }catch{ return; }
  if(!bb.width || !bb.height) return;

  const TOP_RESERVED = 70;
  const BOTTOM_RESERVED = 90;
  const SIDE_PADDING = 40;

  const availableW = box.width - SIDE_PADDING * 2;
  const availableH = box.height - TOP_RESERVED - BOTTOM_RESERVED;
  const sW = availableW / (bb.width + 40);
  const sH = availableH / (bb.height + 40);
  const s = Math.min(2.5, Math.max(MIN_SCALE, Math.min(sW, sH)));

  state.scale = s;
  state.tx = box.width / 2 - (bb.x + bb.width / 2) * s;
  state.ty = TOP_RESERVED + availableH / 2 - (bb.y + bb.height / 2) * s;
  applyTransform();
}

function centerOn(id){
  const g = viewport; if(!g) return;
  const nodeEl = [...g.querySelectorAll('.node')].find(el => Number(el.dataset.id) === Number(id));
  if(!nodeEl) return;
  const bb = nodeEl.getBBox();
  const container = document.getElementById('treeContainer');
  const box = container.getBoundingClientRect();
  const x = bb.x + bb.width/2;
  const y = bb.y + bb.height/2;
  const k = Math.max(state.scale, 1.2);
  state.scale = k;
  state.tx = box.width/2 - x * k;
  state.ty = box.height/2 - y * k;
  applyTransform();
}

function zoomBy(factor, cx, cy){
  const container = document.getElementById('treeContainer');
  if(!container) return;
  const box = container.getBoundingClientRect();
  if(cx == null) cx = box.width / 2;
  if(cy == null) cy = box.height / 2;
  const k0 = state.scale;
  const k1 = Math.max(MIN_SCALE, Math.min(MAX_SCALE, k0 * factor));
  const {tx, ty} = state;
  state.tx = cx - (cx - tx) * (k1/k0);
  state.ty = cy - (cy - ty) * (k1/k0);
  state.scale = k1;
  applyTransform();
}

/* ============================================================
   9) تفاعلات
   ============================================================ */
let dragging = false, last = {x:0,y:0}, pinch = null, dragMoved = false;
const container = document.getElementById('treeContainer');

svg.addEventListener('pointerdown', e => {
  if(e.target.closest('.node')) return;
  dragging = true; dragMoved = false;
  svg.classList.add('grabbing');
  last = {x:e.clientX, y:e.clientY};
  try{ svg.setPointerCapture(e.pointerId); }catch{}
  state.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
});

svg.addEventListener('pointermove', e => {
  if(!state.pointers.has(e.pointerId)) return;
  state.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(state.pointers.size === 1 && dragging){
    const dx = e.clientX - last.x;
    const dy = e.clientY - last.y;
    if(Math.abs(dx) + Math.abs(dy) > 2) dragMoved = true;
    last = {x:e.clientX, y:e.clientY};
    state.tx += dx; state.ty += dy;
    applyTransform();
  }
});

svg.addEventListener('pointerup', e => {
  dragging = false; svg.classList.remove('grabbing');
  state.pointers.delete(e.pointerId);
  try{ svg.releasePointerCapture(e.pointerId); }catch{}
});
svg.addEventListener('pointercancel', e => {
  dragging = false; svg.classList.remove('grabbing');
  state.pointers.delete(e.pointerId);
});

svg.addEventListener('touchstart', e => {
  if(e.touches.length === 2){
    const [a,b] = e.touches;
    pinch = {
      d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY),
      cx: (a.clientX + b.clientX)/2,
      cy: (a.clientY + b.clientY)/2,
      startScale: state.scale,
      startTx: state.tx, startTy: state.ty,
    };
  }
}, {passive:true});

svg.addEventListener('touchmove', e => {
  if(e.touches.length === 2 && pinch){
    e.preventDefault();
    const [a,b] = e.touches;
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const box = container.getBoundingClientRect();
    const lx = pinch.cx - box.left, ly = pinch.cy - box.top;
    const ptX = (lx - pinch.startTx) / pinch.startScale;
    const ptY = (ly - pinch.startTy) / pinch.startScale;
    const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinch.startScale * (d / pinch.d)));
    state.scale = newScale;
    state.tx = lx - ptX * newScale;
    state.ty = ly - ptY * newScale;
    applyTransform();
  }
}, {passive:false});

svg.addEventListener('touchend', () => { pinch = null; });

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const box = container.getBoundingClientRect();
  zoomBy(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX - box.left, e.clientY - box.top);
}, {passive:false});

svg.addEventListener('click', e => {
  if(!e.target.closest('.node') && !dragMoved){
    closePanel();
    if(state.searchMatches.length && state.searchIndex === 0 && state.searchMatches.length > 1){
      // اترك الإضاءة إذا كانت من highlightPathToRoot
    } else if(state.searchMatches.length){
      clearSearch();
    }
  }
});

/* ============================================================
   10) البحث
   ============================================================ */
const searchInput = $('searchInput');
const searchBox = $('searchBox');
const searchResults = $('searchResults');
const searchCounter = $('searchCounter');
const searchNav = $('searchNav');
const searchCurrent = $('searchCurrent');
const searchTotal = $('searchTotal');
const searchPrev = $('searchPrev');
const searchNext = $('searchNext');

let searchTimer = null;

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => performSearch(searchInput.value), 200);
});

searchInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    if(e.shiftKey) prevResult();
    else nextResult();
  }
  if(e.key === 'Escape'){
    e.preventDefault();
    clearSearch();
    searchInput.blur();
  }
});

searchPrev.onclick = prevResult;
searchNext.onclick = nextResult;

function performSearch(query){
  const q = (query || '').trim();
  searchBox.classList.toggle('has-value', q.length > 0);

  if(!q){
    clearSearch();
    return;
  }

  const lowerQ = q.toLowerCase();
  const matches = [];
  state.people.forEach(p => {
    const name = (p.name || '').toLowerCase();
    const idStr = String(p.id);
    if(name.includes(lowerQ) || idStr.includes(q.replace('#', ''))){
      matches.push(Number(p.id));
    }
  });

  matches.sort((a, b) => {
    const pa = state.byId.get(a), pb = state.byId.get(b);
    const na = (pa?.name || '').toLowerCase();
    const nb = (pb?.name || '').toLowerCase();
    const aStart = na.startsWith(lowerQ) ? 0 : 1;
    const bStart = nb.startsWith(lowerQ) ? 0 : 1;
    if(aStart !== bStart) return aStart - bStart;
    return na.localeCompare(nb);
  });

  state.searchMatches = matches;
  state.searchIndex = matches.length ? 0 : -1;

  renderSearchUI(q);
  render();

  if(matches.length){
    setTimeout(() => centerOn(matches[0]), 150);
  }
}

function renderSearchUI(q){
  const total = state.searchMatches.length;

  if(total > 0){
    searchCounter.classList.add('show');
    searchNav.classList.add('show');
    searchCurrent.textContent = state.searchIndex + 1;
    searchTotal.textContent = total;
    searchPrev.disabled = total <= 1;
    searchNext.disabled = total <= 1;
  }else{
    searchCounter.classList.remove('show');
    searchNav.classList.remove('show');
  }

  if(!q || total === 0){
    if(q && total === 0){
      searchResults.classList.remove('hidden');
      searchResults.innerHTML = `
        <div class="sr-empty">
          <span class="emoji">🔍</span>
          لا توجد نتائج لـ «${escapeHtml(q)}»
        </div>`;
    }else{
      searchResults.classList.add('hidden');
    }
    return;
  }

  searchResults.classList.remove('hidden');
  const headerHtml = `
    <div class="sr-header">
      <div><b>${total}</b> نتيجة</div>
      <div class="sr-hint">
        <kbd>Enter</kbd> التالي
        <kbd>Esc</kbd> مسح
      </div>
    </div>`;

  const itemsHtml = state.searchMatches.map((id, i) => {
    const p = state.byId.get(id);
    if(!p) return '';
    const depth = state.depth.get(id) || 0;
    const initial = (p.name||'؟').trim().charAt(0) || '؟';
    const genderClass = p.gender === 'male' ? 'male' : p.gender === 'female' ? 'female' : 'unknown';
    const highlighted = highlightMatch(p.name || '', q);
    const father = p.father_id ? state.byId.get(Number(p.father_id)) : null;
    return `
      <div class="sr-item ${i === state.searchIndex ? 'active' : ''}" data-id="${id}">
        <div class="sr-avatar ${genderClass}">${escapeHtml(initial)}</div>
        <div class="sr-info">
          <div class="sr-name">${highlighted}</div>
          <div class="sr-meta">
            <span class="sr-id">#${id}</span>
            <span class="sr-badge">ج${depth+1}</span>
            ${father ? `<span>الأب: ${escapeHtml(father.name||'—')}</span>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');

  searchResults.innerHTML = headerHtml + itemsHtml;

  searchResults.querySelectorAll('.sr-item').forEach(el => {
    el.onclick = () => {
      const id = Number(el.dataset.id);
      const idx = state.searchMatches.indexOf(id);
      if(idx >= 0) state.searchIndex = idx;
      updateActiveResult();
      centerOn(id);
      selectPerson(id);
      searchResults.classList.add('hidden');
    };
  });
}

function highlightMatch(name, query){
  if(!query) return escapeHtml(name);
  const lower = name.toLowerCase();
  const q = query.toLowerCase();
  const idx = lower.indexOf(q);
  if(idx < 0) return escapeHtml(name);
  const before = name.slice(0, idx);
  const match = name.slice(idx, idx + q.length);
  const after = name.slice(idx + q.length);
  return `${escapeHtml(before)}<mark>${escapeHtml(match)}</mark>${escapeHtml(after)}`;
}

function updateActiveResult(){
  searchResults.querySelectorAll('.sr-item').forEach((el, i) => {
    el.classList.toggle('active', i === state.searchIndex);
  });
  searchCurrent.textContent = state.searchIndex + 1;
  const active = searchResults.querySelector('.sr-item.active');
  if(active) active.scrollIntoView({block:'nearest', behavior:'smooth'});
}

function nextResult(){
  if(!state.searchMatches.length) return;
  state.searchIndex = (state.searchIndex + 1) % state.searchMatches.length;
  updateActiveResult();
  const id = state.searchMatches[state.searchIndex];
  render();
  setTimeout(() => centerOn(id), 100);
  const p = state.byId.get(id);
  toast(`🔍 ${state.searchIndex+1}/${state.searchMatches.length}: ${p?.name} (#${id})`);
}

function prevResult(){
  if(!state.searchMatches.length) return;
  state.searchIndex = (state.searchIndex - 1 + state.searchMatches.length) % state.searchMatches.length;
  updateActiveResult();
  const id = state.searchMatches[state.searchIndex];
  render();
  setTimeout(() => centerOn(id), 100);
  const p = state.byId.get(id);
  toast(`🔍 ${state.searchIndex+1}/${state.searchMatches.length}: ${p?.name} (#${id})`);
}

function clearSearch(){
  searchInput.value = '';
  searchBox.classList.remove('has-value');
  searchResults.classList.add('hidden');
  searchCounter.classList.remove('show');
  searchNav.classList.remove('show');
  state.searchMatches = [];
  state.searchIndex = -1;
  render();
}

$('clearSearch').onclick = () => {
  clearSearch();
  searchInput.focus();
};

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   11) إحصائيات
   ============================================================ */
function updateStats(){
  $('st-people').textContent = state.people.length;
  $('st-gens').textContent = state.maxGen + 1;
  $('st-roots').textContent = state.roots.length;
}

/* ============================================================
   12) أزرار
   ============================================================ */
$('btn-fit').onclick = () => fitToScreen();
$('btn-zoom-in').onclick = () => zoomBy(1.3);
$('btn-zoom-out').onclick = () => zoomBy(1/1.3);
$('btn-reset').onclick = () => { state.tx=0; state.ty=0; state.scale=1; applyTransform(); };
$('btn-up').onclick = () => { state.ty += 150; applyTransform(); };
$('btn-down').onclick = () => { state.ty -= 150; applyTransform(); };
$('closePanel').onclick = closePanel;
$('exitFocusBtn').onclick = exitFocus;

$('btn-theme').onclick = () => {
  state.dark = !state.dark;
  document.documentElement.classList.toggle('dark', state.dark);
  $('btn-theme').textContent = state.dark ? '☀️' : '🌙';
  try{ localStorage.setItem('ft-theme', state.dark ? 'dark' : 'light'); }catch{}
};

try{
  const saved = localStorage.getItem('ft-theme');
  if(saved === 'dark'){
    state.dark = true;
    document.documentElement.classList.add('dark');
    $('btn-theme').textContent = '☀️';
  }
}catch{}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if($('detailModal').classList.contains('show')){ $('detailModal').classList.remove('show'); return; }
    if(!searchResults.classList.contains('hidden')){ clearSearch(); return; }
    if($('infoPanel').classList.contains('open')) closePanel();
    else if(state.focusId != null) exitFocus();
  }
  if(e.key === 'f' || e.key === 'F') fitToScreen();
  if(e.key === '+' || e.key === '=') zoomBy(1.2);
  if(e.key === '-') zoomBy(1/1.2);
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
});

/* ============================================================
   13) Toast
   ============================================================ */
let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ============================================================
   14) Resize
   ============================================================ */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { render(); fitToScreen(); }, 250);
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => { render(); fitToScreen(); }, 350);
});

/* ============================================================
   15) حماية
   ============================================================ */
(function protect(){
  window.addEventListener('beforeprint', (e) => {
    e.preventDefault(); e.stopPropagation(); protectMsg('🔒 الطباعة معطلة'); return false;
  }, true);
  window.print = function(){ protectMsg('🔒 الطباعة معطلة'); return false; };

  document.addEventListener('keydown', (e) => {
    const key = e.key ? e.key.toLowerCase() : '';
    const ctrl = e.ctrlKey || e.metaKey;
    const shift = e.shiftKey;
    if(ctrl && key === 'p'){ e.preventDefault(); e.stopPropagation(); protectMsg('🔒 الطباعة معطلة'); return false; }
    if(ctrl && key === 's'){ e.preventDefault(); e.stopPropagation(); protectMsg('💾 الحفظ معطل'); return false; }
    if(ctrl && shift && key === 's'){ e.preventDefault(); e.stopPropagation(); protectMsg('📸 التصوير معطل'); return false; }
    if(ctrl && key === 'a'){
      const tag = document.activeElement?.tagName;
      if(tag !== 'INPUT' && tag !== 'TEXTAREA'){ e.preventDefault(); return false; }
    }
    if(e.key === 'F12' || e.keyCode === 123){ e.preventDefault(); e.stopPropagation(); protectMsg('🚫 أدوات المطور'); return false; }
    if(ctrl && shift && ['i','j','c'].includes(key)){ e.preventDefault(); e.stopPropagation(); protectMsg('🚫 أدوات المطور'); return false; }
    if(ctrl && key === 'u'){ e.preventDefault(); e.stopPropagation(); return false; }
    if(e.key === 'PrintScreen' || e.keyCode === 44){
      e.preventDefault();
      try{ navigator.clipboard.writeText(''); }catch(_){}
      protectMsg('📸 التصوير معطل'); return false;
    }
    if(e.metaKey && e.shiftKey && ['3','4','5'].includes(key)){
      e.preventDefault(); e.stopPropagation(); protectMsg('📸 التصوير معطل'); return false;
    }
  }, true);

  document.addEventListener('keyup', (e) => {
    if(e.key === 'PrintScreen' || e.keyCode === 44){
      e.preventDefault();
      try{ navigator.clipboard.writeText(''); }catch(_){}
      protectMsg('📸 التصوير معطل'); return false;
    }
  }, true);

  document.addEventListener('contextmenu', (e) => {
    e.preventDefault(); e.stopPropagation(); protectMsg('🚫 القائمة معطلة'); return false;
  }, true);

  document.addEventListener('dragstart', (e) => { e.preventDefault(); return false; }, true);

  document.addEventListener('visibilitychange', () => {
    if(document.hidden) document.body.classList.add('protect-blur');
    else setTimeout(() => document.body.classList.remove('protect-blur'), 300);
  });

  let devtoolsOpen = false;
  setInterval(() => {
    const t = 160;
    const wD = window.outerWidth - window.innerWidth;
    const hD = window.outerHeight - window.innerHeight;
    if(wD > t || hD > t){
      if(!devtoolsOpen){ devtoolsOpen = true; protectMsg('🚫 أدوات المطور'); document.body.classList.add('protect-blur'); }
    } else if(devtoolsOpen){ devtoolsOpen = false; document.body.classList.remove('protect-blur'); }
  }, 1000);

  document.addEventListener('copy', (e) => {
    const tag = document.activeElement?.tagName;
    if(tag !== 'INPUT' && tag !== 'TEXTAREA'){
      e.preventDefault();
      try{ e.clipboardData?.setData('text/plain',''); }catch(_){}
      protectMsg('📋 النسخ معطل'); return false;
    }
  }, true);

  document.addEventListener('cut', (e) => {
    const tag = document.activeElement?.tagName;
    if(tag !== 'INPUT' && tag !== 'TEXTAREA'){ e.preventDefault(); return false; }
  }, true);

  let msgTimer = null;
  function protectMsg(text){
    let msg = document.getElementById('_protect_msg');
    if(!msg){
      msg = document.createElement('div');
      msg.id = '_protect_msg';
      msg.style.cssText = `
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(.9);
        background: linear-gradient(135deg, #dc2626, #b91c1c);
        color: #fff; padding: 16px 26px; border-radius: 14px;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        font-size: 15px; font-weight: 800;
        box-shadow: 0 20px 60px rgba(220,38,38,.5);
        z-index: 2147483647; opacity: 0;
        transition: opacity .25s ease, transform .25s ease;
        pointer-events: none; direction: rtl; text-align: center;
        max-width: 90vw;
      `;
      document.body.appendChild(msg);
    }
    msg.textContent = text;
    msg.style.opacity = '1';
    msg.style.transform = 'translate(-50%, -50%) scale(1)';
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => {
      msg.style.opacity = '0';
      msg.style.transform = 'translate(-50%, -50%) scale(.9)';
    }, 1800);
  }

  document.addEventListener('selectstart', (e) => {
    const tag = e.target?.tagName;
    if(tag !== 'INPUT' && tag !== 'TEXTAREA'){ e.preventDefault(); return false; }
  }, true);
})();

loadData();
</script>
