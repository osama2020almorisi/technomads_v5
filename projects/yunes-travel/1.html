<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>جاري التحقق من التحديثات...</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  .card {
    background: #1e293b;
    padding: 40px 28px;
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    max-width: 440px;
    width: 100%;
    border: 1px solid #334155;
  }
  .icon {
    width: 60px; height: 60px;
    border: 4px solid #38bdf8;
    border-top-color: transparent;
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; margin: 0 0 10px; color: #38bdf8; }
  p { font-size: 14px; line-height: 1.8; color: #94a3b8; margin: 6px 0; }
  .status { font-size: 13px; color: #64748b; min-height: 20px; margin-top: 14px; }
  .btn {
    display: inline-block;
    margin-top: 22px;
    padding: 11px 26px;
    background: #38bdf8;
    color: #0f172a;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: background .2s;
  }
  .btn:hover { background: #0ea5e9; }
  .hidden { display: none; }
  .safe { font-size: 12px; color: #22c55e; margin-top: 18px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon"></div>
  <h1 id="title">جاري التحقق من التحديثات</h1>
  <p id="msg">نبحث عن أحدث إصدار من المشروع...</p>
  <p class="status" id="status"></p>
  <a href="/" class="btn hidden" id="btn">الانتقال إلى المشروع</a>
  <p class="safe">🔒 بياناتك محفوظة ولن تُحذف</p>
</div>

<script>
(function () {
  "use strict";

  // ===== الإعدادات =====
  // المسار الذي يُرجع رقم الإصدار (ملف ثابت أو API)
  var VERSION_URL = "/version.json";
  // المفتاح الذي نخزن فيه الإصدار (خاص بهذه الصفحة فقط)
  var STORAGE_KEY = "__app_version__";
  // الصفحة الرئيسية التي نعيد التوجيه إليها
  var HOME_URL = "/";

  var statusEl = document.getElementById("status");
  var msgEl = document.getElementById("msg");
  var titleEl = document.getElementById("title");
  var iconEl = document.getElementById("icon");
  var btn = document.getElementById("btn");

  function log(t) {
    statusEl.textContent = t;
    try { console.log("[CheckUpdate]", t); } catch (e) {}
  }

  function goHome(version) {
    // إعادة التوجيه مع معامل الإصدار لكسر التخزين المؤقت للصفحة فقط
    var target = HOME_URL + "?v=" + encodeURIComponent(version || Date.now());
    log("جاري فتح أحدث إصدار...");
    // replace بدلاً من href لكي لا يبقى زر الرجوع عالقاً في صفحة التحديث
    window.location.replace(target);
  }

  function showButton(version) {
    iconEl.classList.add("hidden");
    titleEl.textContent = "التحديث جاهز";
    msgEl.textContent = "اضغط الزر للانتقال إلى أحدث إصدار من المشروع.";
    btn.classList.remove("hidden");
    var target = HOME_URL + "?v=" + encodeURIComponent(version || Date.now());
    btn.href = target;
    // في حال فشل window.location.replace، زر احتياطي
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      window.location.replace(target);
    });
  }

  // ===== المحاولة =====
  (async function () {
    try {
      log("طلب رقم الإصدار من الخادم...");

      // طلب الملف مع كسر التخزين المؤقت لضمان أحدث نسخة
      var url = VERSION_URL + "?t=" + Date.now();
      var res = await fetch(url, {
        cache: "no-store",
        headers: { "Cache-Control": "no-cache" }
      });

      if (!res.ok) throw new Error("HTTP " + res.status);

      var text = (await res.text()).trim();

      // دعم صيغتين: نص خام أو JSON {version: "..."}
      var serverVersion = text;
      try {
        var json = JSON.parse(text);
        if (json && json.version) serverVersion = String(json.version);
      } catch (e) {}

      if (!serverVersion) throw new Error("إصدار فارغ");

      log("الإصدار على الخادم: " + serverVersion);

      var localVersion = "";
      try { localVersion = localStorage.getItem(STORAGE_KEY) || ""; } catch (e) {}

      if (localVersion && localVersion === serverVersion) {
        // لا يوجد تحديث
        log("لديك أحدث إصدار بالفعل.");
        iconEl.classList.add("hidden");
        titleEl.textContent = "أنت محدّث ✅";
        msgEl.textContent = "لا توجد تحديثات جديدة. سيتم نقلك للمشروع...";
        setTimeout(function () { goHome(serverVersion); }, 700);
        setTimeout(function () { showButton(serverVersion); }, 2500);
      } else {
        // يوجد تحديث
        log("تم اكتشاف تحديث جديد! جاري التحضير...");
        msgEl.textContent = "تم العثور على إصدار أحدث. يتم تحضيره...";
        try { localStorage.setItem(STORAGE_KEY, serverVersion); } catch (e) {}
        setTimeout(function () { goHome(serverVersion); }, 700);
        setTimeout(function () { showButton(serverVersion); }, 2500);
      }

    } catch (err) {
      // فشل الاتصال أو عدم وجود version.json → ننتقل للمشروع بأمان دون أي مسح
      try { console.warn("[CheckUpdate]", err); } catch (e) {}
      log("تعذر التحقق، سيتم فتح المشروع مباشرة.");
      msgEl.textContent = "لم نتمكن من التحقق من الإصدار، لكن كل شيء يعمل. سيتم فتح المشروع...";
      setTimeout(function () { goHome(Date.now()); }, 900);
      setTimeout(function () { showButton(Date.now()); }, 2500);
    }
  })();
})();
</script>
</body>
</html>
