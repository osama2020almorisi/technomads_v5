<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحاسب المالي Pro - تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <style>
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--primary-600) 0%, var(--primary-800) 50%, var(--gray-900) 100%); padding: var(--space-6); position: relative; overflow: hidden; }
    .auth-page::before { content: ''; position: absolute; width: 600px; height: 600px; background: rgba(255,255,255,0.03); border-radius: 50%; top: -200px; left: -200px; }
    .auth-page::after { content: ''; position: absolute; width: 400px; height: 400px; background: rgba(255,255,255,0.02); border-radius: 50%; bottom: -100px; right: -100px; }
    .auth-card { position: relative; z-index: 1; background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); border-radius: var(--radius-2xl); padding: var(--space-10); width: 100%; max-width: 440px; box-shadow: var(--shadow-xl); border: 1px solid rgba(255,255,255,0.3); }
    .auth-logo { width: 64px; height: 64px; border-radius: var(--radius-xl); background: linear-gradient(135deg, var(--primary-500), var(--primary-700)); display: flex; align-items: center; justify-content: center; color: white; font-size: var(--font-size-2xl); margin: 0 auto var(--space-6); box-shadow: 0 8px 24px rgba(79,70,229,0.3); }
    .auth-title { text-align: center; font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); color: var(--gray-900); margin-bottom: var(--space-2); }
    .auth-subtitle { text-align: center; color: var(--gray-500); margin-bottom: var(--space-8); }
    .auth-footer { text-align: center; margin-top: var(--space-6); padding-top: var(--space-6); border-top: 1px solid var(--gray-200); font-size: var(--font-size-sm); color: var(--gray-500); }
    .auth-footer a { color: var(--primary-600); font-weight: var(--font-weight-medium); text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    .auth-error { display: none; background: var(--danger-50); border: 1px solid var(--danger-200); color: var(--danger-700); padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); margin-bottom: var(--space-4); font-size: var(--font-size-sm); }
    .remember-me { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); }
    .remember-me input { width: 16px; height: 16px; accent-color: var(--primary-600); }
    .remember-me label { font-size: var(--font-size-sm); color: var(--gray-600); cursor: pointer; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card animate-fade-in-up">
      <div class="auth-logo"><i class="fas fa-calculator"></i></div>
      <h1 class="auth-title">المحاسب المالي Pro</h1>
      <p class="auth-subtitle">نظام محاسبة متكامل للأعمال</p>

      <div class="auth-error" id="authError"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">البريد الإلكتروني</label>
          <div class="input-icon-wrapper">
            <input type="email" class="form-input" name="email" placeholder="أدخل بريدك الإلكتروني" required>
            <i class="fas fa-envelope"></i>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <div class="input-icon-wrapper">
            <input type="password" class="form-input" name="password" placeholder="أدخل كلمة المرور" required>
            <i class="fas fa-lock"></i>
          </div>
        </div>
        <div class="remember-me">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">تذكرني</label>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: var(--space-6);">
          <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
        </button>
      </form>

      <div class="auth-footer">
        <p>ليس لديك حساب؟ <a href="pages/auth/register.html">إنشاء حساب جديد</a></p>
      </div>
    </div>
  </div>

  <script src="js/core/storage.js"></script>
  <script src="js/utils/helpers.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/modules/auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('SW ready'))
          .catch(() => console.log('SW failed'));
      });
    }
  </script>
</body>
</html>
