<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة منتج - المحاسب المالي Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/design-system.css">
</head>
<body>
  <script src="../../js/core/storage.js"></script>
  <script src="../../js/utils/helpers.js"></script>
  <script src="../../js/core/ui.js"></script>
  <script src="../../js/core/app.js"></script>
  <script src="../../js/modules/products.js"></script>

  <div class="content-area">
    <div class="page-header">
      <div class="page-header-left">
        <h1 class="page-header-title">إضافة منتج/خدمة جديدة</h1>
      </div>
      <div class="page-header-actions">
        <a href="list.html" class="btn btn-secondary"><i class="fas fa-arrow-right"></i> العودة</a>
      </div>
    </div>

    <div class="card" style="max-width: 800px;">
      <div class="card-body">
        <form id="productForm">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">الاسم <span class="required">*</span></label>
              <input type="text" class="form-input" name="name" required>
            </div>
            <div class="form-group">
              <label class="form-label">النوع</label>
              <select class="form-select" name="type">
                <option value="product">منتج</option>
                <option value="service">خدمة</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">الوصف</label>
            <textarea class="form-textarea" name="description" rows="2"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">السعر <span class="required">*</span></label>
              <input type="number" class="form-input" name="price" min="0" step="0.01" required>
            </div>
            <div class="form-group">
              <label class="form-label">التكلفة</label>
              <input type="number" class="form-input" name="cost" min="0" step="0.01" value="0">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">الفئة</label>
              <input type="text" class="form-input" name="category" placeholder="مثال: خدمات، برمجيات">
            </div>
            <div class="form-group">
              <label class="form-label">الوحدة</label>
              <input type="text" class="form-input" name="unit" placeholder="مثال: قطعة، ساعة">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">المخزون (للمنتجات فقط)</label>
            <input type="number" class="form-input" name="stock" min="0" placeholder="اتركه فارغاً للخدمات">
          </div>
          <div style="display: flex; gap: 12px; margin-top: 16px;">
            <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save"></i> حفظ</button>
            <a href="list.html" class="btn btn-secondary btn-lg">إلغاء</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
