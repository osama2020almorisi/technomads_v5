<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة عميل - المحاسب المالي Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/design-system.css">
</head>
<body>
  <script src="../../js/core/storage.js"></script>
  <script src="../../js/utils/helpers.js"></script>
  <script src="../../js/core/ui.js"></script>
  <script src="../../js/core/app.js"></script>
  <script src="../../js/modules/customers.js"></script>

  <div class="content-area">
    <div class="page-header">
      <div class="page-header-left">
        <h1 class="page-header-title">تعديل بيانات العميل</h1>
      </div>
      <div class="page-header-actions">
        <a href="list.html" class="btn btn-secondary"><i class="fas fa-arrow-right"></i> العودة</a>
      </div>
    </div>

    <div class="card" style="max-width: 800px;">
      <div class="card-body">
        <form id="customerForm">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">اسم العميل <span class="required">*</span></label>
              <input type="text" class="form-input" name="name" required>
            </div>
            <div class="form-group">
              <label class="form-label">الرقم الضريبي</label>
              <input type="text" class="form-input" name="taxNumber" placeholder="300xxxxxxxxxxxxx">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">البريد الإلكتروني</label>
              <input type="email" class="form-input" name="email">
            </div>
            <div class="form-group">
              <label class="form-label">الهاتف</label>
              <input type="tel" class="form-input" name="phone">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">العنوان</label>
            <input type="text" class="form-input" name="address">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">الرصيد الافتتاحي</label>
              <input type="number" class="form-input" name="balance" value="0" min="0" step="0.01">
            </div>
            <div class="form-group">
              <label class="form-label">الحالة</label>
              <select class="form-select" name="status">
                <option value="active">نشط</option>
                <option value="inactive">غير نشط</option>
              </select>
            </div>
          </div>
          <div style="display: flex; gap: 12px; margin-top: 16px;">
            <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save"></i> حفظ</button>
            <a href="list.html" class="btn btn-secondary btn-lg">إلغاء</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
