<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة منتج جديد - متجر إلكتروني</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #1abc9c;
            --light-color: #f8f9fa;
            --dark-color: #2c3e50;
            --gray-color: #7f8c8d;
            --border-color: #e1e4e8;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --info-color: #3498db;
            --transition-speed: 0.3s;
            --bg-color: #f5f7fa;
            --card-bg: white;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', Arial, sans-serif;
            line-height: 1.6;
            background-color: var(--bg-color);
            color: var(--dark-color);
            direction: rtl;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), #3d566e);
            color: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header h1 i {
            color: var(--secondary-color);
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .auth-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 6px;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--secondary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .login-btn, .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all var(--transition-speed);
        }

        .login-btn:hover, .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all var(--transition-speed);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .product-form {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .form-section {
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .section-title i {
            color: var(--secondary-color);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.7rem;
            font-weight: 600;
            color: var(--dark-color);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            transition: all var(--transition-speed);
            background-color: #f8fafc;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 0 4px rgba(26, 188, 156, 0.2);
            background-color: white;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .required::after {
            content: " *";
            color: var(--danger-color);
        }

        .upload-area {
            border: 2px dashed var(--secondary-color);
            padding: 2.5rem;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all var(--transition-speed);
            background-color: #f8fafc;
            margin-bottom: 1.5rem;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background-color: #e8f4f1;
        }

        .upload-area.highlight {
            border-color: var(--success-color);
            background-color: #e6f7f3;
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--secondary-color);
            margin-bottom: 1rem;
        }

        .upload-text {
            margin-bottom: 1rem;
            color: var(--dark-color);
        }

        .file-input {
            display: none;
        }

        .file-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all var(--transition-speed);
        }

        .file-btn:hover {
            background-color: #16a085;
            transform: translateY(-2px);
        }

        .file-types {
            color: var(--gray-color);
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        .image-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .preview-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: all var(--transition-speed);
        }

        .preview-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .preview-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .preview-actions {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            display: flex;
            gap: 0.5rem;
        }

        .preview-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            cursor: pointer;
            transition: all var(--transition-speed);
            font-size: 0.9rem;
        }

        .preview-btn:hover {
            transform: scale(1.1);
        }

        .preview-btn.delete {
            color: var(--danger-color);
        }

        .preview-btn.main {
            color: var(--success-color);
        }

        .preview-btn.main.active {
            background: var(--success-color);
            color: white;
        }

        .image-name {
            padding: 0.5rem;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 0.8rem;
            text-align: center;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .specs-container {
            margin-top: 1rem;
        }

        .spec-item {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: center;
        }

        .spec-input {
            flex: 1;
        }

        .remove-spec {
            color: var(--danger-color);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.5rem;
            transition: all var(--transition-speed);
        }

        .remove-spec:hover {
            transform: scale(1.1);
        }

        .add-spec {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            transition: all var(--transition-speed);
        }

        .add-spec:hover {
            background-color: #16a085;
            transform: translateY(-2px);
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .submit-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            transition: all var(--transition-speed);
        }

        .submit-btn:hover:not(:disabled) {
            background-color: #16a085;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(26, 188, 156, 0.3);
        }

        .submit-btn:disabled {
            background-color: var(--gray-color);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .reset-btn {
            background-color: var(--light-color);
            color: var(--dark-color);
            border: 1px solid var(--border-color);
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            transition: all var(--transition-speed);
        }

        .reset-btn:hover {
            background-color: #e9ecef;
            transform: translateY(-2px);
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s ease;
            max-width: 400px;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        .notification.success {
            background-color: var(--success-color);
        }

        .notification.error {
            background-color: var(--danger-color);
        }

        .notification.info {
            background-color: var(--info-color);
        }

        .progress-container {
            margin: 1.5rem 0;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #f8fafc;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        progress {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 0.5rem;
        }

        progress::-webkit-progress-bar {
            background-color: #e0e0e0;
            border-radius: 5px;
        }

        progress::-webkit-progress-value {
            background-color: var(--secondary-color);
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        .progress-details {
            display: flex;
            justify-content: space-between;
            color: var(--gray-color);
            font-size: 0.9rem;
        }

        /* Modal styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-speed);
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            position: relative;
            transform: translateY(-50px);
            transition: all var(--transition-speed);
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .close-modal {
            position: absolute;
            top: 1rem;
            left: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray-color);
            transition: all var(--transition-speed);
        }

        .close-modal:hover {
            color: var(--danger-color);
            transform: rotate(90deg);
        }

        .modal-title {
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .modal-form input {
            padding: 0.8rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Tajawal', sans-serif;
        }

        .modal-form input:focus {
            border-color: var(--secondary-color);
            outline: none;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        @media (max-width: 768px) {
            .container {
                margin: 1rem auto;
                padding: 0 0.5rem;
            }
            
            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
                padding: 1rem;
            }
            
            .header-actions {
                flex-direction: column;
                width: 100%;
            }
            
            .auth-section {
                width: 100%;
                justify-content: center;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .image-preview {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            
            .spec-item {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-plus-circle"></i> إضافة منتج جديد</h1>
            <div class="header-actions">
                <div class="auth-section" id="authSection">
                    <div class="user-info" id="userInfo" style="display: none;">
                        <div class="user-avatar" id="userAvatar"></div>
                        <span id="userName"></span>
                    </div>
                    <button class="login-btn" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                    </button>
                    <button class="logout-btn" id="logoutBtn" style="display: none;">
                        <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
                    </button>
                </div>
                <button class="back-btn" onclick="window.history.back()">
                    <i class="fas fa-arrow-right"></i> رجوع للمتجر
                </button>
            </div>
        </div>

        <form class="product-form" id="productForm">
            <!-- المعلومات الأساسية -->
            <div class="form-section">
                <h2 class="section-title"><i class="fas fa-info-circle"></i> المعلومات الأساسية</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="productName" class="required">اسم المنتج</label>
                        <input type="text" id="productName" required placeholder="أدخل اسم المنتج">
                    </div>
                    <div class="form-group">
                        <label for="productPrice" class="required">السعر (ريال يمني)</label>
                        <input type="number" id="productPrice" required placeholder="أدخل السعر" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label for="productCategory" class="required">الفئة</label>
                        <select id="productCategory" required>
                            <option value="">اختر الفئة...</option>
                            <option value="electronics">إلكترونيات</option>
                            <option value="clothing">ملابس</option>
                            <option value="home">منزلية</option>
                            <option value="books">كتب ووسائل تعليمية</option>
                            <option value="sports">رياضة</option>
                            <option value="beauty">جمال</option>
                            <option value="food">طعام</option>
                            <option value="toys">ألعاب</option>
                            <option value="jewelry">مجوهرات</option>
                            <option value="health">صحة</option>
                            <option value="cars">سيارات</option>
                            <option value="arts">فنون</option>
                            <option value="garden">حديقة</option>
                            <option value="tools">أدوات</option>
                            <option value="pets">حيوانات أليفة</option>
                            <option value="kids">مستلزمات أطفال</option>
                            <option value="stationery">قرطاسية ومكتب</option>
                            <option value="music">موسيقى</option>
                            <option value="travel">سفر</option>
                            <option value="other">أخرى</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="productCode">كود المنتج</label>
                        <input type="text" id="productCode" placeholder="يتم إنشاؤه تلقائياً" readonly>
                    </div>
                </div>
            </div>

            <!-- صور المنتج -->
            <div class="form-section">
                <h2 class="section-title"><i class="fas fa-images"></i> صور المنتج</h2>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <p class="upload-text">اسحب وأسقط الصور هنا أو انقر لاختيار الملفات</p>
                    <input type="file" id="fileInput" class="file-input" accept="image/*" multiple>
                    <label for="fileInput" class="file-btn">
                        <i class="fas fa-images"></i> اختر الصور
                    </label>
                    <p class="file-types">يدعم: JPG, PNG, GIF (الحد الأقصى 5MB لكل صورة)</p>
                </div>
                <div class="image-preview" id="imagePreview"></div>
            </div>

            <!-- الوصف والمواصفات -->
            <div class="form-section">
                <h2 class="section-title"><i class="fas fa-align-left"></i> الوصف والمواصفات</h2>
                <div class="form-group">
                    <label for="productDescription" class="required">وصف المنتج</label>
                    <textarea id="productDescription" required placeholder="أدخل وصفاً مفصلاً للمنتج..."></textarea>
                </div>
                
                <h3>المواصفات الإضافية</h3>
                <div class="specs-container" id="specsContainer">
                    <div class="spec-item">
                        <input type="text" class="spec-input" placeholder="اسم المواصفة (مثال: اللون)">
                        <input type="text" class="spec-input" placeholder="القيمة (مثال: أحمر)">
                        <button type="button" class="remove-spec"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                <button type="button" class="add-spec" id="addSpecBtn">
                    <i class="fas fa-plus"></i> إضافة مواصفة
                </button>
            </div>

            <!-- إعدادات التخزين -->
            <div class="form-section">
                <h2 class="section-title"><i class="fas fa-cog"></i> إعدادات التخزين</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="repoName">اسم المستودع</label>
                        <input type="text" id="repoName" value="fileuploader" placeholder="اسم المستودع على GitHub">
                    </div>
                    <div class="form-group">
                        <label for="targetFolder">مسار الحفظ</label>
                        <input type="text" id="targetFolder" value="products" placeholder="مسار حفظ المنتجات">
                    </div>
                    <div class="form-group">
                        <label for="branchName">اسم الفرع</label>
                        <select id="branchName">
                            <option value="main">main</option>
                            <option value="master">master</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- شريط التقدم -->
            <div class="progress-container" id="progressContainer" style="display: none;">
                <div class="progress-header">
                    <span>جاري رفع المنتج...</span>
                    <span id="progressText">0%</span>
                </div>
                <progress id="uploadProgress" value="0" max="100"></progress>
                <div class="progress-details">
                    <span id="uploadedSize">0 MB</span>
                    <span id="transferSpeed">0 MB/s</span>
                    <span id="timeRemaining">--</span>
                </div>
            </div>

            <!-- أزرار التنفيذ -->
            <div class="form-actions">
                <button type="reset" class="reset-btn">
                    <i class="fas fa-trash"></i> مسح الكل
                </button>
                <button type="submit" class="submit-btn" id="submitBtn" disabled>
                    <i class="fas fa-save"></i> حفظ المنتج
                </button>
            </div>
        </form>
    </div>

    <!-- نافذة تسجيل الدخول -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-modal" id="closeLoginModal">&times;</span>
            <h2 class="modal-title"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول إلى GitHub</h2>
            <form class="modal-form" id="loginForm">
                <input type="text" id="githubUsername" placeholder="اسم مستخدم GitHub" required>
                <input type="password" id="githubToken" placeholder="Token الوصول الشخصي" required>
                <small style="color: var(--gray-color); text-align: center; margin: 0.5rem 0;">
                    <a href="https://github.com/settings/tokens" target="_blank" style="color: var(--secondary-color);">
                        كيف أحصل على Token؟
                    </a>
                </small>
                <div class="modal-actions">
                    <button type="button" class="reset-btn" id="cancelLogin">إلغاء</button>
                    <button type="submit" class="submit-btn">تسجيل الدخول</button>
                </div>
            </form>
        </div>
    </div>

    <div class="notification" id="notification">
        <i class="fas fa-info-circle"></i>
        <span id="notificationMessage"></span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // عناصر DOM
            const productForm = document.getElementById('productForm');
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const imagePreview = document.getElementById('imagePreview');
            const addSpecBtn = document.getElementById('addSpecBtn');
            const specsContainer = document.getElementById('specsContainer');
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notificationMessage');
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const userInfo = document.getElementById('userInfo');
            const userAvatar = document.getElementById('userAvatar');
            const userName = document.getElementById('userName');
            const loginModal = document.getElementById('loginModal');
            const closeLoginModal = document.getElementById('closeLoginModal');
            const loginForm = document.getElementById('loginForm');
            const cancelLogin = document.getElementById('cancelLogin');
            const submitBtn = document.getElementById('submitBtn');
            const progressContainer = document.getElementById('progressContainer');
            const uploadProgress = document.getElementById('uploadProgress');
            const progressText = document.getElementById('progressText');
            const uploadedSize = document.getElementById('uploadedSize');
            const transferSpeed = document.getElementById('transferSpeed');
            const timeRemaining = document.getElementById('timeRemaining');
            const productCode = document.getElementById('productCode');

            // متغيرات التطبيق
            let uploadedImages = [];
            let mainImageIndex = 0;
            let githubToken = localStorage.getItem('githubToken') || '';
            let githubUsername = localStorage.getItem('githubUsername') || '';
            let startTime = null;
            let uploadedBytes = 0;
            let totalBytes = 0;

            // تهيئة الصفحة
            function init() {
                checkAuthStatus();
                generateProductCode();
                setupEventListeners();
                updateSubmitButton();
            }

            // إنشاء كود منتج فريد
            function generateProductCode() {
                const timestamp = Date.now().toString(36);
                const random = Math.random().toString(36).substr(2, 5);
                productCode.value = `PROD-${timestamp}-${random}`.toUpperCase();
            }

            // إعداد مستمعات الأحداث
            function setupEventListeners() {
                // سحب وإفلات الملفات
                uploadArea.addEventListener('dragover', handleDragOver);
                uploadArea.addEventListener('dragleave', handleDragLeave);
                uploadArea.addEventListener('drop', handleDrop);
                uploadArea.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', handleFileSelect);

                // المواصفات
                addSpecBtn.addEventListener('click', addSpecField);
                specsContainer.addEventListener('click', handleSpecActions);

                // المصادقة
                loginBtn.addEventListener('click', showLoginModal);
                logoutBtn.addEventListener('click', handleLogout);
                closeLoginModal.addEventListener('click', hideLoginModal);
                cancelLogin.addEventListener('click', hideLoginModal);
                loginForm.addEventListener('submit', handleLogin);

                // النموذج
                productForm.addEventListener('input', updateSubmitButton);
                productForm.addEventListener('submit', handleSubmit);
                productForm.addEventListener('reset', handleReset);

                // النقر خارج النافذة المنبثقة
                window.addEventListener('click', (e) => {
                    if (e.target === loginModal) hideLoginModal();
                });
            }

            // التحقق من حالة المصادقة
            function checkAuthStatus() {
                if (githubToken && githubUsername) {
                    loginBtn.style.display = 'none';
                    logoutBtn.style.display = 'flex';
                    userInfo.style.display = 'flex';
                    userAvatar.textContent = githubUsername.charAt(0).toUpperCase();
                    userName.textContent = githubUsername;
                    showNotification('مرحباً ' + githubUsername, 'success');
                } else {
                    loginBtn.style.display = 'flex';
                    logoutBtn.style.display = 'none';
                    userInfo.style.display = 'none';
                }
                updateSubmitButton();
            }

            // معالجة سحب الملفات
            function handleDragOver(e) {
                e.preventDefault();
                uploadArea.classList.add('highlight');
            }

            function handleDragLeave() {
                uploadArea.classList.remove('highlight');
            }

            function handleDrop(e) {
                e.preventDefault();
                uploadArea.classList.remove('highlight');
                handleFiles(e.dataTransfer.files);
            }

            function handleFileSelect() {
                handleFiles(fileInput.files);
            }

            // معالجة الملفات
            function handleFiles(files) {
                if (!files.length) return;

                const imageFiles = Array.from(files).filter(file => 
                    file.type.startsWith('image/') && file.size <= 5 * 1024 * 1024
                );

                if (imageFiles.length === 0) {
                    showNotification('الرجاء اختيار ملفات صور صالحة (أقل من 5MB)', 'error');
                    return;
                }

                imageFiles.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        // إعادة تسمية الملف لتجنب التكرار
                        const newName = generateImageName(file.name);
                        uploadedImages.push({
                            file: file,
                            dataUrl: e.target.result,
                            name: newName,
                            isMain: uploadedImages.length === 0
                        });
                        updateImagePreview();
                        updateSubmitButton();
                    };
                    reader.readAsDataURL(file);
                });
            }

            // إنشاء اسم فريد للصورة
            function generateImageName(originalName) {
                const extension = originalName.split('.').pop();
                const timestamp = Date.now();
                const random = Math.random().toString(36).substr(2, 5);
                return `product-${timestamp}-${random}.${extension}`;
            }

            // تحديث معاينة الصور
            function updateImagePreview() {
                imagePreview.innerHTML = '';
                
                uploadedImages.forEach((image, index) => {
                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview-item';
                    
                    previewItem.innerHTML = `
                        <img src="${image.dataUrl}" alt="معاينة الصورة">
                        <div class="preview-actions">
                            <button type="button" class="preview-btn delete" data-index="${index}">
                                <i class="fas fa-times"></i>
                            </button>
                            <button type="button" class="preview-btn main ${image.isMain ? 'active' : ''}" data-index="${index}">
                                <i class="fas fa-star"></i>
                            </button>
                        </div>
                        <div class="image-name">${image.name}</div>
                    `;
                    
                    imagePreview.appendChild(previewItem);
                });

                // إضافة أحداث للأزرار
                document.querySelectorAll('.preview-btn.delete').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const index = parseInt(e.currentTarget.dataset.index);
                        removeImage(index);
                    });
                });

                document.querySelectorAll('.preview-btn.main').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const index = parseInt(e.currentTarget.dataset.index);
                        setMainImage(index);
                    });
                });
            }

            // إزالة صورة
            function removeImage(index) {
                const wasMain = uploadedImages[index].isMain;
                uploadedImages.splice(index, 1);
                
                if (wasMain && uploadedImages.length > 0) {
                    uploadedImages[0].isMain = true;
                }
                
                updateImagePreview();
                updateSubmitButton();
            }

            // تعيين صورة رئيسية
            function setMainImage(index) {
                uploadedImages.forEach((img, i) => {
                    img.isMain = i === index;
                });
                updateImagePreview();
            }

            // إضافة حقل مواصفات
            function addSpecField() {
                const specItem = document.createElement('div');
                specItem.className = 'spec-item';
                specItem.innerHTML = `
                    <input type="text" class="spec-input" placeholder="اسم المواصفة">
                    <input type="text" class="spec-input" placeholder="القيمة">
                    <button type="button" class="remove-spec"><i class="fas fa-times"></i></button>
                `;
                specsContainer.appendChild(specItem);
            }

            // معالجة إجراءات المواصفات
            function handleSpecActions(e) {
                if (e.target.classList.contains('remove-spec') || e.target.closest('.remove-spec')) {
                    if (specsContainer.children.length > 1) {
                        e.target.closest('.spec-item').remove();
                    }
                }
            }

            // إظهار نافذة تسجيل الدخول
            function showLoginModal() {
                loginModal.classList.add('active');
            }

            function hideLoginModal() {
                loginModal.classList.remove('active');
                loginForm.reset();
            }

            // معالجة تسجيل الدخول
            async function handleLogin(e) {
                e.preventDefault();
                
                const username = document.getElementById('githubUsername').value.trim();
                const token = document.getElementById('githubToken').value.trim();
                
                if (!username || !token) {
                    showNotification('يرجى إدخال اسم المستخدم و Token', 'error');
                    return;
                }

                try {
                    // التحقق من صحة التوكن
                    const response = await fetch('https://api.github.com/user', {
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });

                    if (!response.ok) {
                        throw new Error('Token غير صالح أو لا يملك الصلاحيات المطلوبة');
                    }

                    // حفظ بيانات المستخدم
                    githubToken = token;
                    githubUsername = username;
                    localStorage.setItem('githubToken', token);
                    localStorage.setItem('githubUsername', username);

                    hideLoginModal();
                    checkAuthStatus();
                    showNotification('تم تسجيل الدخول بنجاح', 'success');

                } catch (error) {
                    showNotification('خطأ في تسجيل الدخول: ' + error.message, 'error');
                }
            }

            // معالجة تسجيل الخروج
            function handleLogout() {
                githubToken = '';
                githubUsername = '';
                localStorage.removeItem('githubToken');
                localStorage.removeItem('githubUsername');
                checkAuthStatus();
                showNotification('تم تسجيل الخروج', 'info');
            }

            // تحديث حالة زر الحفظ
            function updateSubmitButton() {
                const hasRequiredData = document.getElementById('productName').value &&
                                      document.getElementById('productPrice').value &&
                                      document.getElementById('productCategory').value &&
                                      document.getElementById('productDescription').value &&
                                      uploadedImages.length > 0;
                
                submitBtn.disabled = !hasRequiredData || !githubToken;
            }

            // معالجة إرسال النموذج
            async function handleSubmit(e) {
                e.preventDefault();
                
                if (!githubToken) {
                    showNotification('يرجى تسجيل الدخول أولاً', 'error');
                    showLoginModal();
                    return;
                }

                // جمع بيانات النموذج
                const formData = {
                    name: document.getElementById('productName').value,
                    price: parseFloat(document.getElementById('productPrice').value),
                    category: document.getElementById('productCategory').value,
                    code: productCode.value,
                    description: document.getElementById('productDescription').value,
                    repo: document.getElementById('repoName').value,
                    folder: document.getElementById('targetFolder').value,
                    branch: document.getElementById('branchName').value,
                    specs: {},
                    created_at: new Date().toISOString()
                };

                // جمع المواصفات
                const specItems = specsContainer.querySelectorAll('.spec-item');
                specItems.forEach(item => {
                    const inputs = item.querySelectorAll('.spec-input');
                    if (inputs[0].value && inputs[1].value) {
                        formData.specs[inputs[0].value] = inputs[1].value;
                    }
                });

                try {
                    // إعداد عملية الرفع
                    submitBtn.disabled = true;
                    progressContainer.style.display = 'block';
                    startTime = Date.now();
                    uploadedBytes = 0;
                    totalBytes = uploadedImages.reduce((total, img) => total + img.file.size, 0);

                    // إنشاء المنتج على GitHub
                    await createProductOnGitHub(formData);

                    showNotification('تم إضافة المنتج بنجاح', 'success');
                    
                    // إعادة تعيين النموذج بعد نجاح الرفع
                    setTimeout(() => {
                        productForm.reset();
                        uploadedImages = [];
                        updateImagePreview();
                        generateProductCode();
                        progressContainer.style.display = 'none';
                        submitBtn.disabled = false;
                    }, 2000);

                } catch (error) {
                    showNotification('خطأ في إضافة المنتج: ' + error.message, 'error');
                    submitBtn.disabled = false;
                    progressContainer.style.display = 'none';
                }
            }

            // إنشاء المنتج على GitHub
            async function createProductOnGitHub(productData) {
                // هذا مكان رفع المنتج إلى GitHub
                // سيتم تنفيذ عملية الرفع الفعلية هنا
                
                // محاكاة عملية الرفع للتقدم
                for (let i = 0; i <= 100; i += 5) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    updateProgress(i, totalBytes);
                }

                // هنا سيتم إضافة الكود الفعلي للرفع إلى GitHub
                return Promise.resolve();
            }

            // تحديث شريط التقدم
            function updateProgress(percent, totalSize) {
                uploadProgress.value = percent;
                progressText.textContent = `${percent}%`;
                
                const uploaded = (totalSize * percent) / 100;
                uploadedSize.textContent = formatFileSize(uploaded);
                
                const elapsed = (Date.now() - startTime) / 1000;
                const speed = elapsed > 0 ? uploaded / elapsed : 0;
                transferSpeed.textContent = `${formatFileSize(speed)}/s`;
                
                const remaining = speed > 0 ? (totalSize - uploaded) / speed : 0;
                timeRemaining.textContent = formatTime(remaining);
            }

            // تنسيق حجم الملف
            function formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' بايت';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' كيلوبايت';
                return (bytes / (1024 * 1024)).toFixed(1) + ' ميجابايت';
            }

            // تنسيق الوقت
            function formatTime(seconds) {
                if (seconds < 60) return Math.ceil(seconds) + ' ثانية';
                return Math.ceil(seconds / 60) + ' دقيقة';
            }

            // معالجة إعادة تعيين النموذج
            function handleReset() {
                uploadedImages = [];
                updateImagePreview();
                generateProductCode();
                setTimeout(updateSubmitButton, 0);
            }

            // عرض الإشعارات
            function showNotification(message, type) {
                notificationMessage.textContent = message;
                notification.className = `notification ${type} show`;
                
                const icon = notification.querySelector('i');
                icon.className = type === 'success' ? 'fas fa-check-circle' :
                               type === 'error' ? 'fas fa-exclamation-circle' :
                               'fas fa-info-circle';
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }

            // بدء التطبيق
            init();
        });
    </script>
</body>
</html>
