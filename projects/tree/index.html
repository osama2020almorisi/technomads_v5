<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌳 شجرة العائلة</title>
<style>
  :root{
    --bg-0:#05070d;
    --bg-1:#0a0f1c;
    --bg-2:#0f1628;
    --line:#1e2a44;
    --txt:#e6edf7;
    --txt-dim:#8b9bb4;
    --accent:#3b82f6;
    --accent-2:#8b5cf6;
    --glow:#60a5fa;
    --danger:#ef4444;
    --ok:#10b981;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg-0);color:var(--txt);
    font-family:'Segoe UI',Tahoma,system-ui,sans-serif}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  /* ===== شريط علوي ===== */
  .topbar{
    position:relative;z-index:20;
    display:flex;align-items:center;gap:8px;
    padding:10px 12px;
    background:linear-gradient(180deg,rgba(10,15,28,.98),rgba(10,15,28,.85));
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(10px);
  }
  .icon-btn{
    width:42px;height:42px;flex:0 0 auto;
    display:grid;place-items:center;
    border-radius:12px;border:1px solid var(--line);
    background:var(--bg-2);color:var(--txt);
    cursor:pointer;transition:.2s;font-size:18px;
  }
  .icon-btn:hover{background:#16213a;border-color:var(--accent);color:var(--glow)}
  .icon-btn.primary{background:linear-gradient(135deg,#0ea5e9,#2563eb);border-color:transparent;color:#fff}
  .search-box{
    flex:1;position:relative;display:flex;align-items:center;
    background:var(--bg-2);border:1px solid var(--line);
    border-radius:12px;padding:0 12px;height:42px;transition:.2s;
  }
  .search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  .search-box input{
    flex:1;background:transparent;border:0;outline:0;color:var(--txt);
    font-size:15px;padding:0 8px;
  }
  .search-box input::placeholder{color:var(--txt-dim)}
  .search-box .s-icon{color:var(--txt-dim);font-size:16px}
  .search-box .clear-btn{display:none;cursor:pointer;color:var(--txt-dim)}
  .search-box.has-value .clear-btn{display:block}

  /* ===== إحصائيات ===== */
  .stats{
    position:absolute;top:64px;left:12px;right:12px;z-index:15;
    display:flex;gap:8px;justify-content:flex-end;pointer-events:none;
  }
  .stat-card{
    pointer-events:auto;
    min-width:82px;padding:8px 12px;border-radius:14px;
    background:rgba(15,22,40,.85);border:1px solid var(--line);
    backdrop-filter:blur(8px);text-align:center;transition:.2s;
  }
  .stat-card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .stat-card .num{font-size:20px;font-weight:800;color:var(--glow);line-height:1}
  .stat-card .lbl{font-size:11px;color:var(--txt-dim);margin-top:3px}

  /* ===== أدوات تحكم ===== */
  .controls{
    position:absolute;bottom:20px;left:16px;z-index:15;
    display:flex;flex-direction:column;gap:8px;
  }
  .ctrl-btn{
    width:46px;height:46px;border-radius:14px;
    background:rgba(15,22,40,.9);border:1px solid var(--line);
    color:var(--txt);font-size:20px;cursor:pointer;
    display:grid;place-items:center;transition:.2s;
    backdrop-filter:blur(8px);
  }
  .ctrl-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.05)}
  .ctrl-btn.zoom-label{font-size:13px;font-weight:700}

  /* ===== لوحة تفاصيل ===== */
  .info-panel{
    position:absolute;top:0;right:0;bottom:0;width:320px;max-width:85vw;
    background:linear-gradient(180deg,rgba(10,15,28,.98),rgba(15,22,40,.98));
    border-right:1px solid var(--line);
    transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);
    z-index:30;display:flex;flex-direction:column;
    backdrop-filter:blur(14px);
  }
  .info-panel.open{transform:translateX(0)}
  .info-head{
    padding:16px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;
  }
  .avatar{
    width:52px;height:52px;border-radius:50%;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    display:grid;place-items:center;font-size:22px;color:#fff;
    border:2px solid rgba(255,255,255,.2);flex:0 0 auto;
  }
  .info-head .name{font-size:18px;font-weight:800}
  .info-head .sub{font-size:12px;color:var(--txt-dim);margin-top:2px}
  .info-body{padding:16px;overflow-y:auto;flex:1}
  .info-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;
  }
  .info-row .k{color:var(--txt-dim)}
  .info-row .v{font-weight:600}
  .badge{
    display:inline-block;padding:3px 10px;border-radius:20px;
    font-size:11px;font-weight:700;
  }
  .badge.male{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
  .badge.female{background:rgba(236,72,153,.15);color:#f472b6;border:1px solid rgba(236,72,153,.3)}
  .badge.unknown{background:rgba(139,155,180,.15);color:#8b9bb4;border:1px solid rgba(139,155,180,.3)}
  .focus-btn{
    width:100%;margin-top:16px;padding:12px;border-radius:12px;
    background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;
    border:0;font-size:14px;font-weight:700;cursor:pointer;transition:.2s;
  }
  .focus-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,99,235,.4)}
  .focus-btn.exit{background:linear-gradient(135deg,#ef4444,#b91c1c)}
  .close-panel{
    position:absolute;top:12px;left:12px;width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,.08);border:0;color:var(--txt);cursor:pointer;
    display:grid;place-items:center;font-size:16px;
  }

  /* ===== SVG ===== */
  #svg{flex:1;width:100%;display:block;cursor:grab;touch-action:none}
  #svg.grabbing{cursor:grabbing}

  .node{cursor:pointer}
  .node rect{
    transition:filter .25s,stroke .25s,stroke-width .25s;
  }
  .node:hover rect{filter:url(#hoverGlow)}
  .node text{
    pointer-events:none;user-select:none;
    font-family:'Segoe UI',Tahoma,sans-serif;
  }
  .node .n-name{font-weight:700;font-size:13px;fill:#fff}
  .node .n-meta{font-size:10px;fill:#b8c5d8}
  .node.focused rect{
    stroke:#fbbf24 !important;
    stroke-width:3.5 !important;
    filter:url(#focusGlow);
  }
  .node.dimmed{opacity:.12;pointer-events:none;transition:opacity .4s}
  .link{fill:none;stroke-linecap:round;transition:opacity .3s}
  .link.dimmed{opacity:.06}

  /* ===== شاشة تحميل ===== */
  #loader{
    position:fixed;inset:0;background:var(--bg-0);z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    transition:opacity .5s;
  }
  #loader.hide{opacity:0;pointer-events:none}
  .spinner{
    width:56px;height:56px;border-radius:50%;
    border:4px solid rgba(59,130,246,.15);
    border-top-color:var(--accent);animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader p{color:var(--txt-dim);font-size:14px}

  /* ===== Toast ===== */
  #toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);
    background:rgba(15,22,40,.95);border:1px solid var(--accent);
    color:var(--txt);padding:10px 20px;border-radius:12px;font-size:13px;
    opacity:0;transition:.3s;z-index:50;pointer-events:none;
    backdrop-filter:blur(8px);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== موبايل ===== */
  @media(max-width:600px){
    .stat-card{min-width:66px;padding:6px 9px}
    .stat-card .num{font-size:16px}
    .stat-card .lbl{font-size:10px}
    .info-panel{width:280px}
    .node .n-name{font-size:11px}
    .node .n-meta{font-size:9px}
  }
</style>
</head>
<body>
<div id="app">

  <!-- شريط علوي -->
  <div class="topbar">
    <div class="icon-btn primary" id="btn-info" title="معلومات">ℹ</div>
    <div class="icon-btn" id="btn-home" title="الصفحة الرئيسية">🏠</div>
    <div class="icon-btn" id="btn-fit" title="ملاءمة الشاشة">⛶</div>
    <div class="search-box" id="searchBox">
      <span class="s-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="ابحث عن اسم...">
      <span class="clear-btn" id="clearSearch">✕</span>
    </div>
    <div class="icon-btn" id="btn-theme" title="الألوان">🌿</div>
  </div>

  <!-- إحصائيات -->
  <div class="stats">
    <div class="stat-card"><div class="num" id="st-people">0</div><div class="lbl">الأفراد</div></div>
    <div class="stat-card"><div class="num" id="st-gens">0</div><div class="lbl">الأجيال</div></div>
    <div class="stat-card"><div class="num" id="st-roots">0</div><div class="lbl">الفروع</div></div>
  </div>

  <!-- SVG -->
  <svg id="svg">
    <defs>
      <filter id="hoverGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="focusGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="linkGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3b82f6" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#8b5cf6" stop-opacity=".5"/>
      </linearGradient>
    </defs>
    <g id="viewport">
      <g id="links"></g>
      <g id="nodes"></g>
    </g>
  </svg>

  <!-- أدوات تحكم -->
  <div class="controls">
    <button class="ctrl-btn" id="btn-zoom-in">＋</button>
    <button class="ctrl-btn" id="btn-zoom-out">－</button>
    <button class="ctrl-btn zoom-label" id="btn-reset">1:1</button>
  </div>

  <!-- لوحة تفاصيل -->
  <div class="info-panel" id="infoPanel">
    <button class="close-panel" id="closePanel">✕</button>
    <div class="info-head">
      <div class="avatar" id="pAvatar">؟</div>
      <div>
        <div class="name" id="pName">—</div>
        <div class="sub" id="pSub">—</div>
      </div>
    </div>
    <div class="info-body" id="pBody"></div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Loader -->
  <div id="loader">
    <div class="spinner"></div>
    <p>جارٍ تحميل شجرة العائلة...</p>
  </div>
</div>

<script>
/* =========================================================
   شجرة العائلة الاحترافية — Family Tree Pro Viewer
   ========================================================= */
'use strict';

/* ---------- ثوابت الألوان حسب الجيل ---------- */
const GEN_PALETTE = [
  {fill:'#0b2545', stroke:'#3b82f6', glow:'#60a5fa', label:'الجيل ١'},
  {fill:'#1a2e4a', stroke:'#8b5cf6', glow:'#a78bfa', label:'الجيل ٢'},
  {fill:'#2d1b4e', stroke:'#ec4899', glow:'#f472b6', label:'الجيل ٣'},
  {fill:'#0f3d3e', stroke:'#14b8a6', glow:'#2dd4bf', label:'الجيل ٤'},
  {fill:'#3d2f0f', stroke:'#f59e0b', glow:'#fbbf24', label:'الجيل ٥'},
  {fill:'#3d0f1f', stroke:'#ef4444', glow:'#f87171', label:'الجيل ٦'},
  {fill:'#1e293b', stroke:'#64748b', glow:'#94a3b8', label:'الجيل ٧'},
  {fill:'#1e1b4b', stroke:'#6366f1', glow:'#818cf8', label:'الجيل ٨'},
  {fill:'#14532d', stroke:'#22c55e', glow:'#4ade80', label:'الجيل ٩'},
  {fill:'#4c1d95', stroke:'#a855f7', glow:'#c084fc', label:'الجيل ١٠'},
  {fill:'#7c2d12', stroke:'#f97316', glow:'#fb923c', label:'الجيل ١١'},
  {fill:'#083344', stroke:'#06b6d4', glow:'#22d3ee', label:'الجيل ١٢'},
  {fill:'#422006', stroke:'#eab308', glow:'#facc15', label:'الجيل ١٣'},
  {fill:'#450a0a', stroke:'#dc2626', glow:'#fca5a5', label:'الجيل ١٤'},
];

const NODE_W = 130;
const NODE_H = 56;
const H_GAP = 22;   // فراغ أفقي بين الأشقاء
const V_GAP = 90;   // فراغ عمودي بين الأجيال

/* ---------- الحالة ---------- */
const state = {
  people: [],
  byId: new Map(),
  children: new Map(),   // father_id -> [ids]
  roots: [],
  depth: new Map(),      // id -> generation index
  maxGen: 0,
  focusId: null,
  transform: {x:0,y:0,k:1},
  positions: new Map(),
};

/* ---------- عناصر DOM ---------- */
const $ = id => document.getElementById(id);
const svg = $('svg');
const viewport = $('viewport');
const gLinks = $('links');
const gNodes = $('nodes');

/* =========================================================
   1) تحميل البيانات
   ========================================================= */
async function loadData(){
  try{
    const res = await fetch('tree-data.json', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    state.people = Array.isArray(data.people) ? data.people : [];
    buildMaps();
    computeGenerations();
    render();
    updateStats();
    fitToScreen();
    $('loader').classList.add('hide');
  }catch(err){
    console.error(err);
    $('loader').innerHTML = `
      <p style="color:#ef4444;font-size:16px">⚠ تعذر تحميل tree-data.json</p>
      <p style="color:#8b9bb4;font-size:12px;max-width:300px;text-align:center">
        تأكد من وجود الملف في نفس مجلد index.html<br>وشغّل الصفحة عبر سيرفر محلي (Live Server)
      </p>`;
  }
}

/* =========================================================
   2) خرائط الأب/الأبناء
   ========================================================= */
function buildMaps(){
  state.byId.clear();
  state.children.clear();
  state.people.forEach(p => state.byId.set(p.id, p));

  state.people.forEach(p => {
    if(p.father_id != null && state.byId.has(p.father_id)){
      if(!state.children.has(p.father_id)) state.children.set(p.father_id, []);
      state.children.get(p.father_id).push(p.id);
    }
  });
}

/* =========================================================
   3) حساب الأجيال (BFS من الجذور)
   ========================================================= */
function computeGenerations(){
  state.depth.clear();
  const hasParent = id => {
    const p = state.byId.get(id);
    return p && p.father_id != null && state.byId.has(p.father_id);
  };
  state.roots = state.people.filter(p => !hasParent(p.id)).map(p => p.id);

  const q = [];
  state.roots.forEach(id => { state.depth.set(id, 0); q.push(id); });
  let head = 0;
  while(head < q.length){
    const id = q[head++];
    const d = state.depth.get(id) || 0;
    const kids = state.children.get(id) || [];
    for(const k of kids){
      if(!state.depth.has(k) || state.depth.get(k) < d+1){
        state.depth.set(k, d+1);
        q.push(k);
      }
    }
  }
  // أي فرد لم يُزار (دورة/يتيم) → ضعه في الجيل 0
  state.people.forEach(p => { if(!state.depth.has(p.id)) state.depth.set(p.id,0); });

  state.maxGen = 0;
  state.depth.forEach(v => { if(v > state.maxGen) state.maxGen = v; });
}

/* =========================================================
   4) تخطيط الشجرة (Tidy Tree)
   ========================================================= */
function layout(rootId){
  state.positions.clear();
  let cursor = 0;

  function place(id, depth){
    const kids = (state.children.get(id) || []);
    // نضع الأطفال أولاً
    const childXs = [];
    kids.forEach(k => childXs.push(place(k, depth+1)));

    let x;
    if(childXs.length === 0){
      x = cursor;
      cursor += NODE_W + H_GAP;
    }else{
      x = (childXs[0] + childXs[childXs.length-1]) / 2;
    }
    const y = depth * (NODE_H + V_GAP);
    state.positions.set(id, {x, y, depth});
    return x;
  }
  place(rootId, 0);

  // توسيط الشجرة كاملة
  let minX = Infinity, maxX = -Infinity, maxY = 0;
  state.positions.forEach(p => {
    if(p.x < minX) minX = p.x;
    if(p.x > maxX) maxX = p.x;
    if(p.y > maxY) maxY = p.y;
  });
  const offsetX = -(minX + maxX) / 2;
  const offsetY = -maxY / 2;
  state.positions.forEach(p => { p.x += offsetX; p.y += offsetY; });
}

/* =========================================================
   5) الرسم
   ========================================================= */
function render(focusId = null){
  state.focusId = focusId;
  gLinks.innerHTML = '';
  gNodes.innerHTML = '';

  if(focusId != null){
    // وضع التركيز: ارسم الفرد + كل ذريته
    layout(focusId);
    drawTree(focusId);
    applyFocusDim(focusId);
  }else{
    // الوضع الكامل: ارسم كل الجذور
    layoutAll();
    drawAll();
  }
  applyTransform();
}

/* تخطيط كل الشجرة (عدة جذور) */
function layoutAll(){
  state.positions.clear();
  let cursor = 0;
  const rootPositions = [];

  function place(id, depth){
    const kids = state.children.get(id) || [];
    const childXs = [];
    kids.forEach(k => childXs.push(place(k, depth+1)));
    let x;
    if(childXs.length === 0){
      x = cursor; cursor += NODE_W + H_GAP;
    }else{
      x = (childXs[0] + childXs[childXs.length-1]) / 2;
    }
    state.positions.set(id, {x, y: depth*(NODE_H+V_GAP), depth});
    return x;
  }
  state.roots.forEach(r => rootPositions.push(place(r, 0)));

  let minX=Infinity, maxX=-Infinity, maxY=0;
  state.positions.forEach(p=>{
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y>maxY)maxY=p.y;
  });
  const offX = -(minX+maxX)/2;
  const offY = -maxY/2;
  state.positions.forEach(p=>{p.x+=offX; p.y+=offY;});
}

/* رسم الشجرة الكاملة */
function drawAll(){
  // الروابط
  state.people.forEach(p=>{
    if(p.father_id == null) return;
    if(!state.positions.has(p.father_id) || !state.positions.has(p.id)) return;
    drawLink(state.positions.get(p.father_id), state.positions.get(p.id), state.depth.get(p.id)||0);
  });
  // العقد
  state.people.forEach(p=>{
    if(!state.positions.has(p.id)) return;
    drawNode(p, state.positions.get(p.id), state.depth.get(p.id)||0);
  });
}

/* رسم شجرة الجذر المحدد فقط */
function drawTree(rootId){
  const stack = [rootId];
  const visited = new Set();
  while(stack.length){
    const id = stack.pop();
    if(visited.has(id)) continue;
    visited.add(id);
    if(!state.positions.has(id)) continue;
    const pos = state.positions.get(id);
    const depth = state.depth.get(id) || 0;
    const kids = state.children.get(id) || [];
    kids.forEach(k=>{
      if(!state.positions.has(k)) return;
      drawLink(pos, state.positions.get(k), state.depth.get(k)||0);
      stack.push(k);
    });
  }
  // العقد
  const stack2 = [rootId];
  const visited2 = new Set();
  while(stack2.length){
    const id = stack2.pop();
    if(visited2.has(id)) continue;
    visited2.add(id);
    if(!state.positions.has(id)) continue;
    const p = state.byId.get(id);
    if(!p) continue;
    drawNode(p, state.positions.get(id), state.depth.get(id)||0);
    (state.children.get(id)||[]).forEach(k=>stack2.push(k));
  }
}

/* رسم عقدة */
function drawNode(p, pos, depth){
  const pal = GEN_PALETTE[depth % GEN_PALETTE.length];
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','node');
  g.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);
  g.dataset.id = p.id;
  g.dataset.depth = depth;

  // مستطيل
  const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x', -NODE_W/2);
  rect.setAttribute('y', -NODE_H/2);
  rect.setAttribute('width', NODE_W);
  rect.setAttribute('height', NODE_H);
  rect.setAttribute('rx', 12);
  rect.setAttribute('fill', pal.fill);
  rect.setAttribute('stroke', pal.stroke);
  rect.setAttribute('stroke-width', '2');
  g.appendChild(rect);

  // شريط علوي ملون
  const bar = document.createElementNS('http://www.w3.org/2000/svg','rect');
  bar.setAttribute('x', -NODE_W/2 + 6);
  bar.setAttribute('y', -NODE_H/2 + 6);
  bar.setAttribute('width', 4);
  bar.setAttribute('height', NODE_H - 12);
  bar.setAttribute('rx', 2);
  bar.setAttribute('fill', pal.stroke);
  g.appendChild(bar);

  // أيقونة الجنس
  const genderIcon = p.gender === 'female' ? '♀' : (p.gender === 'male' ? '♂' : '؟');
  const gt = document.createElementNS('http://www.w3.org/2000/svg','text');
  gt.setAttribute('x', -NODE_W/2 + 16);
  gt.setAttribute('y', 6);
  gt.setAttribute('font-size', '16');
  gt.setAttribute('fill', pal.glow);
  gt.textContent = genderIcon;
  g.appendChild(gt);

  // الاسم
  const name = (p.name || 'بدون اسم').trim();
  const displayName = name.length > 16 ? name.slice(0,15)+'…' : name;
  const t1 = document.createElementNS('http://www.w3.org/2000/svg','text');
  t1.setAttribute('class','n-name');
  t1.setAttribute('x', -NODE_W/2 + 30);
  t1.setAttribute('y', -2);
  t1.textContent = displayName;
  g.appendChild(t1);

  // تواريخ
  const b = (p.birth_date||'').trim();
  const d = (p.death_date||'').trim();
  let meta = '';
  if(b && d) meta = `${b} - ${d}`;
  else if(b) meta = `مولود: ${b}`;
  else if(d) meta = `توفي: ${d}`;
  if(meta){
    const t2 = document.createElementNS('http://www.w3.org/2000/svg','text');
    t2.setAttribute('class','n-meta');
    t2.setAttribute('x', -NODE_W/2 + 30);
    t2.setAttribute('y', 14);
    t2.textContent = meta;
    g.appendChild(t2);
  }

  // الأحداث
  g.addEventListener('click', e => {
    e.stopPropagation();
    selectPerson(p.id);
  });
  g.addEventListener('dblclick', e => {
    e.stopPropagation();
    focusOn(p.id);
  });

  gNodes.appendChild(g);
}

/* رسم رابط */
function drawLink(a, b, depth){
  const pal = GEN_PALETTE[depth % GEN_PALETTE.length];
  const x1 = a.x, y1 = a.y + NODE_H/2;
  const x2 = b.x, y2 = b.y - NODE_H/2;
  const my = (y1 + y2) / 2;

  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('class','link');
  path.setAttribute('d', `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`);
  path.setAttribute('stroke', pal.stroke);
  path.setAttribute('stroke-width', '2');
  path.setAttribute('opacity', '.75');
  gLinks.appendChild(path);
}

/* =========================================================
   6) وضع التركيز
   ========================================================= */
function focusOn(id){
  state.focusId = id;
  // احسب كل الذرية
  const descendants = new Set();
  const stack = [id];
  while(stack.length){
    const cur = stack.pop();
    if(descendants.has(cur)) continue;
    descendants.add(cur);
    (state.children.get(cur)||[]).forEach(k=>stack.push(k));
  }
  state.focusSet = descendants;

  // أعد الرسم
  render(id);

  // اجعل العقدة مركزة
  document.querySelectorAll('.node').forEach(n=>{
    if(n.dataset.id === String(id)) n.classList.add('focused');
  });

  // رسالة
  const p = state.byId.get(id);
  toast(`🎯 التركيز على: ${p?.name || ''}`);
  $('btn-home').style.background = 'linear-gradient(135deg,#ef4444,#b91c1c)';
  $('btn-home').style.borderColor = 'transparent';
}

function exitFocus(){
  if(state.focusId == null) return;
  state.focusId = null;
  state.focusSet = null;
  render(null);
  fitToScreen();
  $('btn-home').style.background = '';
  $('btn-home').style.borderColor = '';
  toast('↩ تم الخروج من وضع التركيز');
}

/* تطبيق التعتيم على غير الذرية */
function applyFocusDim(focusId){
  const focusSet = state.focusSet || new Set([focusId]);
  document.querySelectorAll('.node').forEach(n=>{
    if(!focusSet.has(Number(n.dataset.id))) n.classList.add('dimmed');
  });
  document.querySelectorAll('.link').forEach(l=>{
    l.style.opacity = '.9';
  });
}

/* =========================================================
   7) تفاصيل الفرد
   ========================================================= */
function selectPerson(id){
  const p = state.byId.get(id);
  if(!p) return;
  const depth = state.depth.get(id) || 0;
  const pal = GEN_PALETTE[depth % GEN_PALETTE.length];

  $('pAvatar').textContent = (p.name||'؟').trim().charAt(0) || '؟';
  $('pName').textContent = p.name || 'بدون اسم';
  $('pSub').textContent = `${pal.label} • ${p.gender==='female'?'أنثى':p.gender==='male'?'ذكر':'غير محدد'}`;

  const kids = state.children.get(id) || [];
  const father = p.father_id ? state.byId.get(p.father_id) : null;

  let genderBadge = 'unknown', genderTxt = 'غير محدد';
  if(p.gender === 'male'){ genderBadge='male'; genderTxt='ذكر'; }
  else if(p.gender === 'female'){ genderBadge='female'; genderTxt='أنثى'; }

  $('pBody').innerHTML = `
    <div class="info-row"><span class="k">الحالة</span>
      <span class="v"><span class="badge ${genderBadge}">${genderTxt}</span></span></div>
    <div class="info-row"><span class="k">الجيل</span><span class="v">${depth+1}</span></div>
    ${p.birth_date?`<div class="info-row"><span class="k">تاريخ الميلاد</span><span class="v">${p.birth_date}</span></div>`:''}
    ${p.death_date?`<div class="info-row"><span class="k">تاريخ الوفاة</span><span class="v">${p.death_date}</span></div>`:''}
    <div class="info-row"><span class="k">الأب</span><span class="v">${father?father.name:'—'}</span></div>
    <div class="info-row"><span class="k">عدد الأبناء</span><span class="v">${kids.length}</span></div>
    ${p.notes?`<div class="info-row"><span class="k">ملاحظات</span><span class="v">${p.notes}</span></div>`:''}
    <button class="focus-btn" id="btnFocusPerson">
      ${state.focusId===id?'✕ الخروج من التركيز':'🎯 التركيز على هذا الفرع'}
    </button>
    <button class="focus-btn" id="btnCenterPerson" style="background:linear-gradient(135deg,#8b5cf6,#6d28d9);margin-top:8px">
      🎯 توسيط في الشاشة
    </button>
  `;
  $('infoPanel').classList.add('open');

  $('btnFocusPerson').onclick = () => {
    if(state.focusId === id) exitFocus();
    else focusOn(id);
    $('infoPanel').classList.remove('open');
  };
  $('btnCenterPerson').onclick = () => {
    centerOn(id);
  };
}

/* =========================================================
   8) التحويلات (Transform)
   ========================================================= */
function applyTransform(){
  const {x,y,k} = state.transform;
  viewport.setAttribute('transform', `translate(${x},${y}) scale(${k})`);
}

function fitToScreen(){
  if(state.positions.size === 0) return;
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  state.positions.forEach(p=>{
    if(p.x < minX) minX = p.x;
    if(p.x > maxX) maxX = p.x;
    if(p.y < minY) minY = p.y;
    if(p.y > maxY) maxY = p.y;
  });
  const padX = NODE_W, padY = NODE_H;
  const w = (maxX - minX) + padX*2;
  const h = (maxY - minY) + padY*2;
  const rect = svg.getBoundingClientRect();
  const k = Math.min(rect.width / w, rect.height / h) * 0.95;
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  state.transform.k = Math.max(0.08, Math.min(3, k));
  state.transform.x = rect.width/2 - cx * state.transform.k;
  state.transform.y = rect.height/2 - cy * state.transform.k;
  applyTransform();
}

function centerOn(id){
  const pos = state.positions.get(id);
  if(!pos) return;
  const rect = svg.getBoundingClientRect();
  const k = Math.max(state.transform.k, 1);
  state.transform.k = k;
  state.transform.x = rect.width/2 - pos.x * k;
  state.transform.y = rect.height/2 - pos.y * k;
  applyTransform();
}

function zoomBy(factor){
  const rect = svg.getBoundingClientRect();
  const cx = rect.width/2, cy = rect.height/2;
  const k0 = state.transform.k;
  const k1 = Math.max(0.08, Math.min(4, k0 * factor));
  const {x,y} = state.transform;
  state.transform.x = cx - (cx - x) * (k1/k0);
  state.transform.y = cy - (cy - y) * (k1/k0);
  state.transform.k = k1;
  applyTransform();
}

function resetZoom(){
  state.transform = {x:0,y:0,k:1};
  applyTransform();
}

/* =========================================================
   9) التفاعلات (سحب، تكبير)
   ========================================================= */
let dragging = false;
let last = {x:0,y:0};
let pinch = null;

svg.addEventListener('pointerdown', e=>{
  if(e.target.closest('.node')) return;
  dragging = true;
  svg.classList.add('grabbing');
  last = {x:e.clientX, y:e.clientY};
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = e.clientX - last.x;
  const dy = e.clientY - last.y;
  last = {x:e.clientX, y:e.clientY};
  state.transform.x += dx;
  state.transform.y += dy;
  applyTransform();
});
svg.addEventListener('pointerup', e=>{
  dragging = false;
  svg.classList.remove('grabbing');
});
svg.addEventListener('pointercancel', ()=>{ dragging=false; svg.classList.remove('grabbing'); });

svg.addEventListener('wheel', e=>{
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
  zoomBy(factor);
}, {passive:false});

// اللمس المتعدد (Pinch)
svg.addEventListener('touchstart', e=>{
  if(e.touches.length === 2){
    const [a,b] = e.touches;
    pinch = {d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY)};
  }
}, {passive:true});
svg.addEventListener('touchmove', e=>{
  if(e.touches.length === 2 && pinch){
    e.preventDefault();
    const [a,b] = e.touches;
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const factor = d / pinch.d;
    pinch.d = d;
    zoomBy(factor);
  }
}, {passive:false});
svg.addEventListener('touchend', ()=>{ pinch = null; });

// النقر على الخلفية = إغلاق اللوحة
svg.addEventListener('click', e=>{
  if(!e.target.closest('.node')){
    $('infoPanel').classList.remove('open');
  }
});

/* =========================================================
   10) البحث
   ========================================================= */
const searchInput = $('searchInput');
searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim();
  $('searchBox').classList.toggle('has-value', q.length > 0);

  if(!q){ 
    document.querySelectorAll('.node').forEach(n=>n.style.opacity='');
    return;
  }
  const matches = new Set();
  state.people.forEach(p=>{
    if((p.name||'').includes(q)) matches.add(p.id);
  });
  document.querySelectorAll('.node').forEach(n=>{
    if(matches.has(Number(n.dataset.id))) n.style.opacity = '1';
    else n.style.opacity = '.15';
  });
  if(matches.size === 1){
    const id = [...matches][0];
    centerOn(id);
  }
});
$('clearSearch').onclick = ()=>{
  searchInput.value = '';
  searchInput.dispatchEvent(new Event('input'));
};

/* =========================================================
   11) إحصائيات
   ========================================================= */
function updateStats(){
  $('st-people').textContent = state.people.length;
  $('st-gens').textContent = state.maxGen + 1;
  $('st-roots').textContent = state.roots.length;
}

/* =========================================================
   12) أزرار
   ========================================================= */
$('btn-home').onclick = ()=>{ exitFocus(); };
$('btn-fit').onclick = ()=>{ fitToScreen(); };
$('btn-zoom-in').onclick = ()=> zoomBy(1.25);
$('btn-zoom-out').onclick = ()=> zoomBy(1/1.25);
$('btn-reset').onclick = ()=>{ resetZoom(); };
$('closePanel').onclick = ()=> $('infoPanel').classList.remove('open');
$('btn-info').onclick = ()=>{
  toast(`📊 ${state.people.length} فرد • ${state.maxGen+1} جيل • ${state.roots.length} فرع`);
};
$('btn-theme').onclick = ()=>{
  // تبديل بسيط بين لوحتين
  document.documentElement.style.setProperty('--accent', '#10b981');
  document.documentElement.style.setProperty('--glow', '#34d399');
  toast('🌿 تم تغيير السمة');
};

// ESC = خروج من التركيز أو إغلاق اللوحة
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    if($('infoPanel').classList.contains('open')) $('infoPanel').classList.remove('open');
    else if(state.focusId != null) exitFocus();
  }
  if(e.key === 'f' || e.key === 'F') fitToScreen();
});

/* =========================================================
   13) Toast
   ========================================================= */
let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* =========================================================
   14) انطلاق
   ========================================================= */
window.addEventListener('resize', ()=>{ /* يمكن إعادة الملاءمة */ });
loadData();
