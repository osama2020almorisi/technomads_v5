<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050b16">
<title>شجرة العائلة الدائرية — Family Tree Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
:root{
 --bg:#050b16;--panel:rgba(12,23,40,.86);--panel2:#101e32;
 --border:rgba(107,143,186,.20);--text:#f4f7ff;--muted:#8798b1;
 --cyan:#35e0d0;--blue:#4d8fff;--violet:#ae73ff;--green:#61dc76;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif}
body{
 background:
 radial-gradient(circle at 50% 45%,rgba(42,92,145,.15),transparent 27%),
 radial-gradient(circle at 18% 75%,rgba(45,226,207,.07),transparent 30%),
 radial-gradient(circle at 82% 20%,rgba(102,75,200,.07),transparent 28%),#050b16;
}
button,input{font:inherit}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr}
.topbar{
 height:68px;display:flex;align-items:center;gap:10px;padding:9px 14px;
 background:rgba(5,12,23,.84);border-bottom:1px solid var(--border);
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:30
}
.brand{display:flex;align-items:center;gap:9px;min-width:190px}
.logo{
 width:43px;height:43px;border-radius:14px;display:grid;place-items:center;font-size:22px;
 background:linear-gradient(145deg,#123f45,#112344);border:1px solid #31647b;
 box-shadow:0 0 28px rgba(45,226,207,.13)
}
.brand h1{font-size:14px;margin:0;font-weight:800}.brand small{font-size:9px;color:var(--muted)}
.search{position:relative;flex:1;max-width:610px;margin:auto}
.search input{
 width:100%;height:43px;border-radius:14px;border:1px solid #263b57;
 background:#0a1627;color:#fff;outline:0;padding:0 43px 0 40px
}
.search input:focus{border-color:#397ed3;box-shadow:0 0 0 3px rgba(57,126,211,.11)}
.search .glass{position:absolute;right:13px;top:8px;color:#91a5bf;font-size:21px}
.search button{position:absolute;left:5px;top:4px;width:35px;height:35px;border:0;background:none;color:#8395ae;font-size:20px}
.actions{display:flex;gap:6px}
.btn{
 height:42px;min-width:42px;border:1px solid #2a3f5b;border-radius:12px;
 color:#dce8fa;background:#0c192b;display:inline-flex;align-items:center;justify-content:center;
 padding:0 11px;cursor:pointer;transition:.15s
}
.btn:hover{background:#14263d}.btn.primary{border-color:#2eaaa5;background:linear-gradient(135deg,#106e6b,#185d91)}
.label{font-size:11px}
.workspace{position:relative;min-height:0;overflow:hidden}
#viewport{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden}
#viewport.dragging{cursor:grabbing}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stats{
 position:absolute;right:14px;top:13px;z-index:10;display:flex;gap:7px;pointer-events:none
}
.stat{
 min-width:86px;padding:8px 10px;text-align:center;border:1px solid var(--border);
 border-radius:14px;background:rgba(11,23,40,.72);backdrop-filter:blur(12px)
}
.stat b{display:block;font-size:17px;line-height:1.15}.stat span{font-size:9px;color:var(--muted)}
.zoom{position:absolute;left:14px;top:13px;z-index:10;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:42px;padding:0;background:rgba(12,25,43,.78);backdrop-filter:blur(12px);font-size:19px}
.hint{
 position:absolute;left:50%;bottom:13px;transform:translateX(-50%);z-index:10;
 max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 padding:7px 13px;border:1px solid var(--border);border-radius:12px;
 color:#8b9bb2;background:rgba(8,17,30,.72);backdrop-filter:blur(12px);font-size:10px
}
.panel{
 position:absolute;left:14px;top:14px;width:300px;max-height:calc(100% - 28px);
 overflow:auto;z-index:20;padding:15px;border:1px solid #263d5b;border-radius:18px;
 background:rgba(7,17,30,.94);backdrop-filter:blur(18px);box-shadow:0 20px 55px #0008;display:none
}
.panel.open{display:block}
.panel h2{font-size:15px;margin:0 0 12px}.detail-head{display:flex;align-items:center;gap:10px}
.avatar{width:53px;height:53px;border-radius:16px;display:grid;place-items:center;font-size:21px;
 background:#22364e;border:1px solid #45d7ca}
.detail-name{font-weight:800}.detail-sub,.muted{font-size:10px;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #ffffff0d;font-size:11px}
.row span{color:var(--muted)}
.children{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:9px;padding:4px 7px;border-radius:8px;background:#112b36;border:1px solid #1f7777;color:#c9fffa}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#8496af;z-index:2;pointer-events:none;text-align:center;padding:20px}
#loading.error{color:#ff8a8a;pointer-events:auto}
#loading small{display:block;font-size:11px;color:#5f7288;margin-top:8px;line-height:1.7}
@media(max-width:700px){
 .topbar{height:58px;padding:7px 8px}.brand{min-width:auto}.brand>div:last-child{display:none}
 .logo{width:37px;height:37px;border-radius:12px}.search input{height:39px}
 .actions .label{display:none}.btn{height:39px;min-width:39px;padding:0 8px}
 .stats{right:8px;top:8px;gap:4px}.stat{min-width:61px;padding:6px 6px}.stat b{font-size:14px}.stat span{font-size:7px}
 .zoom{left:8px;top:8px}.zoom .btn{width:38px;height:38px}
 .panel{left:8px;right:8px;bottom:8px;top:auto;width:auto;max-height:53%}
 .hint{bottom:7px;font-size:8px}
}
.legend{
 position:absolute;right:14px;bottom:13px;z-index:11;min-width:150px;max-width:230px;
 padding:9px 11px;border:1px solid rgba(107,143,186,.20);border-radius:14px;
 background:rgba(8,17,30,.78);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);
 box-shadow:0 10px 30px rgba(0,0,0,.22)
}
.legend-title{font-size:9px;color:#9aabc2;margin-bottom:6px;font-weight:700}
#legendItems{display:flex;flex-wrap:wrap;gap:5px}
.legend-item{display:flex;align-items:center;gap:4px;color:#cbd7e8;font-size:8px}
.legend-dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 7px currentColor}
@media(max-width:700px){.legend{right:8px;bottom:7px;min-width:115px;max-width:145px}.legend-title{font-size:8px}.legend-item{font-size:7px}.legend-dot{width:6px;height:6px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
 <div class="brand"><div class="logo">🌿</div><div><h1>شجرة العائلة الدائرية</h1><small>Family Tree Pro • Radial View</small></div></div>
 <div class="search"><span class="glass">⌕</span><input id="search" placeholder="ابحث عن اسم…  (Ctrl + F)" autocomplete="off"><button id="clear">×</button></div>
 <div class="actions">
  <button class="btn" id="fit" title="ملاءمة">⛶ <span class="label">ملاءمة</span></button>
  <button class="btn" id="home" title="المركز">⌂ <span class="label">المركز</span></button>
  <button class="btn primary" id="info">ⓘ</button>
 </div>
</header>
<main class="workspace">
 <div class="stats">
  <div class="stat"><b id="people">0</b><span>الأفراد</span></div>
  <div class="stat"><b id="gens">0</b><span>الأجيال</span></div>
  <div class="stat"><b id="branches">0</b><span>الفروع</span></div>
 </div>
 <div id="viewport"><canvas id="canvas"></canvas><div id="loading">جاري تحميل ملف البيانات…</div></div>
 <div class="zoom"><button class="btn" id="plus">+</button><button class="btn" id="minus">−</button><button class="btn" id="one">1:1</button></div>
 <div class="legend" id="legend"><div class="legend-title">ألوان الفروع</div><div id="legendItems"></div></div>
 <div class="hint">اسحب للتحريك • إصبعان للتكبير والتصغير • اضغط على البطاقة لتتبع الفرع • اللون = فرع العائلة</div>
 <aside class="panel" id="panel"><div id="detail"></div></aside>
</main>
</div>

<script>
'use strict';

// ============================================================
// ==== تحميل البيانات من ملف JSON خارجي ======================
// ============================================================
const DATA_URL = 'tree-data.json';

let people = [];
let byId = new Map();
let children = new Map();
let roots = [];
let depthCount = 0;

// عناصر الواجهة
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });
const vp = document.getElementById('viewport');
const loadingEl = document.getElementById('loading');

let W = 0, H = 0, DPR = Math.min(devicePixelRatio || 1, 2);
let scale = 1, tx = 0, ty = 0, drag = false, lastX = 0, lastY = 0;
let selected = null, query = '';
let nodes = [], edges = [], worldR = 1000;
const pos = new Map(), depthMap = new Map();
const leafMemo = new Map();

// ============================================================
// أدوات مساعدة
// ============================================================
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}
function initials(name) {
  const x = (name || '?').trim();
  return x ? x[0] : '•';
}

function depthOf(root) {
  let max = 0;
  const q = [[root, 0]];
  while (q.length) {
    const [p, d] = q.shift();
    max = Math.max(max, d);
    for (const c of (children.get(p.id) || [])) q.push([c, d + 1]);
  }
  return max;
}

function leafCount(p) {
  const kids = children.get(p.id) || [];
  if (!kids.length) return 1;
  return kids.reduce((s, c) => s + leafCount(c), 0);
}
function leaves(p) {
  if (leafMemo.has(p.id)) return leafMemo.get(p.id);
  const n = leafCount(p);
  leafMemo.set(p.id, n);
  return n;
}

// ============================================================
// أبعاد البطاقة ونظام منع التصادم
// ============================================================
const CARD = {
  w: innerWidth < 700 ? 142 : 166,
  h: innerWidth < 700 ? 66  : 76,
  rootW: 220,
  rootH: 92,
  gap: 20
};

function cardCircumradius(w, h) {
  return Math.hypot(w / 2, h / 2);
}

function cardsCollide(a, b, minGap) {
  const dx = Math.abs(a.x - b.x);
  const dy = Math.abs(a.y - b.y);
  const minDx = (a.w + b.w) / 2 + minGap;
  const minDy = (a.h + b.h) / 2 + minGap;
  return dx < minDx && dy < minDy;
}

// ============================================================
// بناء التوزيع الدائري بشكل مضمون ضد التصادم
// ============================================================
function buildLayoutSafe() {
  nodes = [];
  edges = [];
  pos.clear();
  depthMap.clear();
  leafMemo.clear();

  const allRoots = roots.length ? roots : (people[0] ? [people[0]] : []);
  if (!allRoots.length) return;

  const totalLeaves = Math.max(1, allRoots.reduce((s, r) => s + leaves(r), 0));
  let angle = -Math.PI / 2;
  const TWO_PI = Math.PI * 2;

  const palette = [
    '#35e0d0','#4d8fff','#ae73ff','#63dc76','#ffbd59','#ff6f91',
    '#6fd8ff','#d88cff','#9fe05c','#ff7d62','#55c7a9','#c49bff'
  ];
  const rootColor = new Map();
  const branchOf = new Map();

  allRoots.forEach((r, i) => {
    rootColor.set(r.id, palette[i % palette.length]);
    branchOf.set(r.id, r.id);
  });

  function assignBranch(p, rootId) {
    branchOf.set(p.id, rootId);
    for (const c of (children.get(p.id) || [])) assignBranch(c, rootId);
  }
  allRoots.forEach(r => assignBranch(r, r.id));

  // توزيع الزوايا
  function place(p, d, a0, a1) {
    const a = (a0 + a1) / 2;
    const arr = depthMap.get(d) || [];
    arr.push(p.id);
    depthMap.set(d, arr);
    pos.set(p.id, { a, d, branch: branchOf.get(p.id) });

    const kids = children.get(p.id) || [];
    if (kids.length) {
      let cur = a0;
      const span = a1 - a0;
      const lp = Math.max(1, leaves(p));
      for (const c of kids) {
        const part = span * (leaves(c) / lp);
        place(c, d + 1, cur, cur + part);
        cur += part;
      }
    }
  }

  for (const r of allRoots) {
    const part = TWO_PI * (leaves(r) / totalLeaves);
    place(r, 0, angle, angle + part);
    angle += part;
  }

  // حساب أنصاف الأقطار
  const radii = [0];
  const maxDepth = depthCount;

  for (let d = 1; d < maxDepth; d++) {
    const ids = depthMap.get(d) || [];
    const n = ids.length;
    const w = CARD.w;
    const h = CARD.h;

    let minByCount = 0;
    if (n >= 2) {
      const circum = cardCircumradius(w, h);
      const minLinear = 2 * circum + CARD.gap;
      minByCount = minLinear / (2 * Math.sin(Math.PI / n));
    }

    const prevR = radii[d - 1] || 0;
    const minRadial = prevR + h + CARD.gap + 45;

    let minFromRoot = 0;
    if (d === 1) {
      minFromRoot = cardCircumradius(CARD.rootW, CARD.rootH)
                  + cardCircumradius(w, h)
                  + CARD.gap + 35;
    }

    radii[d] = Math.max(minByCount, minRadial, minFromRoot, 100);
  }

  // المواقع الأولية
  worldR = 0;
  for (const p of people) {
    const q = pos.get(p.id);
    if (!q) continue;
    q.r = radii[q.d];
    q.x = Math.cos(q.a) * q.r;
    q.y = Math.sin(q.a) * q.r;
    q.w = q.d === 0 ? CARD.rootW : CARD.w;
    q.h = q.d === 0 ? CARD.rootH : CARD.h;
    q.color = rootColor.get(q.branch) || palette[0];
    worldR = Math.max(worldR, Math.hypot(q.x, q.y) + cardCircumradius(q.w, q.h));
    nodes.push(p);
  }

  // التصحيح التكراري
  const MAX_ITER = 40;
  for (let iter = 0; iter < MAX_ITER; iter++) {
    let collisionFound = false;
    const expansion = new Map();

    for (let d = 1; d < maxDepth; d++) {
      const ids = depthMap.get(d) || [];
      if (ids.length < 2) continue;
      ids.sort((a, b) => pos.get(a).a - pos.get(b).a);
      const r = radii[d];

      for (let i = 0; i < ids.length; i++) {
        for (let j = i + 1; j < ids.length; j++) {
          const A = pos.get(ids[i]);
          const B = pos.get(ids[j]);
          let da = Math.abs(A.a - B.a);
          if (da > Math.PI) da = 2 * Math.PI - da;
          const linearDist = 2 * r * Math.sin(da / 2);
          const circumA = cardCircumradius(A.w, A.h);
          const circumB = cardCircumradius(B.w, B.h);
          const required = circumA + circumB + CARD.gap;

          if (linearDist < required - 0.5) {
            collisionFound = true;
            const factor = required / Math.max(linearDist, 0.001);
            const cur = expansion.get(d) || 1;
            expansion.set(d, Math.max(cur, factor * 1.03));
          }
        }
      }
    }

    if (!collisionFound) break;

    for (const [d, factor] of expansion) {
      const newR = radii[d] * factor;
      const minAllowed = (radii[d - 1] || 0) + CARD.h + CARD.gap + 45;
      radii[d] = Math.max(newR, minAllowed);
      const ids = depthMap.get(d) || [];
      for (const id of ids) {
        const q = pos.get(id);
        q.r = radii[d];
        q.x = Math.cos(q.a) * q.r;
        q.y = Math.sin(q.a) * q.r;
      }
    }

    for (let d = 1; d < maxDepth; d++) {
      const minAllowed = (radii[d - 1] || 0) + CARD.h + CARD.gap + 45;
      if (radii[d] < minAllowed) {
        radii[d] = minAllowed;
        const ids = depthMap.get(d) || [];
        for (const id of ids) {
          const q = pos.get(id);
          q.r = radii[d];
          q.x = Math.cos(q.a) * q.r;
          q.y = Math.sin(q.a) * q.r;
        }
      }
    }

    worldR = 0;
    for (const q of pos.values()) {
      worldR = Math.max(worldR, Math.hypot(q.x, q.y) + cardCircumradius(q.w, q.h));
    }
  }

  // فحص بين الحلقات المتجاورة
  for (let pass = 0; pass < 5; pass++) {
    let fixed = false;
    for (let d = 1; d < maxDepth - 1; d++) {
      const inner = depthMap.get(d) || [];
      const outer = depthMap.get(d + 1) || [];
      for (const iid of inner) {
        const A = pos.get(iid);
        for (const oid of outer) {
          const B = pos.get(oid);
          if (cardsCollide(A, B, CARD.gap * 0.5)) {
            const newR = radii[d + 1] + CARD.gap + CARD.h * 0.4;
            radii[d + 1] = newR;
            for (const id of outer) {
              const q = pos.get(id);
              q.r = newR;
              q.x = Math.cos(q.a) * newR;
              q.y = Math.sin(q.a) * newR;
            }
            fixed = true;
            break;
          }
        }
      }
    }
    if (!fixed) break;
  }

  worldR = 0;
  for (const q of pos.values()) {
    worldR = Math.max(worldR, Math.hypot(q.x, q.y) + cardCircumradius(q.w, q.h));
  }

  // الحواف
  for (const p of people) {
    const a = pos.get(p.id);
    if (!a) continue;
    for (const c of children.get(p.id) || []) {
      const b = pos.get(c.id);
      if (b) edges.push({ a, b, type: 'child', color: a.color });
    }
  }

  const seen = new Set();
  for (const p of people) {
    const sid = Number(p.spouse_id || 0);
    if (!sid || !byId.has(sid)) continue;
    const key = `${Math.min(p.id, sid)}-${Math.max(p.id, sid)}`;
    if (seen.has(key)) continue;
    seen.add(key);
    const a = pos.get(p.id), b = pos.get(sid);
    if (a && b) edges.push({ a, b, type: 'spouse', color: a.color });
  }

  // الأسطورة
  const li = document.getElementById('legendItems');
  if (li) {
    li.innerHTML = allRoots.slice(0, 12).map((r, i) =>
      `<span class="legend-item"><i class="legend-dot" style="color:${rootColor.get(r.id)};background:${rootColor.get(r.id)}"></i>${esc(r.name || ('الفرع ' + (i + 1)))}</span>`
    ).join('');
  }
}

// ============================================================
// إعادة الحجم
// ============================================================
function resize() {
  const r = vp.getBoundingClientRect();
  W = r.width; H = r.height;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  CARD.w = innerWidth < 700 ? 142 : 166;
  CARD.h = innerWidth < 700 ? 66  : 76;

  if (people.length) {
    buildLayoutSafe();
    fit();
    loadingEl.style.display = 'none';
  }
}

// ============================================================
// التحويلات والتكبير
// ============================================================
function screenToWorld(x, y) {
  return { x: (x - W / 2 - tx) / scale, y: (y - H / 2 - ty) / scale };
}
function fit() {
  const usable = Math.min(W - 36, H - 36);
  scale = Math.min(.90, usable / (worldR * 2));
  scale = Math.max(.055, scale);
  tx = 0; ty = 0;
}
function home() {
  const root = roots[0]; if (!root) return;
  const p = pos.get(root.id);
  scale = Math.max(.42, Math.min(1.05, scale));
  tx = -p.x * scale; ty = -p.y * scale;
  selected = root.id;
  showDetails(root);
}
function zoomAt(f, x = W / 2, y = H / 2) {
  const before = screenToWorld(x, y);
  const ns = Math.max(.08, Math.min(2.4, scale * f));
  scale = ns;
  const after = screenToWorld(x, y);
  tx += (after.x - before.x) * scale;
  ty += (after.y - before.y) * scale;
}

// ============================================================
// الرسم
// ============================================================
function roundedRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function edgePath(a, b) {
  const ax = Math.atan2(a.y, a.x), bx = Math.atan2(b.y, b.x);
  const r1 = a.r || Math.hypot(a.x, a.y), r2 = b.r || Math.hypot(b.x, b.y);
  const m1 = r1 + (r2 - r1) * .43, m2 = r1 + (r2 - r1) * .70;
  const p1 = { x: Math.cos(ax) * m1, y: Math.sin(ax) * m1 };
  const p2 = { x: Math.cos(bx) * m2, y: Math.sin(bx) * m2 };
  return [p1, p2];
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // حلقات إرشادية
  ctx.save();
  ctx.translate(W / 2 + tx, H / 2 + ty);
  for (let d = 1; d < depthCount; d++) {
    const r = pos.get(depthMap.get(d)?.[0] || 0)?.r || 0;
    if (!r) continue;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(72,111,145,.075)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();

  // الحواف
  ctx.save();
  ctx.translate(W / 2 + tx, H / 2 + ty);
  ctx.scale(scale, scale);
  for (const e of edges) {
    const a = e.a, b = e.b;
    const active = !selected || a.branch === pos.get(selected)?.branch;
    ctx.globalAlpha = active ? 1 : .10;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    if (e.type === 'spouse') {
      ctx.setLineDash([9, 8]);
      ctx.strokeStyle = e.color || '#ae73ff';
      ctx.lineWidth = 2.1;
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.setLineDash([]);
    } else {
      const [c1, c2] = edgePath(a, b);
      ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, b.x, b.y);
      ctx.strokeStyle = e.color || '#35e0d0';
      ctx.lineWidth = (selected && (a.branch === pos.get(selected)?.branch)) ? 3.6 : 2.4;
      ctx.stroke();
      ctx.globalAlpha = active ? .20 : .03;
      ctx.strokeStyle = e.color || '#35e0d0';
      ctx.lineWidth = 8;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // البطاقات
  ctx.save();
  ctx.translate(W / 2 + tx, H / 2 + ty);
  ctx.scale(scale, scale);
  for (const p of nodes) drawCard(p);
  ctx.restore();
}

function drawCard(p) {
  const q = pos.get(p.id);
  if (!q) return;
  const w = q.w, h = q.h, x = q.x - w / 2, y = q.y - h / 2;
  const hit = query && (p.name || '').toLowerCase().includes(query);
  const isSel = selected === p.id;
  const branchActive = !selected || q.branch === pos.get(selected)?.branch;
  ctx.globalAlpha = branchActive ? 1 : .22;

  if (isSel || hit) {
    ctx.shadowBlur = isSel ? 26 : 18;
    ctx.shadowColor = isSel ? q.color : 'rgba(174,115,255,.48)';
  }
  roundedRect(ctx, x, y, w, h, 18);
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, '#14253b');
  g.addColorStop(1, '#0d1b2d');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = isSel ? q.color : hit ? '#b783ff' : q.color;
  ctx.lineWidth = isSel ? 3.0 : 1.45;
  ctx.stroke();

  const ar = h * .31;
  const ax = x + 25, ay = y + h / 2;
  ctx.beginPath();
  ctx.arc(ax, ay, ar, 0, Math.PI * 2);
  ctx.fillStyle = '#263a50';
  ctx.fill();
  ctx.strokeStyle = isSel ? q.color : (p.gender === 'female' ? '#d796ea' : q.color);
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.fillStyle = '#edf6ff';
  ctx.font = `800 ${Math.max(13, ar * .75)}px Cairo`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(initials(p.name), ax, ay + 1);

  const tx2 = x + 48;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#fff';
  ctx.font = `800 ${q.d === 0 ? 15 : 12}px Cairo`;
  let nm = p.name || 'بدون اسم';
  if (nm.length > (q.d === 0 ? 18 : 17)) nm = nm.slice(0, (q.d === 0 ? 17 : 16)) + '…';
  ctx.fillText(nm, tx2, y + 25);

  ctx.fillStyle = '#91a4bd';
  ctx.font = `500 ${q.d === 0 ? 10 : 8.5}px Cairo`;
  const birth = p.birth_date || '';
  const death = p.death_date || '';
  ctx.fillText(birth ? `ميلاد: ${birth}` : 'الميلاد: —', tx2, y + 42);
  ctx.fillText(death ? `وفاة: ${death}` : `الأبناء: ${(children.get(p.id) || []).length}`, tx2, y + 57);

  if (q.d === 0) {
    ctx.fillStyle = p.gender === 'female' ? '#402743' : '#123f45';
    roundedRect(ctx, tx2, y + 65, 54, 16, 8);
    ctx.fill();
    ctx.fillStyle = '#d9fffb';
    ctx.font = '700 8px Cairo';
    ctx.textAlign = 'center';
    ctx.fillText(p.gender === 'female' ? 'أنثى' : 'فرد', tx2 + 27, y + 77);
  }
}

function render() {
  if (people.length) draw();
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

// ============================================================
// التفاعل
// ============================================================
function hitTest(sx, sy) {
  const w = screenToWorld(sx, sy);
  let best = null, bd = Infinity;
  for (const p of nodes) {
    const q = pos.get(p.id);
    const dx = w.x - q.x, dy = w.y - q.y;
    if (Math.abs(dx) <= q.w / 2 && Math.abs(dy) <= q.h / 2) {
      const d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = p; }
    }
  }
  return best;
}
function select(p) {
  selected = p?.id || null;
  if (p) showDetails(p);
}

function showDetails(p) {
  const kids = children.get(p.id) || [];
  const father = p.father_id ? byId.get(p.father_id) : null;
  document.getElementById('detail').innerHTML = `
 <div class="detail-head"><div class="avatar">${esc(initials(p.name))}</div><div><div class="detail-name">${esc(p.name || 'بدون اسم')}</div><div class="detail-sub">السجل #${p.id}</div></div></div>
 <div class="row"><span>الأب</span><b>${esc(father?.name || p.father_name || '—')}</b></div>
 <div class="row"><span>الجنس</span><b>${p.gender === 'female' ? 'أنثى' : p.gender === 'male' ? 'ذكر' : 'غير محدد'}</b></div>
 <div class="row"><span>الميلاد</span><b>${esc(p.birth_date || 'غير مسجل')}</b></div>
 <div class="row"><span>الوفاة</span><b>${esc(p.death_date || 'غير مسجل')}</b></div>
 <div class="row"><span>الأبناء</span><b>${kids.length}</b></div>
 ${kids.length ? `<div class="muted" style="margin-top:10px">أبناء ${esc(p.name)}:</div><div class="children">${kids.map(c => `<span class="chip">${esc(c.name)}</span>`).join('')}</div>` : ''}`;
  document.getElementById('panel').classList.add('open');
}

// أزرار
document.getElementById('info').onclick = () => document.getElementById('panel').classList.toggle('open');
document.getElementById('fit').onclick = () => { if (people.length) fit(); };
document.getElementById('home').onclick = () => { if (people.length) home(); };
document.getElementById('plus').onclick = () => zoomAt(1.22);
document.getElementById('minus').onclick = () => zoomAt(.82);
document.getElementById('one').onclick = () => { scale = 1; tx = 0; ty = 0; };

// السحب
vp.addEventListener('pointerdown', e => {
  if (!people.length) return;
  const p = hitTest(e.clientX, e.clientY);
  if (p) { select(p); return; }
  drag = true;
  lastX = e.clientX; lastY = e.clientY;
  vp.classList.add('dragging');
  vp.setPointerCapture(e.pointerId);
});
vp.addEventListener('pointermove', e => {
  if (!drag) return;
  tx += e.clientX - lastX;
  ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
});
vp.addEventListener('pointerup', () => { drag = false; vp.classList.remove('dragging'); });
vp.addEventListener('pointercancel', () => { drag = false; vp.classList.remove('dragging'); });
vp.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.deltaY < 0 ? 1.12 : .89, e.clientX, e.clientY);
}, { passive: false });

// البحث
const search = document.getElementById('search');
function doSearch(v) {
  query = v.trim().toLowerCase();
  if (query) {
    const p = people.find(x => (x.name || '').toLowerCase().includes(query));
    if (p) { selected = p.id; showDetails(p); }
  } else selected = null;
}
search.addEventListener('input', e => doSearch(e.target.value));
document.getElementById('clear').onclick = () => { search.value = ''; doSearch(''); search.focus(); };
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
    e.preventDefault();
    search.focus();
  }
  if (e.key === 'Escape') {
    search.value = '';
    doSearch('');
    document.getElementById('panel').classList.remove('open');
  }
});

// اللمس المتعدد
let pinch = null;
vp.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const a = e.touches[0], b = e.touches[1];
    pinch = { dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), scale };
  }
}, { passive: true });
vp.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinch) {
    const a = e.touches[0], b = e.touches[1];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    scale = Math.max(.08, Math.min(2.4, pinch.scale * (d / pinch.dist)));
  }
}, { passive: true });
vp.addEventListener('touchend', () => pinch = null, { passive: true });

// ============================================================
// تحميل ملف JSON الخارجي ثم بناء الشجرة
// ============================================================
async function loadData() {
  try {
    loadingEl.classList.remove('error');
    loadingEl.textContent = 'جاري تحميل ملف البيانات…';

    const res = await fetch(DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status} — تعذّر العثور على ${DATA_URL}`);

    const DATA = await res.json();
    const rawPeople = DATA.people || DATA;

    // تهيئة البيانات
    people = rawPeople.map(p => ({
      ...p,
      id: Number(p.id),
      father_id: p.father_id == null ? null : Number(p.father_id)
    }));

    byId = new Map(people.map(p => [p.id, p]));

    children = new Map();
    for (const p of people) {
      if (!children.has(p.father_id)) children.set(p.father_id, []);
      children.get(p.father_id).push(p);
    }
    for (const arr of children.values()) arr.sort((x, y) => x.id - y.id);

    roots = people.filter(p => p.father_id === null || !byId.has(p.father_id));

    // عمق الشجرة
    depthCount = roots.reduce((m, r) => Math.max(m, depthOf(r)), 0) + 1;

    // الإحصائيات
    document.getElementById('people').textContent = people.length;
    document.getElementById('gens').textContent = depthCount;
    document.getElementById('branches').textContent = roots.length;

    // البناء
    resize();
    loadingEl.style.display = 'none';

  } catch (err) {
    console.error(err);
    loadingEl.classList.add('error');
    loadingEl.innerHTML = `
      <div>
        ⚠ فشل تحميل ملف البيانات
        <small>
          ${esc(err.message)}<br>
          تأكّد أن ملف <b>tree-data.json</b> في نفس المجلد.<br>
          لا بد من تشغيل الصفحة عبر سيرفر محلي (مثال: <code>python -m http.server</code>)<br>
          لأن المتصفح يمنع <b>fetch</b> على ملفات <code>file://</code>.
        </small>
      </div>`;
  }
}

new ResizeObserver(resize).observe(vp);
loadData();
</script>
