<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🌳 شجرة العائلة Pro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<style>
  :root{
    --bg:#f3f6fb; --surface:#ffffff; --surface2:#edf2f7; --surface3:#e2e8f0;
    --text:#152033; --text-strong:#0b1220; --muted:#64748b;
    --line:#d6dfeb; --line-strong:#b8c4d4;
    --primary:#0f766e; --primary-dark:#0d5e57; --primary-light:#14b8a6;
    --danger:#dc2626; --warn:#f59e0b; --success:#16a34a;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --nav:rgba(255,255,255,.96);
  }
  html.dark{
    --bg:#090f1b; --surface:#101a2b; --surface2:#172337; --surface3:#1e2d44;
    --text:#edf4ff; --text-strong:#ffffff; --muted:#9ba9bc;
    --line:#293950; --line-strong:#3d5273;
    --primary:#14b8a6; --primary-dark:#0f766e; --primary-light:#2dd4bf;
    --nav:rgba(16,26,43,.97);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:Cairo,'Segoe UI',Tahoma,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  /* ============ شريط علوي ============ */
  .topbar{
    position:relative;z-index:50;
    display:flex;align-items:center;gap:8px;
    padding:calc(10px + var(--safe-top)) 12px 10px;
    background:var(--nav);border-bottom:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    flex-shrink:0;
  }
  .brand{font-size:15px;font-weight:900;color:var(--text-strong);display:flex;align-items:center;gap:5px;flex-shrink:0}
  .brand span{font-size:9px;background:linear-gradient(135deg,var(--primary),var(--primary-light));
    color:#fff;border-radius:6px;padding:2px 5px;font-weight:900}
  .top-actions{margin-inline-start:auto;display:flex;gap:6px;flex-shrink:0}
  .icon-btn{
    width:42px;height:42px;border:1px solid var(--line);border-radius:12px;
    background:var(--surface);color:var(--text);font-size:18px;
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .12s ease, background .12s ease;font-family:inherit;
  }
  .icon-btn:active{transform:scale(.9);background:var(--surface2)}
  .icon-btn.primary-icon{
    background:linear-gradient(135deg,var(--primary),var(--primary-light));
    border-color:var(--primary);color:#fff;
  }

  /* بحث */
  .search-wrap{
    flex:1;display:flex;align-items:center;gap:4px;
    background:var(--surface2);border:1px solid var(--line);
    border-radius:12px;padding:0 8px;min-width:0;height:42px;
  }
  .search-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
  .search-wrap input{
    flex:1;border:0;outline:0;background:transparent;color:var(--text);
    padding:8px 4px;font-size:13px;min-width:0;font-family:inherit;
    -webkit-user-select:text;user-select:text;
  }
  .search-wrap input::placeholder{color:var(--muted);opacity:.7}
  .search-wrap .s-icon{color:var(--muted);font-size:14px}
  .search-wrap .clear-btn{display:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;background:none;border:0;font-family:inherit}
  .search-wrap.has-value .clear-btn{display:block}

  /* ============ شريط الإحصائيات (ثابت في مكانه) ============ */
  .stats-bar{
    position:absolute;
    top:calc(66px + var(--safe-top));
    left:12px;right:12px;
    z-index:20;
    display:flex;
    gap:6px;
    justify-content:flex-end;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .stats-bar.hidden{
    opacity:0;
    transform:translateY(-8px);
    pointer-events:none;
  }
  .stat-card{
    pointer-events:auto;
    min-width:58px;
    padding:5px 8px;
    border-radius:10px;
    background:var(--surface);
    border:1px solid var(--line);
    text-align:center;
    box-shadow:0 2px 8px rgba(15,23,42,.05);
  }
  .stat-card .num{font-size:15px;font-weight:900;color:var(--primary);line-height:1}
  .stat-card .lbl{font-size:9px;color:var(--muted);margin-top:1px;font-weight:700}

  /* ============ شريط التركيز (نفس مكان الإحصائيات تماماً) ============ */
  .focus-banner{
    position:absolute;
    top:calc(66px + var(--safe-top));
    left:12px;right:12px;
    z-index:25;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 12px;
    background:linear-gradient(135deg,#f59e0b,#ea580c);
    color:#fff;
    border-radius:14px;
    box-shadow:0 12px 32px rgba(245,158,11,.45);
    animation:focusSlide .32s cubic-bezier(.2,.9,.3,1);
    pointer-events:auto;
  }
  .focus-banner.hidden{display:none!important}
  @keyframes focusSlide{
    from{opacity:0;transform:translateY(-12px) scale(.96)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  .focus-left{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
    flex:1;
  }
  .focus-icon{font-size:22px;flex-shrink:0}
  .focus-text{min-width:0}
  .focus-text b{
    display:block;
    font-size:14px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .focus-text small{
    display:block;
    font-size:10px;
    opacity:.95;
    font-weight:700;
    margin-top:2px;
  }

  /* إحصائيات داخل شريط التركيز */
  .focus-stats{
    display:flex;
    gap:4px;
    flex-shrink:0;
    align-items:center;
  }
  .focus-stat{
    background:rgba(255,255,255,.22);
    border:1px solid rgba(255,255,255,.35);
    border-radius:9px;
    padding:4px 8px;
    text-align:center;
    min-width:44px;
  }
  .focus-stat .num{
    font-size:14px;
    font-weight:900;
    line-height:1;
    color:#fff;
  }
  .focus-stat .lbl{
    font-size:8px;
    opacity:.95;
    font-weight:700;
    margin-top:2px;
    color:#fff;
  }

  .focus-exit{
    padding:8px 10px;
    border:1px solid rgba(255,255,255,.5);
    border-radius:10px;
    background:rgba(255,255,255,.2);
    color:#fff;
    font-weight:800;
    font-size:11px;
    cursor:pointer;
    font-family:inherit;
    flex-shrink:0;
    transition:.15s;
  }
  .focus-exit:active{transform:scale(.94);background:rgba(255,255,255,.35)}

  /* ============ SVG ============ */
  .tree-container{
    flex:1;position:relative;overflow:hidden;
    background:radial-gradient(ellipse at center, var(--surface) 0%, var(--bg) 100%);
  }
  #svg{
    display:block;width:100%;height:100%;
    cursor:grab;touch-action:none;
    shape-rendering:geometricPrecision;text-rendering:geometricPrecision;
  }
  #svg.grabbing{cursor:grabbing}

  #viewport{
    transform-origin:0 0;
    will-change:transform;
    transform:translate3d(0,0,0);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }

  .node{cursor:pointer}
  .node-card{
    fill:var(--surface);stroke:var(--line);stroke-width:1.6;
    transition:stroke .12s ease,stroke-width .12s ease;
    shape-rendering:geometricPrecision;
  }
  .node-card:hover{stroke:var(--primary);stroke-width:2.2}
  .node-card.selected{stroke:var(--warn);stroke-width:4}
  .node-card.focus-node{stroke:var(--warn);stroke-width:5;filter:url(#focusGlow)}
  .node-card.root-node{stroke:var(--primary);stroke-width:3}
  .node-card.search-match{stroke:var(--success);stroke-width:3}
  .node text{
    pointer-events:none;user-select:none;
    text-rendering:geometricPrecision;shape-rendering:geometricPrecision;
    font-family:Cairo,'Segoe UI',Tahoma,sans-serif;
  }
  .node-name{font-weight:900;font-size:13px;fill:var(--text-strong);text-anchor:middle}
  .node-meta{font-size:10px;fill:var(--muted);font-weight:700;text-anchor:middle}
  .node-gender{fill:#fff;font-family:Arial;font-size:12px;font-weight:900;text-anchor:middle}
  .link{fill:none;stroke-linecap:round;shape-rendering:geometricPrecision}

  /* ============ أدوات تحكم ============ */
  .fab-stack{
    position:absolute;bottom:calc(16px + var(--safe-bottom));left:12px;
    z-index:40;display:flex;flex-direction:column;gap:8px;
  }
  .fab-stack.right{left:auto;right:12px}
  .fab{
    width:46px;height:46px;border-radius:14px;
    background:var(--surface);border:1px solid var(--line);
    color:var(--text);font-size:20px;cursor:pointer;
    display:grid;place-items:center;transition:transform .12s ease,background .12s ease;
    font-family:inherit;box-shadow:0 4px 12px rgba(15,23,42,.08);
  }
  .fab:active{transform:scale(.88);background:var(--surface2)}
  .fab.zoom-label{font-size:12px;font-weight:900}

  /* ============ لوحة تفاصيل ============ */
  .info-panel{
    position:absolute;top:0;right:0;bottom:0;width:320px;max-width:88vw;
    background:var(--surface);border-right:1px solid var(--line);
    transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
    z-index:70;display:flex;flex-direction:column;
    box-shadow:-10px 0 30px rgba(0,0,0,.15);
  }
  .info-panel.open{transform:translateX(0)}
  .info-head{
    padding:16px 16px 16px 52px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;
    padding-top:calc(16px + var(--safe-top));
  }
  .avatar{
    width:52px;height:52px;border-radius:50%;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    display:grid;place-items:center;font-size:22px;color:#fff;font-weight:900;
    border:2px solid rgba(255,255,255,.2);flex:0 0 auto;
  }
  .info-head .name{font-size:17px;font-weight:900;line-height:1.2}
  .info-head .sub{font-size:11px;color:var(--muted);margin-top:3px;font-weight:700}
  .info-body{padding:14px 16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
  .info-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px;gap:10px;
  }
  .info-row .k{color:var(--muted);flex:0 0 auto;font-weight:700}
  .info-row .v{font-weight:800;text-align:left;word-break:break-word}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800}
  .badge.male{background:rgba(37,99,235,.15);color:#2563eb}
  .badge.female{background:rgba(219,39,119,.15);color:#db2777}
  .badge.unknown{background:rgba(100,116,139,.15);color:#64748b}
  .action-btn{
    width:100%;margin-top:12px;padding:12px;border-radius:12px;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;border:0;font-size:14px;font-weight:800;cursor:pointer;
    font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;
    transition:transform .12s ease;
  }
  .action-btn:active{transform:scale(.97)}
  .action-btn.exit{background:linear-gradient(135deg,#ef4444,#b91c1c)}
  .action-btn.secondary{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
  .action-btn.ghost{background:var(--surface2);border:1px solid var(--line);color:var(--text)}
  .close-panel{
    position:absolute;top:calc(12px + var(--safe-top));left:12px;
    width:34px;height:34px;border-radius:50%;
    background:var(--surface2);border:0;color:var(--text);cursor:pointer;
    display:grid;place-items:center;font-size:15px;font-family:inherit;
  }

  /* ============ Loader ============ */
  #loader{
    position:fixed;inset:0;background:var(--bg);z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    transition:opacity .4s;
  }
  #loader.hide{opacity:0;pointer-events:none}
  .spinner{
    width:52px;height:52px;border-radius:50%;
    border:4px solid rgba(15,118,110,.15);border-top-color:var(--primary);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader p{color:var(--muted);font-size:13px;text-align:center;padding:0 20px;line-height:1.6;font-weight:700}

  /* ============ Toast ============ */
  #toast{
    position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--surface);border:1px solid var(--primary);
    color:var(--text);padding:10px 18px;border-radius:12px;font-size:13px;
    opacity:0;transition:.3s;z-index:90;pointer-events:none;
    max-width:85vw;text-align:center;font-weight:800;
    box-shadow:0 8px 30px rgba(15,118,110,.2);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ============ حماية ============ */
  @media print {
    html, body, #app { display: none !important; visibility: hidden !important; }
    body::after {
      content: "🔒 الطباعة معطلة";
      display: grid !important;
      visibility: visible !important;
      position: fixed;
      inset: 0;
      place-items: center;
      font-size: 28px;
      color: #999;
      background: #fff;
      font-family: sans-serif;
    }
  }
  body.protect-blur #app {
    filter: blur(30px) !important;
    pointer-events: none !important;
  }
  html, body {
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
  }
  input, textarea {
    -webkit-user-select: text !important;
    user-select: text !important;
  }
  img, svg {
    -webkit-user-drag: none !important;
    user-drag: none !important;
  }

  @media(max-width:380px){
    .stat-card{min-width:50px;padding:5px 7px}
    .stat-card .num{font-size:14px}
    .icon-btn{width:38px;height:38px;font-size:16px}
    .search-wrap{height:38px}
    .fab{width:42px;height:42px;font-size:18px}
    .brand{font-size:13px}
    .focus-banner{padding:8px 10px}
    .focus-text b{font-size:12px}
    .focus-stat{min-width:38px;padding:3px 6px}
    .focus-stat .num{font-size:12px}
    .focus-stat .lbl{font-size:7px}
    .focus-icon{font-size:18px}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ شريط علوي ============ -->
  <div class="topbar">
    <div class="brand">🌳 شجرة العائلة <span>PRO</span></div>
    <div class="search-wrap" id="searchBox">
      <span class="s-icon">🔎</span>
      <input type="text" id="searchInput" placeholder="ابحث بالاسم أو #ID...">
      <button class="clear-btn" id="clearSearch">✕</button>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-theme" title="المظهر">🌙</button>
      <button class="icon-btn primary-icon" id="btn-fit" title="ملاءمة">⛶</button>
    </div>
  </div>

  <!-- ============ حاوية الشجرة ============ -->
  <div class="tree-container" id="treeContainer">

    <!-- الإحصائيات العامة (تختفي في وضع التركيز) -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-card"><div class="num" id="st-people">0</div><div class="lbl">الأفراد</div></div>
      <div class="stat-card"><div class="num" id="st-gens">0</div><div class="lbl">الأجيال</div></div>
      <div class="stat-card"><div class="num" id="st-roots">0</div><div class="lbl">الفروع</div></div>
    </div>

    <!-- شريط التركيز (يظهر مكان الإحصائيات) -->
    <div class="focus-banner hidden" id="focusBanner">
      <div class="focus-left">
        <span class="focus-icon">🎯</span>
        <div class="focus-text">
          <b id="focusName">—</b>
          <small>وضع التركيز على الفرع</small>
        </div>
        <div class="focus-stats">
          <div class="focus-stat">
            <div class="num" id="focusPeople">0</div>
            <div class="lbl">أفراد</div>
          </div>
          <div class="focus-stat">
            <div class="num" id="focusGens">0</div>
            <div class="lbl">أجيال</div>
          </div>
          <div class="focus-stat">
            <div class="num" id="focusBranches">0</div>
            <div class="lbl">فروع</div>
          </div>
        </div>
      </div>
      <button class="focus-exit" id="exitFocusBtn">✕ خروج</button>
    </div>

    <!-- SVG -->
    <svg id="svg">
      <defs>
        <filter id="focusGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="viewport"></g>
    </svg>

    <!-- أدوات تحكم -->
    <div class="fab-stack">
      <button class="fab" id="btn-zoom-in">＋</button>
      <button class="fab" id="btn-zoom-out">－</button>
      <button class="fab zoom-label" id="btn-reset">1:1</button>
    </div>
    <div class="fab-stack right">
      <button class="fab" id="btn-up">▲</button>
      <button class="fab" id="btn-down">▼</button>
    </div>

  </div>

  <!-- ============ لوحة تفاصيل ============ -->
  <div class="info-panel" id="infoPanel">
    <button class="close-panel" id="closePanel">✕</button>
    <div class="info-head">
      <div class="avatar" id="pAvatar">؟</div>
      <div style="min-width:0">
        <div class="name" id="pName">—</div>
        <div class="sub" id="pSub">—</div>
      </div>
    </div>
    <div class="info-body" id="pBody"></div>
  </div>

  <div id="toast"></div>

  <div id="loader">
    <div class="spinner"></div>
    <p>جارٍ تحميل شجرة العائلة...</p>
  </div>
</div>

<script>
/* ============================================================
   🌳 Family Tree Pro — Radial Layout + Smooth Transform
   + منع التصوير والطباعة
   ============================================================ */
'use strict';

const $ = id => document.getElementById(id);
const svg = $('svg');
const viewport = $('viewport');

/* ---------- ألوان الأجيال ---------- */
const PALETTE = [
  "#0f766e","#2563eb","#7c3aed","#db2777","#ea580c",
  "#16a34a","#0891b2","#9333ea","#ca8a04","#475569"
];

/* ---------- الحالة ---------- */
const state = {
  people: [],
  byId: new Map(),
  children: new Map(),
  roots: [],
  depth: new Map(),
  maxGen: 0,
  focusId: null,
  focusSet: null,
  selectedId: null,
  searchMatches: new Set(),
  tx: 0, ty: 0, scale: 1,
  positions: new Map(),
  dark: false,
  pointers: new Map(),
  dragStart: null,
  pinch: null,
};

const MIN_SCALE = 0.05;
const MAX_SCALE = 8;

const CARD_W_LARGE = 170;
const CARD_H_LARGE = 72;
const CARD_W_SMALL = 145;
const CARD_H_SMALL = 62;

/* ============================================================
   1) تحميل البيانات
   ============================================================ */
async function loadData(){
  try{
    const res = await fetch('tree-data.json', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    state.people = Array.isArray(data.people) ? data.people : [];
    buildMaps();
    computeGenerations();
    render();
    updateStats();
    requestAnimationFrame(fitToScreen);
    setTimeout(fitToScreen, 200);
    $('loader').classList.add('hide');
  }catch(err){
    console.error(err);
    $('loader').innerHTML = `
      <p style="color:#ef4444;font-size:15px;font-weight:800">⚠ تعذر تحميل tree-data.json</p>
      <p style="color:#64748b;font-size:12px;max-width:300px">
        تأكد من وجود الملف بجانب index.html<br>وشغّل عبر Live Server
      </p>`;
  }
}

/* ============================================================
   2) خرائط
   ============================================================ */
function buildMaps(){
  state.byId.clear();
  state.children.clear();
  state.people.forEach(p => state.byId.set(Number(p.id), p));
  state.people.forEach(p => {
    if(p.father_id != null && state.byId.has(Number(p.father_id))){
      const fid = Number(p.father_id);
      if(!state.children.has(fid)) state.children.set(fid, []);
      state.children.get(fid).push(Number(p.id));
    }
  });
  state.children.forEach(arr => arr.sort((a,b)=>a-b));
}

/* ============================================================
   3) الأجيال
   ============================================================ */
function computeGenerations(){
  state.depth.clear();
  const hasParent = id => {
    const p = state.byId.get(Number(id));
    return p && p.father_id != null && state.byId.has(Number(p.father_id));
  };
  state.roots = state.people.filter(p => !hasParent(p.id)).map(p => Number(p.id));

  const q = [];
  state.roots.forEach(id => { state.depth.set(id, 0); q.push(id); });
  let head = 0;
  while(head < q.length){
    const id = q[head++];
    const d = state.depth.get(id) || 0;
    (state.children.get(id) || []).forEach(k=>{
      if(!state.depth.has(k) || state.depth.get(k) < d+1){
        state.depth.set(k, d+1);
        q.push(k);
      }
    });
  }
  state.people.forEach(p => { if(!state.depth.has(Number(p.id))) state.depth.set(Number(p.id), 0); });
  state.maxGen = 0;
  state.depth.forEach(v => { if(v > state.maxGen) state.maxGen = v; });
}

/* ============================================================
   4) بناء الشجرة
   ============================================================ */
function buildTree(rootId, maxDepth){
  const seen = new Set([rootId]);
  function buildNode(pid, d){
    const p = state.byId.get(pid);
    if(!p) return null;
    const node = {id: pid, name: p.name, gender: p.gender, depth: d, children: []};
    if(d < maxDepth){
      for(const cid of (state.children.get(pid) || [])){
        if(seen.has(cid)) continue;
        seen.add(cid);
        const child = buildNode(cid, d+1);
        if(child) node.children.push(child);
      }
    }
    return node;
  }
  return buildNode(rootId, 0);
}

/* ============================================================
   5) Radial Layout
   ============================================================ */
function layoutRadial(root, dy){
  function countLeaves(node){
    if(!node.children || !node.children.length) return 1;
    let total = 0;
    for(const c of node.children) total += countLeaves(c);
    return total;
  }

  let maxDepth = 0, maxSiblings = 1;
  const nodesByDepth = {};
  (function scan(n, d){
    if(d > maxDepth) maxDepth = d;
    const c = (n.children || []).length;
    if(c > maxSiblings) maxSiblings = c;
    nodesByDepth[d] = (nodesByDepth[d] || 0) + 1;
    for(const ch of n.children || []) scan(ch, d+1);
  })(root, 0);

  const totalNodes = Object.values(nodesByDepth).reduce((s,v)=>s+v, 0);
  const compact = totalNodes > 60;
  const cardWidth = compact ? CARD_W_SMALL : CARD_W_LARGE;
  const minGapX = cardWidth + 40;

  let halfAngleDeg;
  if(maxSiblings <= 2)       halfAngleDeg = 60;
  else if(maxSiblings <= 4)  halfAngleDeg = 85;
  else if(maxSiblings <= 8)  halfAngleDeg = 110;
  else if(maxSiblings <= 15) halfAngleDeg = 135;
  else if(maxSiblings <= 30) halfAngleDeg = 155;
  else                        halfAngleDeg = 178;

  const HALF_ANGLE = (halfAngleDeg * Math.PI) / 180;
  const FULL_ANGLE = 2 * HALF_ANGLE;

  const requiredRadius = {};
  for(let d = 1; d <= maxDepth; d++){
    const count = nodesByDepth[d] || 1;
    requiredRadius[d] = (count * minGapX) / FULL_ANGLE;
  }

  const BASE_RADIUS = Math.max(dy * 1.8, requiredRadius[1] || 0);
  const radiusByDepth = {0: 0};
  radiusByDepth[1] = BASE_RADIUS;
  for(let d = 2; d <= maxDepth; d++){
    const depthBonus = (d-1) * 45;
    const minStep = dy + depthBonus;
    const stepRadius = radiusByDepth[d-1] + minStep;
    const reqRadius = requiredRadius[d] || 0;
    radiusByDepth[d] = Math.max(stepRadius, reqRadius);
  }

  const all = [];
  function assign(node, depth, angleStart, angleEnd){
    const centerAngle = (angleStart + angleEnd) / 2;
    const radius = radiusByDepth[depth] || 0;
    if(depth === 0){
      node._x = 0; node._y = 0;
    }else{
      node._x = Math.sin(centerAngle) * radius;
      node._y = -Math.cos(centerAngle) * radius;
    }
    all.push(node);

    const children = node.children || [];
    if(!children.length) return;
    const totalLeaves = children.reduce((s,c)=>s+countLeaves(c), 0);
    let currentAngle = angleStart;
    for(const child of children){
      const leaves = countLeaves(child);
      const angleSpan = (angleEnd - angleStart) * (leaves / totalLeaves);
      assign(child, depth+1, currentAngle, currentAngle + angleSpan);
      currentAngle += angleSpan;
    }
  }
  assign(root, 0, -HALF_ANGLE, HALF_ANGLE);

  const xs = all.map(n => n._x);
  const ys = all.map(n => n._y);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
  const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  all.forEach(n => { n._x -= cx; n._y -= cy; });

  return {nodes: all, cardWidth, cardHeight: compact ? CARD_H_SMALL : CARD_H_LARGE, compact, maxDepth, totalNodes};
}

/* ============================================================
   6) الخط المنحني
   ============================================================ */
function curved(s, t, cardH){
  const halfH = cardH / 2;
  const startX = s._x;
  const startY = s._y + halfH;
  const endX = t._x;
  const endY = t._y - halfH;
  const h = endX - startX;
  const v = endY - startY;
  const c1x = startX + h * 0.25;
  const c1y = startY + v * 0.45;
  const c2x = startX + h * 0.75;
  const c2y = startY + v * 0.55;
  return `M ${startX} ${startY} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${endX} ${endY}`;
}

/* ============================================================
   7) الرسم
   ============================================================ */
function render(){
  viewport.innerHTML = '';

  const rootId = state.focusId != null ? state.focusId : chooseRoot();
  if(rootId == null) return;

  const maxDepth = state.focusId != null ? 30 : (state.maxGen + 1);
  const root = buildTree(rootId, maxDepth);
  if(!root) return;

  const totalNodes = countTreeNodes(root);
  const dy = totalNodes > 300 ? 240 :
             totalNodes > 150 ? 220 :
             totalNodes > 80  ? 200 : 185;

  const result = layoutRadial(root, dy);
  const {nodes, cardWidth, cardHeight, compact} = result;

  // روابط
  const gLinks = document.createElementNS('http://www.w3.org/2000/svg','g');
  for(const n of nodes){
    for(const c of (n.children || [])){
      const baseColor = PALETTE[c.depth % PALETTE.length];
      const sw = Math.max(1.2, 3 - c.depth * 0.15);
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('class','link');
      path.setAttribute('stroke', baseColor);
      path.setAttribute('stroke-width', sw);
      path.setAttribute('d', curved(n, c, cardHeight));
      gLinks.appendChild(path);
    }
  }

  // البطاقات
  const gNodes = document.createElementNS('http://www.w3.org/2000/svg','g');
  const circleR = compact ? 13 : 15;
  const circleCX = -cardWidth/2 + circleR + 12;
  const circleCY = 0;

  for(const n of nodes){
    const person = state.byId.get(n.id);
    if(!person) continue;

    const group = document.createElementNS('http://www.w3.org/2000/svg','g');
    group.setAttribute('class','node');
    group.setAttribute('transform', `translate(${n._x},${n._y})`);
    group.dataset.id = n.id;

    const isSelected = state.selectedId === n.id;
    const isMatch = state.searchMatches.has(n.id);
    const isRoot = n.depth === 0;
    const isFocus = state.focusId === n.id;

    const card = document.createElementNS('http://www.w3.org/2000/svg','rect');
    card.setAttribute('class', 'node-card'
      + (isSelected ? ' selected' : '')
      + (isMatch ? ' search-match' : '')
      + (isRoot ? ' root-node' : '')
      + (isFocus ? ' focus-node' : ''));
    card.setAttribute('x', -cardWidth/2);
    card.setAttribute('y', -cardHeight/2);
    card.setAttribute('width', cardWidth);
    card.setAttribute('height', cardHeight);
    card.setAttribute('rx', compact ? 14 : 18);
    group.appendChild(card);

    let genderColor = PALETTE[n.depth % PALETTE.length];
    if(person.gender === 'male') genderColor = '#2563eb';
    else if(person.gender === 'female') genderColor = '#db2777';

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', circleCX);
    circle.setAttribute('cy', circleCY);
    circle.setAttribute('r', circleR);
    circle.setAttribute('fill', genderColor);
    group.appendChild(circle);

    const genderIcon = person.gender === 'male' ? '♂' : person.gender === 'female' ? '♀' : '•';
    const gi = document.createElementNS('http://www.w3.org/2000/svg','text');
    gi.setAttribute('class','node-gender');
    gi.setAttribute('x', circleCX);
    gi.setAttribute('y', circleCY + (compact ? 4 : 5));
    gi.setAttribute('font-size', compact ? 12 : 14);
    gi.textContent = genderIcon;
    group.appendChild(gi);

    const nameCenterX = circleCX + circleR + (cardWidth/2 - (circleCX + circleR)) / 2 + 2;
    const name = document.createElementNS('http://www.w3.org/2000/svg','text');
    name.setAttribute('class','node-name');
    name.setAttribute('x', nameCenterX);
    name.setAttribute('y', compact ? -4 : -6);
    name.setAttribute('font-size', compact ? 12 : 13);
    const maxChars = compact ? 12 : 15;
    const displayName = (person.name || 'بدون اسم').trim();
    name.textContent = displayName.length > maxChars ? displayName.slice(0, maxChars-1) + '…' : displayName;
    group.appendChild(name);

    const meta = document.createElementNS('http://www.w3.org/2000/svg','text');
    meta.setAttribute('class','node-meta');
    meta.setAttribute('x', nameCenterX);
    meta.setAttribute('y', compact ? 12 : 15);
    meta.setAttribute('font-size', compact ? 9 : 10);
    meta.textContent = `#${n.id} • ج${n.depth + 1}`;
    group.appendChild(meta);

    if(isRoot){
      const ti = document.createElementNS('http://www.w3.org/2000/svg','text');
      ti.setAttribute('x', cardWidth/2 - 10);
      ti.setAttribute('y', -cardHeight/2 + 16);
      ti.setAttribute('font-size', 14);
      ti.setAttribute('text-anchor','middle');
      ti.textContent = isFocus ? '🎯' : '🌳';
      group.appendChild(ti);
    }

    group.addEventListener('click', e => {
      e.stopPropagation();
      selectPerson(n.id);
    });

    let lastTap = 0;
    group.addEventListener('touchend', e => {
      const now = Date.now();
      if(now - lastTap < 300){
        e.preventDefault();
        focusOn(n.id);
        lastTap = 0;
      }else{
        lastTap = now;
      }
    });

    group.addEventListener('dblclick', e => {
      e.stopPropagation();
      focusOn(n.id);
    });

    gNodes.appendChild(group);
  }

  viewport.appendChild(gLinks);
  viewport.appendChild(gNodes);

  applyTransform();
}

function countTreeNodes(node){
  let c = 1;
  for(const ch of node.children || []) c += countTreeNodes(ch);
  return c;
}

/* ============================================================
   8) الجذور
   ============================================================ */
function chooseRoot(){
  if(state.focusId != null && state.byId.has(state.focusId)) return state.focusId;
  if(!state.roots.length) return null;
  let best = state.roots[0], bestCount = -1;
  for(const r of state.roots){
    const c = countDescendants(r);
    if(c > bestCount){ bestCount = c; best = r; }
  }
  return best;
}

function countDescendants(rootId){
  let count = 0;
  const stack = [rootId], seen = new Set();
  while(stack.length){
    const cur = stack.pop();
    if(seen.has(cur)) continue;
    seen.add(cur); count++;
    for(const ch of (state.children.get(cur) || [])) stack.push(ch);
  }
  return count;
}

function collectDescendants(rootId){
  const set = new Set();
  const stack = [rootId];
  while(stack.length){
    const cur = stack.pop();
    if(set.has(cur)) continue;
    set.add(cur);
    (state.children.get(cur) || []).forEach(k => stack.push(k));
  }
  return set;
}

/* ============================================================
   9) 🎯 التركيز (مع إخفاء الإحصائيات العامة وإظهار إحصائيات الفرع)
   ============================================================ */
function focusOn(id){
  if(!state.byId.has(id)) return;
  if(state.focusId === id) { exitFocus(); return; }

  state.focusId = id;
  state.focusSet = collectDescendants(id);
  state.selectedId = id;

  render();

  const person = state.byId.get(id);

  // ✅ احسب إحصائيات الفرع
  const branchPeople = state.focusSet.size;
  const branchGens = computeBranchGenerations(state.focusSet);
  const branchBranches = (state.children.get(id) || []).length;

  // ✅ اسم الفرد
  $('focusName').textContent = person.name;

  // ✅ أرقام الإحصائيات
  $('focusPeople').textContent = branchPeople;
  $('focusGens').textContent = branchGens;
  $('focusBranches').textContent = branchBranches;

  // ✅ اخفِ الإحصائيات العامة + أظهر شريط التركيز
  $('statsBar').classList.add('hidden');
  $('focusBanner').classList.remove('hidden');

  toast(`🎯 التركيز على: ${person.name}`);
  requestAnimationFrame(fitToScreen);
  setTimeout(fitToScreen, 250);
}

function computeBranchGenerations(set){
  let minD = Infinity, maxD = -Infinity;
  set.forEach(id => {
    const d = state.depth.get(id);
    if(d == null) return;
    if(d < minD) minD = d;
    if(d > maxD) maxD = d;
  });
  if(minD === Infinity) return 1;
  return maxD - minD + 1;
}

function exitFocus(){
  if(state.focusId == null) return;
  state.focusId = null;
  state.focusSet = null;

  // ✅ أظهر الإحصائيات العامة + اخفِ شريط التركيز
  $('statsBar').classList.remove('hidden');
  $('focusBanner').classList.add('hidden');

  render();
  requestAnimationFrame(fitToScreen);
  setTimeout(fitToScreen, 250);
  toast('↩ تم الخروج من وضع التركيز');
}

/* ============================================================
   10) تفاصيل الفرد
   ============================================================ */
function selectPerson(id){
  const p = state.byId.get(id);
  if(!p) return;
  state.selectedId = id;
  const depth = state.depth.get(id) || 0;

  $('pAvatar').textContent = (p.name||'؟').trim().charAt(0) || '؟';
  $('pName').textContent = p.name || 'بدون اسم';
  $('pSub').textContent = `#${p.id} • الجيل ${depth+1} • ${p.gender==='female'?'أنثى':p.gender==='male'?'ذكر':'غير محدد'}`;

  const kids = state.children.get(id) || [];
  const father = p.father_id ? state.byId.get(Number(p.father_id)) : null;

  let genderBadge = 'unknown', genderTxt = 'غير محدد';
  if(p.gender === 'male'){ genderBadge = 'male'; genderTxt = 'ذكر'; }
  else if(p.gender === 'female'){ genderBadge = 'female'; genderTxt = 'أنثى'; }

  $('pBody').innerHTML = `
    <div class="info-row"><span class="k">الـ ID</span><span class="v">#${p.id}</span></div>
    <div class="info-row"><span class="k">الحالة</span><span class="v"><span class="badge ${genderBadge}">${genderTxt}</span></span></div>
    <div class="info-row"><span class="k">الجيل</span><span class="v">${depth+1}</span></div>
    <div class="info-row"><span class="k">الأب</span><span class="v">${father?`${father.name} <span style="color:var(--muted)">(#${father.id})</span>`:'—'}</span></div>
    <div class="info-row"><span class="k">عدد الأبناء</span><span class="v">${kids.length}</span></div>
    ${p.birth_date?`<div class="info-row"><span class="k">الميلاد</span><span class="v">${p.birth_date}</span></div>`:''}
    ${p.death_date?`<div class="info-row"><span class="k">الوفاة</span><span class="v">${p.death_date}</span></div>`:''}
    ${p.notes?`<div class="info-row"><span class="k">ملاحظات</span><span class="v">${p.notes}</span></div>`:''}
    <button class="action-btn ${state.focusId===id?'exit':''}" id="btnFocusPerson">
      ${state.focusId===id?'✕ الخروج من التركيز':'🎯 التركيز على هذا الفرع'}
    </button>
    <button class="action-btn secondary" id="btnCenterPerson">📍 توسيط في الشاشة</button>
    ${father?`<button class="action-btn ghost" id="btnFindFather">👆 الذهاب إلى الأب</button>`:''}
  `;

  $('infoPanel').classList.add('open');
  render();

  $('btnFocusPerson').onclick = ()=>{
    if(state.focusId === id) exitFocus();
    else focusOn(id);
    $('infoPanel').classList.remove('open');
  };
  $('btnCenterPerson').onclick = ()=> centerOn(id);
  if(father){
    $('btnFindFather').onclick = ()=>{ selectPerson(father.id); centerOn(father.id); };
  }
}

/* ============================================================
   11) التحويل بـ CSS
   ============================================================ */
let rafPending = false;
let pendingTx = 0, pendingTy = 0, pendingScale = 1;

function applyTransform(){
  pendingTx = state.tx;
  pendingTy = state.ty;
  pendingScale = state.scale;
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    viewport.style.transform = `translate3d(${pendingTx}px, ${pendingTy}px, 0) scale(${pendingScale})`;
  });
}

/* ============================================================
   12) Fit / Center / Zoom
   ============================================================ */
function fitToScreen(){
  const g = viewport;
  if(!g) return;
  const container = document.getElementById('treeContainer');
  if(!container) return;
  const box = container.getBoundingClientRect();
  let bb;
  try{ bb = g.getBBox(); }catch{ return; }
  if(!bb.width || !bb.height) return;

  // ✅ حجز مساحة أعلى (الإحصائيات/شريط التركيز) و أسفل (الأزرار)
  const TOP_RESERVED = 65;
  const BOTTOM_RESERVED = 80;
  const SIDE_PADDING = 50;

  const availableW = box.width - SIDE_PADDING * 2;
  const availableH = box.height - TOP_RESERVED - BOTTOM_RESERVED;

  const sW = availableW / (bb.width + 40);
  const sH = availableH / (bb.height + 40);
  const s = Math.min(2.5, Math.max(MIN_SCALE, Math.min(sW, sH)));

  state.scale = s;
  state.tx = box.width / 2 - (bb.x + bb.width / 2) * s;
  state.ty = TOP_RESERVED + availableH / 2 - (bb.y + bb.height / 2) * s;
  applyTransform();
}

function centerOn(id){
  const g = viewport;
  if(!g) return;
  const nodeEl = [...g.querySelectorAll('.node')].find(el => Number(el.dataset.id) === Number(id));
  if(!nodeEl) return;
  const bb = nodeEl.getBBox();
  const container = document.getElementById('treeContainer');
  const box = container.getBoundingClientRect();
  const x = bb.x + bb.width/2;
  const y = bb.y + bb.height/2;
  const k = Math.max(state.scale, 1.2);

  state.scale = k;
  state.tx = box.width/2 - x * k;
  state.ty = box.height/2 - y * k;
  applyTransform();
}

function zoomBy(factor, cx, cy){
  const container = document.getElementById('treeContainer');
  if(!container) return;
  const box = container.getBoundingClientRect();
  if(cx == null) cx = box.width / 2;
  if(cy == null) cy = box.height / 2;
  const k0 = state.scale;
  const k1 = Math.max(MIN_SCALE, Math.min(MAX_SCALE, k0 * factor));
  const {tx, ty} = state;
  state.tx = cx - (cx - tx) * (k1/k0);
  state.ty = cy - (cy - ty) * (k1/k0);
  state.scale = k1;
  applyTransform();
}

/* ============================================================
   13) تفاعلات
   ============================================================ */
let dragging = false, last = {x:0,y:0}, pinch = null, dragMoved = false;

const container = document.getElementById('treeContainer');

svg.addEventListener('pointerdown', e => {
  if(e.target.closest('.node')) return;
  dragging = true;
  dragMoved = false;
  svg.classList.add('grabbing');
  last = {x:e.clientX, y:e.clientY};
  try{ svg.setPointerCapture(e.pointerId); }catch{}
  state.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
});

svg.addEventListener('pointermove', e => {
  if(!state.pointers.has(e.pointerId)) return;
  state.pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(state.pointers.size === 1 && dragging){
    const dx = e.clientX - last.x;
    const dy = e.clientY - last.y;
    if(Math.abs(dx) + Math.abs(dy) > 2) dragMoved = true;
    last = {x:e.clientX, y:e.clientY};
    state.tx += dx;
    state.ty += dy;
    applyTransform();
  }
});

svg.addEventListener('pointerup', e => {
  dragging = false;
  svg.classList.remove('grabbing');
  state.pointers.delete(e.pointerId);
  try{ svg.releasePointerCapture(e.pointerId); }catch{}
});
svg.addEventListener('pointercancel', e => {
  dragging = false;
  svg.classList.remove('grabbing');
  state.pointers.delete(e.pointerId);
});

svg.addEventListener('touchstart', e => {
  if(e.touches.length === 2){
    const [a,b] = e.touches;
    pinch = {
      d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY),
      cx: (a.clientX + b.clientX)/2,
      cy: (a.clientY + b.clientY)/2,
      startScale: state.scale,
      startTx: state.tx,
      startTy: state.ty,
    };
  }
}, {passive:true});

svg.addEventListener('touchmove', e => {
  if(e.touches.length === 2 && pinch){
    e.preventDefault();
    const [a,b] = e.touches;
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const box = container.getBoundingClientRect();

    const lx = pinch.cx - box.left;
    const ly = pinch.cy - box.top;

    const ptX = (lx - pinch.startTx) / pinch.startScale;
    const ptY = (ly - pinch.startTy) / pinch.startScale;

    const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinch.startScale * (d / pinch.d)));
    state.scale = newScale;
    state.tx = lx - ptX * newScale;
    state.ty = ly - ptY * newScale;
    applyTransform();
  }
}, {passive:false});

svg.addEventListener('touchend', () => { pinch = null; });

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const box = container.getBoundingClientRect();
  const cx = e.clientX - box.left;
  const cy = e.clientY - box.top;
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  zoomBy(factor, cx, cy);
}, {passive:false});

svg.addEventListener('click', e => {
  if(!e.target.closest('.node') && !dragMoved){
    $('infoPanel').classList.remove('open');
  }
});

/* ============================================================
   14) البحث
   ============================================================ */
const searchInput = $('searchInput');
let searchTimer = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const q = searchInput.value.trim();
    $('searchBox').classList.toggle('has-value', q.length > 0);

    state.searchMatches.clear();
    if(!q){ render(); return; }

    const lowerQ = q.toLowerCase();
    state.people.forEach(p => {
      const nameMatch = (p.name || '').toLowerCase().includes(lowerQ);
      const idMatch = String(p.id).includes(q.replace('#', ''));
      if(nameMatch || idMatch) state.searchMatches.add(Number(p.id));
    });

    if(state.searchMatches.size === 0){
      toast('🔍 لا توجد نتائج');
      render();
      return;
    }
    render();
    if(state.searchMatches.size === 1){
      const id = [...state.searchMatches][0];
      setTimeout(()=>centerOn(id), 100);
      toast(`🔍 ${state.byId.get(id)?.name} (#${id})`);
    }else{
      toast(`🔍 ${state.searchMatches.size} نتيجة`);
    }
  }, 250);
});

$('clearSearch').onclick = () => {
  searchInput.value = '';
  searchInput.dispatchEvent(new Event('input'));
  searchInput.focus();
};

/* ============================================================
   15) إحصائيات عامة
   ============================================================ */
function updateStats(){
  $('st-people').textContent = state.people.length;
  $('st-gens').textContent = state.maxGen + 1;
  $('st-roots').textContent = state.roots.length;
}

/* ============================================================
   16) أزرار
   ============================================================ */
$('btn-fit').onclick = () => fitToScreen();
$('btn-zoom-in').onclick = () => zoomBy(1.3);
$('btn-zoom-out').onclick = () => zoomBy(1/1.3);
$('btn-reset').onclick = () => {
  state.tx = 0; state.ty = 0; state.scale = 1;
  applyTransform();
};
$('btn-up').onclick = () => { state.ty += 150; applyTransform(); };
$('btn-down').onclick = () => { state.ty -= 150; applyTransform(); };
$('closePanel').onclick = () => $('infoPanel').classList.remove('open');
$('exitFocusBtn').onclick = exitFocus;

$('btn-theme').onclick = () => {
  state.dark = !state.dark;
  document.documentElement.classList.toggle('dark', state.dark);
  $('btn-theme').textContent = state.dark ? '☀️' : '🌙';
  try{ localStorage.setItem('ft-theme', state.dark ? 'dark' : 'light'); }catch{}
};

try{
  const saved = localStorage.getItem('ft-theme');
  if(saved === 'dark'){
    state.dark = true;
    document.documentElement.classList.add('dark');
    $('btn-theme').textContent = '☀️';
  }
}catch{}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if($('infoPanel').classList.contains('open')) $('infoPanel').classList.remove('open');
    else if(state.focusId != null) exitFocus();
  }
  if(e.key === 'f' || e.key === 'F') fitToScreen();
  if(e.key === '+' || e.key === '=') zoomBy(1.2);
  if(e.key === '-') zoomBy(1/1.2);
});

/* ============================================================
   17) Toast
   ============================================================ */
let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ============================================================
   18) Resize
   ============================================================ */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { render(); fitToScreen(); }, 250);
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => { render(); fitToScreen(); }, 350);
});

/* ============================================================
   19) 🛡️ منع التصوير والطباعة
   ============================================================ */
(function protect(){
  // 1) منع الطباعة
  window.addEventListener('beforeprint', (e) => {
    e.preventDefault(); e.stopPropagation();
    protectMsg('🔒 الطباعة معطلة');
    return false;
  }, true);
  window.print = function(){ protectMsg('🔒 الطباعة معطلة'); return false; };

  // 2) اختصارات
  document.addEventListener('keydown', (e) => {
    const key = e.key ? e.key.toLowerCase() : '';
    const ctrl = e.ctrlKey || e.metaKey;
    const shift = e.shiftKey;

    if(ctrl && key === 'p'){ e.preventDefault(); e.stopPropagation(); protectMsg('🔒 الطباعة معطلة'); return false; }
    if(ctrl && key === 's'){ e.preventDefault(); e.stopPropagation(); protectMsg('💾 الحفظ معطل'); return false; }
    if(ctrl && shift && key === 's'){ e.preventDefault(); e.stopPropagation(); protectMsg('📸 التصوير معطل'); return false; }
    if(ctrl && key === 'a'){
      const tag = document.activeElement?.tagName;
      if(tag !== 'INPUT' && tag !== 'TEXTAREA'){ e.preventDefault(); return false; }
    }
    if(e.key === 'F12' || e.keyCode === 123){ e.preventDefault(); e.stopPropagation(); protectMsg('🚫 أدوات المطور معطلة'); return false; }
    if(ctrl && shift && ['i','j','c'].includes(key)){ e.preventDefault(); e.stopPropagation(); protectMsg('🚫 أدوات المطور معطلة'); return false; }
    if(ctrl && key === 'u'){ e.preventDefault(); e.stopPropagation(); return false; }
    if(e.key === 'PrintScreen' || e.keyCode === 44){
      e.preventDefault();
      try{ navigator.clipboard.writeText(''); }catch(_){}
      protectMsg('📸 التصوير معطل'); return false;
    }
    if(e.metaKey && e.shiftKey && ['3','4','5'].includes(key)){
      e.preventDefault(); e.stopPropagation();
      protectMsg('📸 التصوير معطل'); return false;
    }
  }, true);

  document.addEventListener('keyup', (e) => {
    if(e.key === 'PrintScreen' || e.keyCode === 44){
      e.preventDefault();
      try{ navigator.clipboard.writeText(''); }catch(_){}
      protectMsg('📸 التصوير معطل'); return false;
    }
  }, true);

  // 3) قائمة الزر الأيمن
  document.addEventListener('contextmenu', (e) => {
    e.preventDefault(); e.stopPropagation();
    protectMsg('🚫 القائمة معطلة'); return false;
  }, true);

  // 4) السحب
  document.addEventListener('dragstart', (e) => { e.preventDefault(); return false; }, true);

  // 5) إخفاء عند تبديل التطبيق
  document.addEventListener('visibilitychange', () => {
    if(document.hidden) document.body.classList.add('protect-blur');
    else setTimeout(() => document.body.classList.remove('protect-blur'), 300);
  });

  // 6) كشف DevTools
  let devtoolsOpen = false;
  setInterval(() => {
    const threshold = 160;
    const wD = window.outerWidth - window.innerWidth;
    const hD = window.outerHeight - window.innerHeight;
    if(wD > threshold || hD > threshold){
      if(!devtoolsOpen){
        devtoolsOpen = true;
        protectMsg('🚫 أدوات المطور مكتشفة');
        document.body.classList.add('protect-blur');
      }
    } else if(devtoolsOpen){
      devtoolsOpen = false;
      document.body.classList.remove('protect-blur');
    }
  }, 1000);

  // 7) النسخ
  document.addEventListener('copy', (e) => {
    const tag = document.activeElement?.tagName;
    if(tag !== 'INPUT' && tag !== 'TEXTAREA'){
      e.preventDefault();
      try{ e.clipboardData?.setData('text/plain',''); }catch(_){}
      protectMsg('📋 النسخ معطل');
      return false;
    }
  }, true);

  document.addEventListener('cut', (e) => {
    const tag = document.activeElement?.tagName;
    if(tag !== 'INPUT' && tag !== 'TEXTAREA'){ e.preventDefault(); return false; }
  }, true);

  // 8) رسالة
  let msgTimer = null;
  function protectMsg(text){
    let msg = document.getElementById('_protect_msg');
    if(!msg){
      msg = document.createElement('div');
      msg.id = '_protect_msg';
      msg.style.cssText = `
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(.9);
        background: linear-gradient(135deg, #dc2626, #b91c1c);
        color: #fff; padding: 16px 26px; border-radius: 14px;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        font-size: 15px; font-weight: 800;
        box-shadow: 0 20px 60px rgba(220,38,38,.5);
        z-index: 2147483647; opacity: 0;
        transition: opacity .25s ease, transform .25s ease;
        pointer-events: none; direction: rtl; text-align: center;
        max-width: 90vw;
      `;
      document.body.appendChild(msg);
    }
    msg.textContent = text;
    msg.style.opacity = '1';
    msg.style.transform = 'translate(-50%, -50%) scale(1)';
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => {
      msg.style.opacity = '0';
      msg.style.transform = 'translate(-50%, -50%) scale(.9)';
    }, 1800);
  }

  // 9) منع selectstart
  document.addEventListener('selectstart', (e) => {
    const tag = e.target?.tagName;
    if(tag !== 'INPUT' && tag !== 'TEXTAREA'){ e.preventDefault(); return false; }
  }, true);

  // 10) console warning
  console.log('%c🔒 هذا الموقع محمي ضد التصوير والطباعة',
    'color:#dc2626;font-size:16px;font-weight:900;padding:8px;');
})();

/* ============================================================
   20) انطلاق

loadData();
</script>
