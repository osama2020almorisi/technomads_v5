<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>تسجيل الدخول - TechNomads</title>
    <link rel="stylesheet" href="../css/customer.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .auth-screen {
            min-height: 100vh;
            background: linear-gradient(180deg, #6366f1 0%, #8b5cf6 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            position: relative;
            overflow: hidden;
            padding: 0 20px 30px;
        }
        .auth-screen::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            top: -150px;
            left: -100px;
        }
        .auth-screen::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            bottom: 100px;
            right: -80px;
        }
        .auth-hero {
            text-align: center;
            color: white;
            padding: 40px 20px 20px;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }
        .auth-hero-icon {
            width: 90px;
            height: 90px;
            background: rgba(255,255,255,0.2);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .auth-hero h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 6px;
        }
        .auth-hero p {
            opacity: 0.9;
            font-size: 15px;
        }
        .auth-card {
            background: white;
            border-radius: 30px 30px 0 0;
            padding: 30px 24px 20px;
            width: 100%;
            max-width: 480px;
            z-index: 1;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.12);
            animation: slideUp 0.5s ease forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .auth-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 2px;
        }
        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 15px;
            color: var(--gray);
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            cursor: pointer;
            transition: var(--transition);
            background: none;
            border: none;
            font-family: inherit;
        }
        .auth-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .auth-tab:active {
            transform: scale(0.95);
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 13px;
            color: var(--dark);
        }
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 15px;
            transition: var(--transition);
            background: var(--white);
            color: var(--dark);
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
        }
        .form-input::placeholder {
            color: var(--gray-light);
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .form-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--gray);
            cursor: pointer;
        }
        .form-options label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }
        .form-options a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }
        .form-options a:active {
            opacity: 0.7;
        }
        .btn-auth {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 800;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 16px rgba(99,102,241,0.3);
        }
        .btn-auth:active {
            transform: scale(0.97);
        }
        .btn-auth:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .btn-auth i {
            margin-left: 8px;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
            color: var(--gray);
            font-size: 13px;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .social-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .social-btn {
            flex: 1;
            padding: 12px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            transition: var(--transition);
            background: white;
            font-family: inherit;
            cursor: pointer;
        }
        .social-btn:active {
            transform: scale(0.95);
            background: var(--light);
        }
        .social-btn.google { color: #DB4437; }
        .social-btn.facebook { color: #1877F2; }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--gray);
        }
        .auth-footer a {
            color: var(--primary);
            font-weight: 800;
            text-decoration: none;
        }
        .auth-footer a:active {
            opacity: 0.7;
        }
        .custom-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 14px 28px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 14px;
            z-index: 9999;
            box-shadow: var(--shadow-lg);
            transition: transform 0.3s ease;
            font-family: 'Tajawal', sans-serif;
            text-align: center;
            max-width: 90%;
            color: white;
        }
        .custom-toast.success { background: #10b981; }
        .custom-toast.error { background: #ef4444; }
        .custom-toast.info { background: #6366f1; }
        @media (max-width: 480px) {
            .auth-card {
                padding: 24px 16px 16px;
                border-radius: 24px 24px 0 0;
            }
            .auth-hero h1 {
                font-size: 24px;
            }
            .auth-hero-icon {
                width: 70px;
                height: 70px;
                font-size: 30px;
            }
            .social-btn {
                font-size: 12px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-screen">
        <div class="auth-hero">
            <div class="auth-hero-icon">
                <i class="fas fa-truck-fast"></i>
            </div>
            <h1>TechNomads</h1>
            <p>توصيل سريع وآمن لكل مكان</p>
        </div>

        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">تسجيل الدخول</button>
                <button class="auth-tab" onclick="switchTab('register')">إنشاء حساب</button>
            </div>

            <div class="tab-content active" id="loginTab">
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">رقم الهاتف</label>
                        <input type="tel" class="form-input" placeholder="+967 770 200 970" required id="loginPhone" value="+967 770 200 970">
                    </div>
                    <div class="form-group">
                        <label class="form-label">كلمة المرور</label>
                        <input type="password" class="form-input" placeholder="••••••••" required id="loginPassword" value="123456">
                    </div>
                    <div class="form-options">
                        <label>
                            <input type="checkbox" checked id="rememberMe">
                            <span>تذكرني</span>
                        </label>
                        <a href="#" onclick="showToast('سيتم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني', 'info')">نسيت كلمة المرور؟</a>
                    </div>
                    <button type="submit" class="btn-auth" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                    </button>
                </form>
                <div class="auth-divider">أو</div>
                <div class="social-buttons">
                    <button class="social-btn google" onclick="socialLogin('google')">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button class="social-btn facebook" onclick="socialLogin('facebook')">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </button>
                </div>
                <div class="auth-footer">
                    <p>ليس لديك حساب؟ <a href="#" onclick="switchTab('register')">سجل الآن</a></p>
                </div>
            </div>

            <div class="tab-content" id="registerTab">
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label">الاسم الكامل</label>
                        <input type="text" class="form-input" placeholder="محمد عبدالله" required id="registerName" value="محمد عبدالله">
                    </div>
                    <div class="form-group">
                        <label class="form-label">رقم الهاتف</label>
                        <input type="tel" class="form-input" placeholder="+967 770 200 970" required id="registerPhone" value="+967 770 200 970">
                    </div>
                    <div class="form-group">
                        <label class="form-label">البريد الإلكتروني</label>
                        <input type="email" class="form-input" placeholder="example@email.com" id="registerEmail" value="mohamed@email.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">المنطقة</label>
                        <select class="form-input" required id="registerZone">
                            <option value="">اختر المنطقة</option>
                            <option value="صنعاء" selected>صنعاء</option>
                            <option value="عدن">عدن</option>
                            <option value="تعز">تعز</option>
                            <option value="الحديدة">الحديدة</option>
                            <option value="إب">إب</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">كلمة المرور</label>
                        <input type="password" class="form-input" placeholder="••••••••" required id="registerPassword" value="123456">
                    </div>
                    <div class="form-group">
                        <label class="form-label">تأكيد كلمة المرور</label>
                        <input type="password" class="form-input" placeholder="••••••••" required id="registerConfirm" value="123456">
                    </div>
                    <div class="form-options" style="justify-content:flex-start;">
                        <label>
                            <input type="checkbox" required id="registerTerms" checked>
                            <span>أوافق على <a href="#" style="color:var(--primary); font-weight:700; text-decoration:none;">الشروط والأحكام</a></span>
                        </label>
                    </div>
                    <button type="submit" class="btn-auth" id="registerBtn">
                        <i class="fas fa-user-plus"></i> إنشاء حساب
                    </button>
                </form>
                <div class="auth-divider">أو</div>
                <div class="social-buttons">
                    <button class="social-btn google" onclick="socialLogin('google')">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button class="social-btn facebook" onclick="socialLogin('facebook')">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </button>
                </div>
                <div class="auth-footer">
                    <p>لديك حساب بالفعل؟ <a href="#" onclick="switchTab('login')">تسجيل الدخول</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            const tabs = document.querySelectorAll('.auth-tab');
            if (tab === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('loginTab').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('registerTab').classList.add('active');
            }
        }

        function showToast(message, type = 'info') {
            const existing = document.querySelector('.custom-toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `custom-toast ${type}`;
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
            toast.innerHTML = `<i class="fas ${icons[type] || icons.info}" style="margin-left:8px;"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.transform = 'translateX(-50%) translateY(0)'; }, 10);
            setTimeout(() => { toast.style.transform = 'translateX(-50%) translateY(-100px)'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('loginBtn');
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!phone || !password) {
                showToast('يرجى ملء جميع الحقول', 'error');
                return;
            }
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الدخول...';
            setTimeout(() => {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userName', 'محمد عبدالله');
                localStorage.setItem('userPhone', phone);
                showToast('مرحباً بك في TechNomads!', 'success');
                setTimeout(() => { window.location.href = 'home.html'; }, 800);
            }, 1500);
        }

        function handleRegister(event) {
            event.preventDefault();
            const btn = document.getElementById('registerBtn');
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerConfirm').value;
            const name = document.getElementById('registerName').value.trim();
            const phone = document.getElementById('registerPhone').value.trim();
            if (password !== confirm) {
                showToast('كلمة المرور غير متطابقة', 'error');
                return;
            }
            if (password.length < 6) {
                showToast('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
                return;
            }
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإنشاء...';
            setTimeout(() => {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userName', name || 'مستخدم');
                localStorage.setItem('userPhone', phone);
                showToast('تم إنشاء الحساب بنجاح!', 'success');
                setTimeout(() => { window.location.href = 'home.html'; }, 800);
            }, 1500);
        }

        function socialLogin(provider) {
            const names = { google: 'Google', facebook: 'Facebook' };
            showToast(`جاري تسجيل الدخول عبر ${names[provider]}...`, 'info');
            setTimeout(() => {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userName', 'مستخدم');
                showToast('تم تسجيل الدخول بنجاح!', 'success');
                setTimeout(() => { window.location.href = 'home.html'; }, 800);
            }, 1500);
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'home.html';
            }
        });
    </script>
</body>
</html>
