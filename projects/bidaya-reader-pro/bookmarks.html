<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العلامات — بداية ريدر برو</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#c79b3b"><link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<header class="topbar" role="banner">
  <a href="index.html" class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="#c79b3b" stroke-width="1.8"><circle cx="16" cy="16" r="13"/><path d="M9 13.5 16 17l7-3.5v7L16 24l-7-3.5z"/></svg><span>بداية ريدر برو</span></a>
  <nav role="navigation"><a href="bookmarks.html" class="active">العلامات</a></nav>
  <div class="spacer"></div>
  <button class="icon-btn" id="theme-toggle" aria-label="المظهر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>
<main class="main" style="max-width:820px">
  <div class="page-header"><h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1"/></svg> علاماتي المرجعية</h1></div>
  <div id="bm-list" aria-live="polite"></div>
</main>
<script src="js/db.js"></script><script src="js/store.js"></script><script src="js/ui.js"></script>
<script>
(async () => {
  await Store.init(); UI.initThemeToggle();
  const list = document.getElementById("bm-list");
  async function load() {
    list.innerHTML = "";
    const bms = (await DB.all("bookmarks")).sort((a, b) => b.created_at - a.created_at);
    if (!bms.length) {
      list.innerHTML = `<div class="empty-state"><h3>لا توجد علامات</h3><p>أضف علامات أثناء القراءة من زر العلامة في شريط القارئ</p></div>`;
      return;
    }
    for (const bm of bms) {
      const book = await DB.get("books", bm.book_id);
      const ch = await DB.get("chapters", bm.chapter_id);
      const card = document.createElement("div");
      card.className = "card";
      card.style.cssText = "display:flex;align-items:center;gap:14px;margin-bottom:12px;padding:16px 18px";
      card.innerHTML = `<div style="flex:1;min-width:0">
          <strong style="display:block">${TextUtil.esc(bm.note || "علامة")}</strong>
          <small style="color:var(--text-secondary)">${TextUtil.esc(book?.title || "كتاب محذوف")} · ${TextUtil.esc(ch?.title || "")} · ${TextUtil.timeAgo(bm.created_at)}</small>
        </div>
        <a class="btn btn-primary btn-sm" href="reader.html?book=${bm.book_id}&chapter=${bm.chapter_id}">فتح</a>
        <button class="btn btn-outline btn-sm del">حذف</button>`;
      card.querySelector(".del").onclick = async () => {
        if (!(await UI.confirmDialog("حذف علامة", "حذف هذه العلامة المرجعية؟", "حذف"))) return;
        await DB.del("bookmarks", bm.id);
        load();
        UI.toast("تم الحذف", "success", 1500);
      };
      list.appendChild(card);
    }
  }
  await load();
})();
</script>
<script src="js/pwa.js"></script>
</body>
</html>
