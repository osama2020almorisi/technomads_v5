<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القارئ — بداية ريدر برو</title>
<meta name="description" content="قارئ الكتب التراثية">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#c79b3b">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/reader.css"><link rel="stylesheet" href="css/mobile.css"><link rel="stylesheet" href="css/print.css">
</head>
<body>
<header class="topbar" role="banner">
  <a href="index.html" class="logo" aria-label="الرئيسية">
    <svg viewBox="0 0 32 32" fill="none" stroke="#c79b3b" stroke-width="1.8"><circle cx="16" cy="16" r="13"/><path d="M9 13.5 16 17l7-3.5v7L16 24l-7-3.5z"/></svg>
    <span>بداية ريدر برو</span></a>
  <div class="spacer"></div>
  <button class="icon-btn" id="theme-toggle" aria-label="تبديل المظهر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>

<div class="reader-toolbar" role="toolbar" aria-label="أدوات القارئ">
  <button class="icon-btn" id="toc-toggle" aria-label="الفهرس" title="الفهرس"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  <span class="sep"></span>
  <button class="font-size-btn" id="font-dec" title="تصغير الخط">A-</button>
  <button class="font-size-btn" id="font-inc" title="تكبير الخط">A+</button>
  <span class="sep"></span>
  <button class="icon-btn" id="quick-search-btn" title="بحث في الكتاب" aria-label="بحث في الكتاب"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.3-4.3"/></svg></button>
  <button class="icon-btn" id="bookmark-btn" title="إضافة علامة" aria-label="إضافة علامة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1"/></svg></button>
  <button class="icon-btn" id="print-btn" title="طباعة" aria-label="طباعة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg></button>
  <a class="icon-btn" id="edit-link" title="تحرير هذا الكتاب" aria-label="تحرير"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></a>
  <span class="page-info" id="page-info"></span>
</div>

<div class="reader-layout">
  <aside class="reader-toc" id="reader-toc" aria-label="فهرس الكتاب">
    <h3 id="toc-book-title"></h3>
    <nav id="toc-list" role="navigation"></nav>
  </aside>
  <div class="reader-content font-reader" id="reader-content" tabindex="0">
    <div class="reader-page" id="reader-page"></div>
    <nav class="chapter-nav" aria-label="التنقل بين الفصول">
      <button id="prev-chapter">→ الفصل السابق</button>
      <button id="next-chapter">الفصل التالي ←</button>
    </nav>
  </div>
</div>

<nav class="reader-mobile-nav" aria-label="تنقل الجوال">
  <button id="m-toc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>الفهرس</button>
  <button id="m-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>السابق</button>
  <button id="m-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>التالي</button>
  <button id="m-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>بحث</button>
</nav>

<script src="js/db.js"></script><script src="js/store.js"></script><script src="js/ui.js"></script>
<script>
/* ═══ منطق القارئ ═══ */
(async () => {
  await Store.init(); UI.initThemeToggle();
  const bookId = Number(new URLSearchParams(location.search).get("book"));
  const urlChapter = Number(new URLSearchParams(location.search).get("chapter")) || null;
  if (!bookId) { location.href = "library.html"; return; }
  const book = await DB.get("books", bookId);
  if (!book) { UI.toast("الكتاب غير موجود", "error"); location.href = "library.html"; return; }
  document.title = book.title + " — بداية ريدر برو";
  document.getElementById("toc-book-title").textContent = book.title;
  document.getElementById("edit-link").href = `editor.html?book=${bookId}`;

  const tree = await BookAPI.getChapterTree(bookId);
  const flat = BookAPI.flattenTree(tree);
  if (!flat.length) { UI.toast("هذا الكتاب فارغ — حرّره أولاً", "warning"); location.href = `editor.html?book=${bookId}`; return; }

  const tocList = document.getElementById("toc-list");
  const pageEl = document.getElementById("reader-page");
  const contentEl = document.getElementById("reader-content");
  const pageInfo = document.getElementById("page-info");
  let currentIdx = 0, abortCtrl = null;

  // بناء الفهرس
  flat.forEach((ch, i) => {
    const a = document.createElement("button");
    a.className = "toc-item d" + Math.min(4, ch.depth);
    a.textContent = ch.title;
    a.setAttribute("role", "link");
    a.onclick = () => { showChapter(i); closePanels(); };
    a.dataset.idx = i;
    tocList.appendChild(a);
  });

  function applyReaderSettings() {
    pageEl.style.fontSize = Store.get("fontSize") + "px";
    pageEl.style.lineHeight = Store.get("lineHeight");
  }
  applyReaderSettings();

  async function showChapter(idx, restoreScroll = null) {
    idx = Math.max(0, Math.min(flat.length - 1, idx));
    currentIdx = idx;
    const ch = flat[idx];
    // تفعيل الفهرس
    tocList.querySelectorAll(".toc-item").forEach((el) => el.classList.toggle("active", Number(el.dataset.idx) === idx));
    const act = tocList.querySelector(".toc-item.active");
    if (act) act.scrollIntoView({ block: "nearest" });
    // التقدم المحفوظ
    let progress = null;
    try { progress = await DB.get("progress", [bookId, ch.id]); } catch (_) {}
    const pages = await BookAPI.getPages(ch.id);
    // العنوان + الصفحات
    pageEl.innerHTML = `<h2 class="reader-chapter-title">${TextUtil.esc(ch.title)}</h2>` +
      pages.map((p) => `<div class="rpage">${p.content}</div>`).join("");
    pageInfo.textContent = `الفصل ${idx + 1} من ${flat.length} · ${pages.length} صفحة`;
    document.getElementById("prev-chapter").disabled = idx === 0;
    document.getElementById("next-chapter").disabled = idx === flat.length - 1;
    contentEl.scrollTop = restoreScroll ?? (progress?.scroll_y || 0);
    if (!restoreScroll) contentEl.scrollIntoView();
    // حفظ التقدم + السجل
    await DB.put("progress", { book_id: bookId, chapter_id: ch.id, page_index: 0, scroll_y: contentEl.scrollTop, updated_at: Date.now() });
    await DB.add("history", { book_id: bookId, chapter_id: ch.id, visited_at: Date.now() });
    history.replaceState(null, "", `reader.html?book=${bookId}&chapter=${ch.id}`);
  }

  // حفظ موضع التمرير
  let scrollTimer;
  contentEl.addEventListener("scroll", () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const ch = flat[currentIdx];
      if (ch) DB.put("progress", { book_id: bookId, chapter_id: ch.id, page_index: 0, scroll_y: contentEl.scrollTop, updated_at: Date.now() }).catch(() => {});
    }, 800);
  });

  // التنقل
  const nav = (d) => showChapter(currentIdx + d);
  document.getElementById("prev-chapter").onclick = () => nav(-1);
  document.getElementById("next-chapter").onclick = () => nav(1);
  document.getElementById("m-prev").onclick = () => nav(-1);
  document.getElementById("m-next").onclick = () => nav(1);
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input,textarea")) return;
    if (e.key === "ArrowLeft") nav(1);          // RTL: اليسار = التالي
    if (e.key === "ArrowRight") nav(-1);
  });

  // اللوحات
  const toc = document.getElementById("reader-toc");
  const closePanels = () => toc.classList.remove("open");
  document.getElementById("toc-toggle").onclick = () => toc.classList.toggle("open");
  document.getElementById("m-toc").onclick = () => toc.classList.toggle("open");

  // حجم الخط
  document.getElementById("font-inc").onclick = async () => { await Store.set("fontSize", Math.min(32, Store.get("fontSize") + 1)); applyReaderSettings(); };
  document.getElementById("font-dec").onclick = async () => { await Store.set("fontSize", Math.max(13, Store.get("fontSize") - 1)); applyReaderSettings(); };

  // علامة مرجعية
  document.getElementById("bookmark-btn").onclick = async () => {
    const ch = flat[currentIdx];
    const note = await UI.promptDialog("إضافة علامة مرجعية", "ملاحظة (اختياري)", ch.title);
    if (note === null) return;
    await DB.add("bookmarks", { book_id: bookId, chapter_id: ch.id, note, created_at: Date.now() });
    UI.toast("تمت إضافة العلامة", "success");
  };

  // الطباعة (فصل حالي أو الكتاب كامل عبر خيار)
  document.getElementById("print-btn").onclick = () => {
    UI.modal({
      title: "طباعة",
      body: `<div class="check-row"><input type="radio" name="pscope" value="chapter" id="ps1" checked><label for="ps1">الفصل الحالي فقط</label></div>
             <div class="check-row" style="margin-top:8px"><input type="radio" name="pscope" value="book" id="ps2"><label for="ps2">الكتاب كاملاً مع الفهرس</label></div>`,
      actions: [{ label: "إلغاء", class: "btn-outline" },
        { label: "🖨️ طباعة", class: "btn-primary", onClick: (el) => {
          const scope = el.querySelector("input[name=pscope]:checked").value;
          printBook(scope);
        }}],
    });
  };

  async function printBook(scope) {
    const win = document.createElement("div");
    win.id = "print-root";
    win.innerHTML = `<div class="book-print-header"><h1>${TextUtil.esc(book.title)}</h1>
      ${book.author ? `<p class="print-meta">${TextUtil.esc(book.author)}</p>` : ""}</div>`;
    if (scope === "book") {
      const tocOl = document.createElement("div");
      tocOl.innerHTML = "<h2>الفهرس</h2><ol>" +
        flat.map((c) => `<li style="margin-inline-start:${c.depth * 16}px">${TextUtil.esc(c.title)}</li>`).join("") + "</ol>";
      win.appendChild(tocOl);
    }
    const list = scope === "chapter" ? [flat[currentIdx]] : flat;
    for (const c of list) {
      const pages = await BookAPI.getPages(c.id);
      const sec = document.createElement("section");
      sec.innerHTML = `<h1 class="reader-chapter-title" style="page-break-before:always">${TextUtil.esc(c.title)}</h1>` +
        pages.map((p) => `<div style="page-break-inside:avoid">${p.content}</div>`).join("");
      win.appendChild(sec);
    }
    const orig = document.getElementById("reader-content");
    const backup = orig.innerHTML;
    orig.innerHTML = ""; orig.appendChild(win);
    orig.classList.add("printing");
    setTimeout(() => { window.print(); setTimeout(() => { orig.innerHTML = backup; showChapter(currentIdx, contentEl.scrollTop); }, 500); }, 300);
  }

  // البحث السريع داخل الكتاب
  document.getElementById("quick-search-btn").onclick = openQuickSearch;
  document.getElementById("m-search").onclick = openQuickSearch;
  function openQuickSearch() {
    const m = UI.modal({
      title: "البحث في الكتاب",
      dismissible: true,
      body: `<div class="search-box"><input class="input" id="qs-input" placeholder="اكتب كلمة أو عبارة…" style="flex:1"></div>
             <div class="quick-search-results" id="qs-results" style="margin-top:14px"></div>`,
      actions: [{ label: "إغلاق", class: "btn-outline" }],
    });
    const inp = m.el.querySelector("#qs-input");
    const box = m.el.querySelector("#qs-results");
    let t;
    inp.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => runQuickSearch(inp.value.trim(), box), 250);
    });
    inp.focus();
  }
  async function runQuickSearch(query, box) {
    if (abortCtrl) abortCtrl.abort();
    if (!query) { box.innerHTML = ""; return; }
    abortCtrl = new AbortController();
    const q = TextUtil.normalizeArabic(query);
    box.innerHTML = `<div style="text-align:center;padding:14px"><div class="spinner" style="margin:0 auto"></div></div>`;
    const results = [];
    try {
      for (let i = 0; i < flat.length; i++) {
        if (abortCtrl.signal.aborted) return;
        const pages = await BookAPI.getPages(flat[i].id);
        for (const p of pages) {
          const plain = TextUtil.stripHtml(p.content);
          const norm = TextUtil.normalizeArabic(plain);
          let pos = norm.indexOf(q);
          while (pos !== -1 && results.length < 50) {
            const approx = Math.round(pos * (plain.length / Math.max(1, norm.length)));
            const start = Math.max(0, approx - 60), end = Math.min(plain.length, approx + q.length + 60);
            results.push({ chIdx: i, chapter: flat[i].title, snippet: plain.slice(start, end), query });
            pos = norm.indexOf(q, pos + q.length);
          }
        }
        if (i % 10 === 0) await new Promise((r) => setTimeout(r)); // إتاحة الرسم
      }
      if (abortCtrl.signal.aborted) return;
      box.innerHTML = results.length ? "" : `<p style="color:var(--text-muted);text-align:center;padding:14px">لا نتائج</p>`;
      results.forEach((r) => {
        const div = document.createElement("div");
        div.className = "result-item";
        const escQ = TextUtil.esc(query);
        div.innerHTML = `<small style="color:var(--gold);font-weight:700">${TextUtil.esc(r.chapter)}</small><br>` +
          TextUtil.esc(r.snippet).replace(new RegExp(escQ.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (mm) => `<mark>${mm}</mark>`);
        div.onclick = () => { m_close(); showChapter(r.chIdx); };
        box.appendChild(div);
      });
    } catch (_) {}
    function m_close() { m.close(); }
  }

  // الفصل الابتدائي: من الرابط أو آخر تقدم
  let startIdx = 0;
  if (urlChapter) startIdx = Math.max(0, flat.findIndex((c) => c.id === urlChapter));
  else {
    try {
      const allProg = await DB.all("progress");
      const mine = allProg.filter((p) => p.book_id === bookId).sort((a, b) => b.updated_at - a.updated_at)[0];
      if (mine) startIdx = Math.max(0, flat.findIndex((c) => c.id === mine.chapter_id));
    } catch (_) {}
  }
  showChapter(startIdx);
})();
</script>
<script src="js/pwa.js"></script>
</body>
</html>
