<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التصدير والطباعة — بداية ريدر برو</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#c79b3b"><link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<header class="topbar" role="banner">
  <a href="index.html" class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="#c79b3b" stroke-width="1.8"><circle cx="16" cy="16" r="13"/><path d="M9 13.5 16 17l7-3.5v7L16 24l-7-3.5z"/></svg><span>بداية ريدر برو</span></a>
  <nav role="navigation"><a href="export.html" class="active">التصدير</a></nav>
  <div class="spacer"></div>
  <button class="icon-btn" id="theme-toggle" aria-label="المظهر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>
<main class="main" style="max-width:860px">
  <div class="page-header"><h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15V3m0 12-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg> التصدير والطباعة</h1></div>
  <div class="card" style="margin-bottom:20px">
    <div class="field"><label>اختر الكتاب</label><select class="select" id="export-book"></select></div>
    <label class="check-row"><input type="checkbox" id="opt-toc" checked> تضمين الفهرس (EPUB/HTML)</label>
    <h3 style="margin:18px 0 10px;font-size:1rem">صيغة التصدير</h3>
    <div class="cards-grid" id="format-grid"></div>
  </div>
  <div class="card">
    <h3 style="margin-bottom:10px;font-size:1rem">🖨️ الطباعة المنسّقة (A4)</h3>
    <p style="font-size:.85rem;color:var(--text-secondary);margin-bottom:12px">طباعة فصل واحد أو نطاق فصول أو الكتاب كاملاً مع فهرس وترقيم صفحات</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <select class="select" id="print-scope" style="width:auto">
        <option value="all">الكتاب كاملاً</option>
        <option value="range">نطاق فصول</option>
      </select>
      <span id="range-box" class="hidden" style="display:flex;gap:6px;align-items:center">
        من <select class="select" id="range-from" style="width:auto"></select>
        إلى <select class="select" id="range-to" style="width:auto"></select>
      </span>
      <label class="check-row"><input type="checkbox" id="print-toc" checked> فهرس تلقائي</label>
      <button class="btn btn-primary" id="print-btn">🖨️ طباعة</button>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
<script src="js/db.js"></script><script src="js/store.js"></script><script src="js/ui.js"></script>
<script src="js/exporter/json-export.js"></script><script src="js/exporter/epub-export.js"></script>
<script src="js/exporter/html-export.js"></script><script src="js/exporter/txt-export.js"></script>
<script src="js/exporter/pdf-export.js"></script><script src="js/exporter/docx-export.js"></script>
<script src="js/exporter/index.js"></script>
<script>
(async () => {
  await Store.init(); UI.initThemeToggle();
  const sel = document.getElementById("export-book");
  const books = await DB.all("books");
  const pre = Number(new URLSearchParams(location.search).get("book"));
  books.forEach((b) => {
    const o = document.createElement("option"); o.value = b.id; o.textContent = b.title;
    if (b.id === pre) o.selected = true;
    sel.appendChild(o);
  });
  if (!books.length) sel.innerHTML = '<option value="">لا توجد كتب</option>';

  // بطاقات الصيغ
  const grid = document.getElementById("format-grid");
  Object.entries(Exporter.FORMATS).forEach(([key, f]) => {
    const card = document.createElement("button");
    card.className = "card";
    card.style.cssText = "text-align:right;cursor:pointer;transition:.2s";
    card.innerHTML = `<div style="font-size:1.6rem;margin-bottom:6px">${f.icon}</div>
      <strong>${f.label}</strong><p style="font-size:.8rem;color:var(--text-secondary);margin-top:4px">${f.desc}</p>`;
    card.onmouseenter = () => { card.style.borderColor = "var(--gold)"; card.style.boxShadow = "var(--shadow-gold)"; };
    card.onmouseleave = () => { card.style.borderColor = ""; card.style.boxShadow = ""; };
    card.onclick = async () => {
      const bookId = Number(sel.value);
      if (!bookId) { UI.toast("اختر كتاباً أولاً", "warning"); return; }
      try { await Exporter.exportBook(bookId, key, { withToc: document.getElementById("opt-toc").checked }); }
      catch (_) {}
    };
    grid.appendChild(card);
  });

  // قوائم نطاق الطباعة
  async function fillRanges() {
    const from = document.getElementById("range-from"), to = document.getElementById("range-to");
    from.innerHTML = ""; to.innerHTML = "";
    const bookId = Number(sel.value);
    if (!bookId) return;
    const flat = BookAPI.flattenTree(await BookAPI.getChapterTree(bookId));
    flat.forEach((c) => {
      const o1 = document.createElement("option"); o1.value = c.id; o1.textContent = c.title; from.appendChild(o1);
      const o2 = o1.cloneNode(true); to.appendChild(o2);
    });
    if (to.options.length) to.selectedIndex = to.options.length - 1;
  }
  fillRanges();
  sel.onchange = fillRanges;
  document.getElementById("print-scope").onchange = (e) =>
    document.getElementById("range-box").classList.toggle("hidden", e.target.value !== "range");

  document.getElementById("print-btn").onclick = async () => {
    const bookId = Number(sel.value);
    if (!bookId) { UI.toast("اختر كتاباً أولاً", "warning"); return; }
    const book = await DB.get("books", bookId);
    const tree = await BookAPI.getChapterTree(bookId);
    let flat = BookAPI.flattenTree(tree);
    const scope = document.getElementById("print-scope").value;
    if (scope === "range") {
      const a = Number(document.getElementById("range-from").value), b = Number(document.getElementById("range-to").value);
      const ia = flat.findIndex((c) => c.id === a), ib = flat.findIndex((c) => c.id === b);
      flat = flat.slice(Math.min(ia, ib), Math.max(ia, ib) + 1);
    }
    const win = window.open("", "_blank");
    let body = `<div class="book-print-header"><h1>${TextUtil.esc(book.title)}</h1>${book.author ? `<p class="print-meta">${TextUtil.esc(book.author)}</p>` : ""}</div>`;
    if (document.getElementById("print-toc").checked)
      body += `<div style="page-break-after:always"><h2>الفهرس</h2><ol style="list-style:none;padding:0">` +
        flat.map((c) => `<li style="margin-inline-start:${c.depth * 16}px;margin-bottom:4px">${TextUtil.esc(c.title)}</li>`).join("") + "</ol></div>";
    for (const c of flat) {
      const pages = await BookAPI.getPages(c.id);
      body += `<h1 class="reader-chapter-title" style="page-break-before:always">${TextUtil.esc(c.title)}</h1>` +
        pages.map((p) => `<div style="page-break-inside:avoid">${p.content}</div>`).join("");
    }
    win.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><title>${TextUtil.esc(book.title)}</title>
<style>@page{size:A4;margin:2cm;@bottom-center{content:counter(page) " / " counter(pages)}}
body{font-family:"Noto Naskh Arabic","Amiri",serif;line-height:2;direction:rtl;color:#1a1a2e}
h1.reader-chapter-title{font-family:"Amiri",serif;page-break-after:avoid;border-bottom:2px solid #c79b3b;padding-bottom:8px}
p,blockquote,li{page-break-inside:avoid}blockquote{border-right:4px solid #c79b3b;background:#faf6ea;padding:10px 20px}
.book-print-header{text-align:center;border-bottom:3px double #c79b3b;padding-bottom:14px;margin-bottom:20px}</style></head><body>${body}</body></html>`);
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 600);
  };
})();
</script>
<script src="js/pwa.js"></script>
</body>
</html>
