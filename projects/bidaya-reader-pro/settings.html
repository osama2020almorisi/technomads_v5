<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعدادات — بداية ريدر برو</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#c79b3b"><link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<header class="topbar" role="banner">
  <a href="index.html" class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="#c79b3b" stroke-width="1.8"><circle cx="16" cy="16" r="13"/><path d="M9 13.5 16 17l7-3.5v7L16 24l-7-3.5z"/></svg><span>بداية ريدر برو</span></a>
  <nav role="navigation"><a href="settings.html" class="active">الإعدادات</a></nav>
  <div class="spacer"></div>
  <button class="icon-btn" id="theme-toggle" aria-label="المظهر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>
<main class="main" style="max-width:760px">
  <div class="page-header"><h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1"/></svg> الإعدادات</h1></div>
  <div class="settings-grid">
    <div class="card">
      <h3 style="margin-bottom:14px">المظهر</h3>
      <div class="field"><label>نمط الألوان</label>
        <select class="select" id="set-theme">
          <option value="light">نهاري</option><option value="dark">ليلي</option><option value="system">حسب النظام</option>
        </select></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:14px">القارئ</h3>
      <div class="field"><label>حجم الخط: <span id="fs-val"></span>px</label>
        <input type="range" id="set-fontsize" min="13" max="32" step="1" style="width:100%;accent-color:var(--gold)"></div>
      <div class="field"><label>تباعد الأسطر</label>
        <select class="select" id="set-lineheight"><option value="1.8">ضيّق</option><option value="2.1">وسط</option><option value="2.5">واسع</option></select></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:14px">المحرر</h3>
      <div class="field"><label>الحفظ التلقائي كل (ثانية)</label>
        <input type="number" class="input" id="set-autosave" min="5" max="300"></div>
      <div class="check-row"><input type="checkbox" id="set-printtoc" checked> إظهار الفهرس في الطباعة</div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:14px">إدارة البيانات</h3>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn btn-outline btn-sm" id="backup-all">⬇️ نسخة احتياطية (JSON لكل الكتب)</button>
        <button class="btn btn-danger btn-sm" id="wipe-all">🗑️ مسح جميع البيانات</button>
        <p style="font-size:.75rem;color:var(--text-muted)" id="storage-info"></p>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="js/db.js"></script><script src="js/store.js"></script><script src="js/ui.js"></script>
<script src="js/exporter/json-export.js"></script>
<script>
(async () => {
  await Store.init(); UI.initThemeToggle();
  const $ = (id) => document.getElementById(id);
  $("set-theme").value = Store.get("theme");
  $("set-theme").onchange = async (e) => { await Store.set("theme", e.target.value); UI.toast("تم تغيير المظهر", "success", 1500); };
  const fs = $("set-fontsize");
  fs.value = Store.get("fontSize");
  $("fs-val").textContent = Store.get("fontSize");
  fs.oninput = () => { $("fs-val").textContent = fs.value; };
  fs.onchange = async () => { await Store.set("fontSize", Number(fs.value)); };
  $("set-lineheight").value = String(Store.get("lineHeight"));
  $("set-lineheight").onchange = async (e) => await Store.set("lineHeight", Number(e.target.value));
  $("set-autosave").value = Store.get("autoSaveInterval");
  $("set-autosave").onchange = async (e) => await Store.set("autoSaveInterval", Number(e.target.value));
  $("set-printtoc").checked = Store.get("printWithToc");
  $("set-printtoc").onchange = async (e) => await Store.set("printWithToc", e.target.checked);

  // معلومات التخزين
  try {
    const est = await navigator.storage.estimate();
    $("storage-info").textContent = `المساحة المستخدمة: ${TextUtil.formatNum(est.usage || 0)} بايت من ${TextUtil.formatNum(est.quota || 0)} بايت`;
  } catch (_) {}

  $("backup-all").onclick = async () => {
    const loading = UI.showLoading("إنشاء النسخة الاحتياطية…");
    try {
      const books = await DB.all("books");
      const out = [];
      for (const b of books) {
        const blob = await JsonExport.export(b.id);
        out.push({ name: b.title.replace(/[\\/:*?"<>|]/g, "_") + ".json", blob });
      }
      if (out.length === 1) { UI.downloadBlob(out[0].blob, out[0].name); }
      else {
        const zip = new JSZip();
        for (const f of out) zip.file(f.name, f.blob);
        const zb = await zip.generateAsync({ type: "blob" });
        UI.downloadBlob(zb, "bidaya-backup.zip");
      }
      loading.hide();
      UI.toast(`تم تصدير ${out.length} كتاب`, "success");
    } catch (e) { loading.hide(); UI.toast("خطأ: " + e.message, "error"); }
  };

  $("wipe-all").onclick = async () => {
    const ok = await UI.confirmDialog("مسح جميع البيانات", "سيتم حذف كل الكتب والعلامات والإعدادات نهائياً من هذا المتصفح. لا يمكن التراجع!", "مسح كل شيء");
    if (!ok) return;
    for (const s of ["books", "chapters", "pages", "bookmarks", "history", "progress", "settings", "collections"]) {
      try { await DB.clear(s); } catch (_) {}
    }
    UI.toast("تم مسح جميع البيانات", "success");
    setTimeout(() => location.href = "index.html", 1200);
  };
})();
</script>
<script src="js/pwa.js"></script>

</body>
</html>
