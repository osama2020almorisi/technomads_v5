<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل القراءة — بداية ريدر برو</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#c79b3b"><link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<header class="topbar" role="banner">
  <a href="index.html" class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="#c79b3b" stroke-width="1.8"><circle cx="16" cy="16" r="13"/><path d="M9 13.5 16 17l7-3.5v7L16 24l-7-3.5z"/></svg><span>بداية ريدر برو</span></a>
  <nav role="navigation"><a href="history.html" class="active">السجل</a></nav>
  <div class="spacer"></div>
  <button class="icon-btn" id="theme-toggle" aria-label="المظهر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>
<main class="main" style="max-width:820px">
  <div class="page-header"><h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 3"/></svg> سجل القراءة</h1>
    <button class="btn btn-danger btn-sm" id="clear-history">مسح السجل</button></div>
  <div id="history-list" aria-live="polite"></div>
</main>
<script src="js/db.js"></script><script src="js/store.js"></script><script src="js/ui.js"></script>
<script>
(async () => {
  await Store.init(); UI.initThemeToggle();
  const list = document.getElementById("history-list");
  async function load() {
    list.innerHTML = "";
    // تجميع آخر زيارة لكل فصل
    const hist = await DB.all("history");
    const latest = new Map();
    hist.forEach((h) => {
      const k = h.chapter_id;
      if (!latest.has(k) || h.visited_at > latest.get(k).visited_at) latest.set(k, h);
    });
    const rows = [...latest.values()].sort((a, b) => b.visited_at - a.visited_at).slice(0, 100);
    if (!rows.length) {
      list.innerHTML = `<div class="empty-state"><h3>السجل فارغ</h3><p>ستظهر هنا فصولك التي قرأتها</p></div>`;
      return;
    }
    for (const h of rows) {
      const book = await DB.get("books", h.book_id);
      const ch = await DB.get("chapters", h.chapter_id);
      if (!book || !ch) continue;
      const card = document.createElement("a");
      card.className = "card";
      card.href = `reader.html?book=${h.book_id}&chapter=${h.chapter_id}`;
      card.style.cssText = "display:flex;align-items:center;gap:14px;margin-bottom:10px;padding:14px 18px";
      card.innerHTML = `<div style="flex:1"><strong>${TextUtil.esc(ch.title)}</strong><br>
        <small style="color:var(--text-secondary)">${TextUtil.esc(book.title)} · ${TextUtil.timeAgo(h.visited_at)}</small></div>
        <span style="color:var(--gold)">← متابعة</span>`;
      list.appendChild(card);
    }
  }
  document.getElementById("clear-history").onclick = async () => {
    if (!(await UI.confirmDialog("مسح السجل", "سيتم مسح كامل سجل القراءة نهائياً.", "مسح"))) return;
    await DB.clear("history");
    load();
    UI.toast("تم مسح السجل", "success");
  };
  await load();
})();
</script>
<script src="js/pwa.js"></script>
</body>
</html>
