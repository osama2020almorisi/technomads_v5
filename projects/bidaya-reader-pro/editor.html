<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحرر — بداية ريدر برو</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#c79b3b"><link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/editor.css"><link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<header class="topbar" role="banner">
  <button class="icon-btn menu-toggle" id="tree-toggle" aria-label="فهرس الفصول"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  <a href="index.html" class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="#c79b3b" stroke-width="1.8"><circle cx="16" cy="16" r="13"/><path d="M9 13.5 16 17l7-3.5v7L16 24l-7-3.5z"/></svg><span>المحرر</span></a>
  <div class="spacer"></div>
  <button class="icon-btn" id="theme-toggle" aria-label="المظهر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>

<div class="editor-layout">
  <aside class="editor-tree" id="editor-tree" aria-label="شجرة الفصول">
    <h3>فصول الكتاب
      <div class="tree-actions">
        <button class="icon-btn" id="add-root-btn" title="فصل رئيسي جديد" style="width:30px;height:30px"><b style="font-size:1.1rem">＋</b></button>
      </div>
    </h3>
    <div id="tree-root" style="flex:1;overflow-y:auto"></div>
  </aside>

  <div class="editor-main">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h1 id="editor-book-title" style="font-size:1.3rem;flex:1"></h1>
      <button class="btn btn-outline btn-sm" id="find-replace-btn">بحث واستبدال</button>
      <button class="btn btn-primary btn-sm" id="save-btn">💾 حفظ</button>
    </div>

    <div class="editor-toolbar" role="toolbar" aria-label="تنسيق النص">
      <button data-cmd="undo" title="تراجع">↩</button>
      <button data-cmd="redo" title="إعادة">↪</button>
      <span class="sep"></span>
      <button data-cmd="bold" title="غامق"><b>ب</b></button>
      <button data-cmd="italic" title="مائل"><i>م</i></button>
      <button data-cmd="underline" title="تسطير"><u>ت</u></button>
      <span class="sep"></span>
      <button data-block="h1" title="عنوان 1">H1</button>
      <button data-block="h2" title="عنوان 2">H2</button>
      <button data-block="h3" title="عنوان 3">H3</button>
      <button data-block="p" title="فقرة">¶</button>
      <span class="sep"></span>
      <button data-cmd="insertUnorderedList" title="قائمة">• قائمة</button>
      <button data-cmd="insertOrderedList" title="قائمة مرقمة">1. قائمة</button>
      <button id="btn-quote" title="اقتباس">❝ اقتباس</button>
      <button id="btn-hr" title="فاصل">―</button>
      <span class="sep"></span>
      <button data-cmd="justifyRight" title="محاذاة لليمين">⇥</button>
      <button data-cmd="justifyCenter" title="توسيط">⇹</button>
      <button data-cmd="justifyFull" title="ضبط">⇤⇥</button>
      <button data-cmd="removeFormat" title="إزالة التنسيق">✕ تنسيق</button>
    </div>

    <div class="pages-strip" id="pages-strip" aria-label="صفحات الفصل"></div>
    <div class="rich-editor" id="rich-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="محتوى الصفحة" spellcheck="false"></div>

    <div class="editor-status">
      <span class="save-state saved" id="save-state">✓ محفوظ</span>
      <span id="stat-words">0 كلمة</span>
      <span id="stat-chars">0 حرف</span>
      <span id="stat-chapter-info"></span>
      <span style="margin-inline-start:auto;font-size:.75rem;color:var(--text-muted)">حفظ تلقائي كل <span id="autosave-label"></span> ثانية</span>
    </div>
  </div>
</div>

<script src="js/db.js"></script><script src="js/store.js"></script><script src="js/ui.js"></script>
<script>
/* ═══ منطق المحرر الكامل ═══ */
(async () => {
  await Store.init(); UI.initThemeToggle();
  const bookId = Number(new URLSearchParams(location.search).get("book"));
  if (!bookId) { location.href = "library.html"; return; }
  const book = await DB.get("books", bookId);
  if (!book) { location.href = "library.html"; return; }
  document.getElementById("editor-book-title").textContent = "تحرير: " + book.title;
  document.title = "تحرير " + book.title;

  const treeRoot = document.getElementById("tree-root");
  const pagesStrip = document.getElementById("pages-strip");
  const editor = document.getElementById("rich-editor");
  const saveState = document.getElementById("save-state");
  let tree = [], flat = [], selChapter = null, selPage = null, dirty = false;
  let undoStack = [], redoStack = [];

  document.getElementById("autosave-label").textContent = Store.get("autoSaveInterval");
  document.getElementById("tree-toggle").onclick = () => document.getElementById("editor-tree").classList.toggle("open");

  async function reloadTree(keepSel = true) {
    tree = await BookAPI.getChapterTree(bookId);
    flat = BookAPI.flattenTree(tree);
    renderTree();
    if (keepSel && selChapter && flat.find((c) => c.id === selChapter.id)) selectChapter(selChapter.id, true);
    else if (flat.length) selectChapter(flat[0].id);
    else { selChapter = null; editor.innerHTML = ""; renderPages(); updateStats(); }
  }

  function renderTree() {
    treeRoot.innerHTML = "";
    const build = (nodes, container, parentId) => {
      nodes.forEach((n) => {
        const row = document.createElement("div");
        row.className = "tree-item" + (selChapter?.id === n.id ? " selected" : "");
        row.draggable = true;
        row.dataset.id = n.id;
        row.innerHTML = `<span class="drag-handle" title="اسحب لإعادة الترتيب">⠿</span>
          <span class="tree-title">${TextUtil.esc(n.title)}</span>
          <span class="tree-btns">
            <button class="add-child" title="فصل فرعي">＋</button>
            <button class="rename" title="تغيير العنوان">✎</button>
            <button class="del del-btn" title="حذف">🗑</button>
          </span>`;
        row.querySelector(".tree-title").onclick = () => selectChapter(n.id);
        row.querySelector(".add-child").onclick = async (e) => { e.stopPropagation(); await addChapter(n.id); };
        row.querySelector(".rename").onclick = async (e) => { e.stopPropagation(); await renameChapter(n); };
        row.querySelector(".del-btn").onclick = async (e) => { e.stopPropagation(); await deleteChapter(n); };
        setupDnD(row, n);
        container.appendChild(row);
        if (n.children.length) {
          const kids = document.createElement("div");
          kids.className = "tree-children";
          build(n.children, kids, n.id);
          container.appendChild(kids);
        }
      });
    };
    build(tree, treeRoot, null);
  }

  // ─── السحب والإفلات لإعادة ترتيب الفصول ───
  function setupDnD(row, node) {
    row.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", String(node.id));
      row.classList.add("dragging");
    });
    row.addEventListener("dragend", () => { row.classList.remove("dragging"); treeRoot.querySelectorAll(".drop-above,.drop-into").forEach((x) => x.classList.remove("drop-above", "drop-into")); });
    row.addEventListener("dragover", (e) => {
      e.preventDefault();
      const rect = row.getBoundingClientRect();
      const rel = (e.clientY - rect.top) / rect.height;
      row.classList.remove("drop-above", "drop-into");
      if (rel < 0.3) row.classList.add("drop-above");
      else if (rel > 0.7 && node.children.length === 0 && flat.filter((c) => c.parent_id === node.id).length === 0) row.classList.add("drop-into");
      else row.classList.add("drop-above");
    });
    row.addEventListener("dragleave", () => row.classList.remove("drop-above", "drop-into"));
    row.addEventListener("drop", async (e) => {
      e.preventDefault(); e.stopPropagation();
      const dragId = Number(e.dataTransfer.getData("text/plain"));
      if (!dragId || dragId === node.id) return;
      const mode = row.classList.contains("drop-into") ? "into" : "above";
      row.classList.remove("drop-above", "drop-into");
      try {
        const dragCh = await DB.get("chapters", dragId);
        if (!dragCh) return;
        if (mode === "into") {
          // منع الدورة: لا يمكن جعل فصل ابناً لنفسه أو لأحد أحفاده
          let p = node;
          while (p) { if (p.id === dragId) { UI.toast("لا يمكن نقل فصل داخل نفسه", "warning"); return; } p = flat.find((c) => c.id === p.parent_id); }
          dragCh.parent_id = node.id;
          dragCh.order_num = 999;
          await DB.put("chapters", dragCh);
          await BookAPI.renumberSiblings(bookId, node.id);
        } else {
          dragCh.parent_id = node.parent_id;
          dragCh.order_num = node.order_num - 0.5; // يتقدمه
          await DB.put("chapters", dragCh);
          await BookAPI.renumberSiblings(bookId, node.parent_id);
        }
        await reloadTree();
        UI.toast("تمت إعادة الترتيب", "success", 1500);
      } catch (err) { UI.toast("خطأ في النقل: " + err.message, "error"); }
    });
  }

  // ─── عمليات الفصول ───
  async function addChapter(parentId = null) {
    const title = await UI.promptDialog("فصل جديد", "عنوان الفصل", parentId ? "فصل فرعي جديد" : "فصل جديد");
    if (!title) return;
    try {
      await saveCurrentPage(true);
      const ch = { book_id: bookId, parent_id: parentId, title, order_num: 999, depth: 0 };
      const id = await DB.add("chapters", ch);
      await BookAPI.renumberSiblings(bookId, parentId);
      await DB.add("pages", { chapter_id: id, page_num: 1, word_count: 0, content: "<p></p>" });
      await BookAPI.updateBookStats(bookId);
      await reloadTree(false);
      selectChapter(id);
      UI.toast("تمت إضافة الفصل", "success", 1500);
    } catch (e) { UI.toast("خطأ: " + e.message, "error"); }
  }
  document.getElementById("add-root-btn").onclick = () => addChapter(null);

  async function renameChapter(n) {
    const t = await UI.promptDialog("تغيير عنوان الفصل", "العنوان الجديد", n.title);
    if (!t || t === n.title) return;
    n.title = t;
    await DB.put("chapters", n);
    renderTree();
    UI.toast("تم تغيير العنوان", "success", 1500);
  }

  async function deleteChapter(n) {
    const countChildren = (id) => flat.filter((c) => c.parent_id === id).length;
    const kids = countChildren(n.id);
    const msg = kids ? `«${n.title}» يحتوي على ${kids} فصول تابعة. حذفها أيضاً؟` : `حذف «${n.title}» نهائياً؟`;
    const ok = await UI.confirmDialog("حذف فصل", msg, "حذف");
    if (!ok) return;
    try {
      await saveCurrentPage(true);
      // حذف الفصل وكل أحفاده
      const toDelete = [n.id];
      let i = 0;
      while (i < toDelete.length) {
        flat.filter((c) => c.parent_id === toDelete[i]).forEach((c) => toDelete.push(c.id));
        i++;
      }
      for (const cid of toDelete) {
        const pgs = await DB.byIndex("pages", "chapter_id", cid);
        for (const p of pgs) await DB.del("pages", p.id);
        await DB.byIndex("bookmarks", "chapter_id", cid).then((bs) => bs.forEach((b) => DB.del("bookmarks", b.id)));
        await DB.del("progress", [bookId, cid]);
        await DB.del("chapters", cid);
      }
      await BookAPI.renumberSiblings(bookId, n.parent_id);
      await BookAPI.updateBookStats(bookId);
      selChapter = null;
      await reloadTree(false);
      UI.toast("تم الحذف", "success", 1500);
    } catch (e) { UI.toast("خطأ في الحذف: " + e.message, "error"); }
  }

  // ─── اختيار فصل وصفحاته ───
  async function selectChapter(id, keepPage = false) {
    await saveCurrentPage(true);
    selChapter = flat.find((c) => c.id === id);
    renderTree();
    if (!keepPage) selPage = null;
    await renderPages();
    const pages = await BookAPI.getPages(id);
    if (!selPage || !pages.find((p) => p.id === selPage.id)) selPage = pages[0] || null;
    loadPageIntoEditor();
    document.getElementById("editor-tree").classList.remove("open");
  }

  async function renderPages() {
    pagesStrip.innerHTML = "";
    if (!selChapter) return;
    const pages = await BookAPI.getPages(selChapter.id);
    document.getElementById("stat-chapter-info").textContent = `«${selChapter.title}» · ${pages.length} صفحة`;
    pages.forEach((p, i) => {
      const chip = document.createElement("div");
      chip.className = "page-chip" + (selPage?.id === p.id ? " active" : "");
      chip.draggable = true;
      chip.innerHTML = `صفحة ${i + 1}${pages.length > 1 ? ' <span class="del-page" title="حذف الصفحة">✕</span>' : ""}`;
      chip.onclick = async (e) => { if (e.target.classList.contains("del-page")) return; await saveCurrentPage(true); selPage = p; renderPages(); loadPageIntoEditor(); };
      if (pages.length > 1) chip.querySelector(".del-page").onclick = async (e) => {
        e.stopPropagation();
        const ok = await UI.confirmDialog("حذف صفحة", `حذف صفحة ${i + 1} من «${selChapter.title}»؟`, "حذف");
        if (!ok) return;
        await DB.del("pages", p.id);
        // إعادة ترقيم
        const rest = (await BookAPI.getPages(selChapter.id));
        for (let j = 0; j < rest.length; j++) { rest[j].page_num = j + 1; await DB.put("pages", rest[j]); }
        selPage = null;
        await renderPages();
        const ps = await BookAPI.getPages(selChapter.id);
        selPage = ps[0] || null;
        loadPageIntoEditor();
        await BookAPI.updateBookStats(bookId);
      };
      // سحب لترتيب الصفحات
      chip.addEventListener("dragstart", (ev) => ev.dataTransfer.setData("page", String(p.id)));
      chip.addEventListener("dragover", (ev) => ev.preventDefault());
      chip.addEventListener("drop", async (ev) => {
        ev.preventDefault();
        const dragId = Number(ev.dataTransfer.getData("page"));
        if (!dragId || dragId === p.id) return;
        const all = await BookAPI.getPages(selChapter.id);
        const from = all.findIndex((x) => x.id === dragId);
        const to = all.findIndex((x) => x.id === p.id);
        const [moved] = all.splice(from, 1);
        all.splice(to, 0, moved);
        for (let j = 0; j < all.length; j++) { all[j].page_num = j + 1; await DB.put("pages", all[j]); }
        renderPages();
        UI.toast("تم ترتيب الصفحات", "success", 1200);
      });
      pagesStrip.appendChild(chip);
    });
    // زر إضافة صفحة
    const add = document.createElement("div");
    add.className = "page-chip";
    add.style.borderStyle = "dashed";
    add.textContent = "＋ صفحة";
    add.onclick = async () => {
      await saveCurrentPage(true);
      const all = await BookAPI.getPages(selChapter.id);
      const np = { chapter_id: selChapter.id, page_num: all.length + 1, word_count: 0, content: "<p></p>" };
      np.id = await DB.add("pages", np);
      selPage = np;
      await renderPages();
      loadPageIntoEditor();
      await BookAPI.updateBookStats(bookId);
    };
    pagesStrip.appendChild(add);
  }

  function loadPageIntoEditor() {
    undoStack = []; redoStack = [];
    editor.innerHTML = selPage ? selPage.content : "";
    updateStats();
    setDirty(false);
    editor.focus();
  }

  // ─── الإحصائيات ───
  function updateStats() {
    const words = TextUtil.wordCount(editor.innerHTML);
    document.getElementById("stat-words").textContent = TextUtil.formatNum(words) + " كلمة";
    document.getElementById("stat-chars").textContent = TextUtil.formatNum(TextUtil.charCount(editor.innerHTML)) + " حرف";
  }

  function setDirty(v) {
    dirty = v;
    saveState.textContent = v ? "● تغييرات غير محفوظة" : "✓ محفوظ";
    saveState.className = "save-state " + (v ? "unsaved" : "saved");
  }

  // ─── الحفظ ───
  async function saveCurrentPage(silent = false) {
    if (!selPage || !dirty) return;
    try {
      const content = editor.innerHTML;
      selPage.content = content;
      selPage.word_count = TextUtil.wordCount(content);
      await DB.put("pages", selPage);
      setDirty(false);
      updateStats();
      if (!silent) UI.toast("تم الحفظ", "success", 1500);
    } catch (e) { UI.toast("فشل الحفظ: " + e.message, "error"); }
  }
  document.getElementById("save-btn").onclick = () => saveCurrentPage(false);
  setInterval(() => { if (dirty) saveCurrentPage(true); }, Math.max(5, Store.get("autoSaveInterval")) * 1000);
  window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  // ─── تراجع / إعادة ───
  function snapshot() { undoStack.push(editor.innerHTML); if (undoStack.length > 60) undoStack.shift(); redoStack = []; }
  editor.addEventListener("input", () => {
    if (!dirty) snapshot(); else if (!undoStack.length || undoStack[undoStack.length - 1] !== editor.innerHTML) { /* التقط كل تغيير جوهري */ }
    setDirty(true); updateStats();
  });
  document.querySelector('[data-cmd="undo"]').onclick = () => {
    if (!undoStack.length) return;
    redoStack.push(editor.innerHTML);
    editor.innerHTML = undoStack.pop();
    setDirty(true); updateStats();
  };
  document.querySelector('[data-cmd="redo"]').onclick = () => {
    if (!redoStack.length) return;
    undoStack.push(editor.innerHTML);
    editor.innerHTML = redoStack.pop();
    setDirty(true); updateStats();
  };

  // ─── أدوات التنسيق ───
  document.querySelectorAll(".editor-toolbar [data-cmd]").forEach((btn) => {
    if (["undo", "redo"].includes(btn.dataset.cmd)) return;
    btn.onclick = () => { editor.focus(); document.execCommand(btn.dataset.cmd, false, null); setDirty(true); updateStats(); };
  });
  document.querySelectorAll(".editor-toolbar [data-block]").forEach((btn) => {
    btn.onclick = () => { editor.focus(); document.execCommand("formatBlock", false, "<" + btn.dataset.block + ">"); setDirty(true); };
  });
  document.getElementById("btn-quote").onclick = () => {
    editor.focus(); document.execCommand("formatBlock", false, "<blockquote>"); setDirty(true);
  };
  document.getElementById("btn-hr").onclick = () => {
    editor.focus(); document.execCommand("insertHTML", false, "<hr><p><br></p>"); setDirty(true);
  };

  // ─── بحث واستبدال داخل الكتاب ───
  document.getElementById("find-replace-btn").onclick = () => {
    UI.modal({
      title: "بحث واستبدال في الكتاب",
      body: `<div class="find-replace">
        <input class="input" id="fr-find" placeholder="ابحث عن…">
        <input class="input" id="fr-replace" placeholder="استبدل بـ…">
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-outline btn-sm" id="fr-find-btn">بحث</button>
        <button class="btn btn-primary btn-sm" id="fr-replace-btn">استبدال الكل</button>
      </div>
      <div id="fr-results" style="margin-top:14px;max-height:40vh;overflow-y:auto"></div>`,
      actions: [{ label: "إغلاق", class: "btn-outline" }],
      onClose: () => reloadTree(),
    });
    document.getElementById("fr-find-btn").onclick = () => doFind(false);
    document.getElementById("fr-replace-btn").onclick = () => doFind(true);
  };
  async function doFind(doReplace) {
    const find = document.getElementById("fr-find").value.trim();
    if (!find) return;
    const rep = document.getElementById("fr-replace").value;
    const resBox = document.getElementById("fr-results");
    await saveCurrentPage(true);
    const q = TextUtil.normalizeArabic(find);
    let count = 0;
    resBox.innerHTML = "";
    for (const ch of flat) {
      const pages = await BookAPI.getPages(ch.id);
      for (const p of pages) {
        const norm = TextUtil.normalizeArabic(TextUtil.stripHtml(p.content));
        if (!norm.includes(q)) continue;
        count++;
        const div = document.createElement("div");
        div.className = "result-item";
        div.innerHTML = `<small style="color:var(--gold);font-weight:700">${TextUtil.esc(ch.title)} · صفحة ${p.page_num}</small>`;
        div.onclick = () => { selectChapter(ch.id); selPage = p; renderPages(); loadPageIntoEditor(); };
        resBox.appendChild(div);
        if (doReplace) {
          // استبدال حساس للنص الظاهر مع الحفاظ على HTML
          const tmp = document.createElement("div");
          tmp.innerHTML = p.content;
          const escRe = new RegExp(find.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g");
          tmp.querySelectorAll("*").forEach((el) => {
            el.childNodes.forEach((nd) => {
              if (nd.nodeType === 3) nd.textContent = nd.textContent.replace(escRe, rep);
            });
          });
          p.content = tmp.innerHTML;
          p.word_count = TextUtil.wordCount(p.content);
          await DB.put("pages", p);
        }
      }
    }
    if (doReplace) { UI.toast(`تم الاستبدال في ${count} موضع`, "success"); await BookAPI.updateBookStats(bookId); }
    if (!count) resBox.innerHTML = `<p style="color:var(--text-muted);text-align:center">لا نتائج</p>`;
  }

  await reloadTree(false);
  UI.toast("اختر فصلاً من الشجرة لبدء التحرير", "info", 3000);
})();
</script>
<script src="js/pwa.js"></script>
</body>
</html>
