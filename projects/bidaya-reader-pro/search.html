<main class="main">

  <div class="card" style="margin-bottom:20px">
    <div class="search-box">
      <input class="input" id="adv-q" type="search" placeholder="مثال: علم AND حديث -ضعيف  أو  عبارة بين علامتي تنصيص…" aria-label="استعلام البحث">

    </div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:.85rem;color:var(--text-secondary)">
      <label class="check-row"><input type="radio" name="mode" value="simple" checked> بسيط</label>
      <label class="check-row"><input type="radio" name="mode" value="exact"> دقيق (عبارة)</label>
      <label class="check-row"><input type="radio" name="mode" value="root"> جذور (اشتقاق)</label>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px">
      <select class="select" id="adv-book" style="width:auto" aria-label="الكتاب"><option value="all">كل الكتب</option></select>
      <select class="select" id="adv-chapter" style="width:auto" aria-label="الفصل"><option value="all">كل الفصول</option></select>
    </div>
    <p style="font-size:.75rem;color:var(--text-muted);margin-top:10px">عوامل التشغيل: <b>AND</b> لاشتراط الكلمات معاً · <b>OR</b> لأيٍّ منها · <b>-كلمة</b> لاستبعادها · التشكيل والهمزات تُطبَّع تلقائياً</p>
  </div>

  <div id="adv-status" style="color:var(--text-secondary);font-size:.88rem;margin-bottom:12px" aria-live="polite"></div>
  <div id="adv-results"></div>

</div>
<script src="js/db.js"></script><script src="js/store.js"></script><script src="js/ui.js"></script>
<script>
/* ═══ البحث المتقدم مع AbortController والتطبيع العربي ═══ */
(async () => {
  await Store.init(); UI.initSidebar(); UI.initThemeToggle();
  let abortCtrl = null;

  const bookSel = document.getElementById("adv-book");
  const chSel = document.getElementById("adv-chapter");
  const books = await DB.all("books");
  books.forEach((b) => {
    const o = document.createElement("option"); o.value = b.id; o.textContent = b.title;
    bookSel.appendChild(o);
  });
  bookSel.onchange = async () => {
    chSel.innerHTML = '<option value="all">كل الفصول</option>';
    if (bookSel.value === "all") return;
    const tree = await BookAPI.getChapterTree(Number(bookSel.value));
    BookAPI.flattenTree(tree).forEach((c) => {
      const o = document.createElement("option"); o.value = c.id; o.textContent = c.title;
      chSel.appendChild(o);
    });
  };

  // تحليل الاستعلام إلى مجموعات
  function parseQuery(raw) {
    const and = [], or = [], not = [];
    const re = /"([^"]+)"|(\S+)/g;
    let m, pendingOr = false;
    while ((m = re.exec(raw))) {
      const tok = m[1] || m[2];
      if (/^OR$/i.test(tok)) { pendingOr = true; continue; }
      if (/^AND$/i.test(tok)) { pendingOr = false; continue; }
      const target = tok.startsWith("-") ? not : pendingOr ? or : and;
      target.push(tok.startsWith("-") ? tok.slice(1) : tok);
      pendingOr = false;
    }
    return { and, or, not };
  }

  function matches(textNorm, terms, mode) {
    if (mode === "root") {
      const textRoots = textNorm.split(/\s+/);
      return terms.every((t) => {
        const root = TextUtil.rootOf(t);
        return textRoots.some((w) => w.startsWith(root.slice(0, Math.max(2, root.length - 1))));
      });
    }
    if (mode === "exact") return terms.every((t) => textNorm.includes(TextUtil.normalizeArabic(t)));
    return terms.every((t) => textNorm.includes(TextUtil.normalizeArabic(t)));
  }

  async function search() {
    if (abortCtrl) abortCtrl.abort();
    const raw = document.getElementById("adv-q").value.trim();
    const resultsBox = document.getElementById("adv-results");
    const status = document.getElementById("adv-status");
    resultsBox.innerHTML = ""; status.textContent = "";
    if (!raw) return;
    abortCtrl = new AbortController();
    const { and, or, not } = parseQuery(raw);
    if (!and.length && !or.length) { status.textContent = "أدخل كلمات للبحث"; return; }
    const mode = document.querySelector("input[name=mode]:checked").value;
    const bookFilter = bookSel.value === "all" ? null : Number(bookSel.value);
    const chFilter = chSel.value === "all" ? null : Number(chSel.value);
    const allBooks = bookFilter ? books.filter((b) => b.id === bookFilter) : books;
    status.innerHTML = `<div class="spinner" style="display:inline-block;vertical-align:middle;margin-inline-end:8px"></div> جاري البحث…`;
    const hits = [];
    try {
      for (const book of allBooks) {
        if (abortCtrl.signal.aborted) return;
        const tree = await BookAPI.getChapterTree(book.id);
        for (const ch of BookAPI.flattenTree(tree)) {
          if (chFilter && ch.id !== chFilter) continue;
          if (abortCtrl.signal.aborted) return;
          const pages = await BookAPI.getPages(ch.id);
          for (const p of pages) {
            const plain = TextUtil.stripHtml(p.content);
            const norm = TextUtil.normalizeArabic(plain);
            const okAnd = and.length ? matches(norm, and, mode) : true;
            const okOr = or.length ? or.some((t) => matches(norm, [t], mode)) : true;
            const okNot = not.length ? !not.some((t) => norm.includes(TextUtil.normalizeArabic(t))) : true;
            if ((and.length || or.length) && okAnd && okOr && okNot) {
              // مقتطف حول أول كلمة
              const anchor = TextUtil.normalizeArabic(and[0] || or[0]);
              const pos = norm.indexOf(anchor);
              const approx = Math.round(Math.max(0, pos) * (plain.length / Math.max(1, norm.length)));
              const start = Math.max(0, approx - 70), end = Math.min(plain.length, approx + 140);
              hits.push({ book, ch, page: p, snippet: plain.slice(start, end), score: (and.length + or.length) - (pos < 0 ? 5 : Math.min(4, Math.floor(pos / 200))) });
            }
          }
          await new Promise((r) => setTimeout(r)); // إتاحة الرسم
        }
      }
      if (abortCtrl.signal.aborted) return;
      hits.sort((a, b) => b.score - a.score);
      status.textContent = hits.length ? `وجدنا ${hits.length} نتيجة` : "لا نتائج مطابقة";
      const terms = [...and, ...or];
      const markRe = terms.length ? new RegExp("(" + terms.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi") : null;
      hits.slice(0, 200).forEach((h) => {
        const card = document.createElement("div");
        card.className = "card";
        card.style.cssText = "margin-bottom:12px;cursor:pointer;padding:16px 18px";
        let snippet = TextUtil.esc(h.snippet);
        if (markRe) snippet = snippet.replace(markRe, "<mark>$1</mark>");
        card.innerHTML = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">
            <span class="badge badge-gold">${TextUtil.esc(h.book.title)}</span>
            <span class="badge badge-blue">${TextUtil.esc(h.ch.title)} · صفحة ${h.page.page_num}</span></div>
          <p style="color:var(--text-secondary);font-size:.92rem;line-height:1.9">${snippet}…</p>`;
        card.onclick = () => location.href = `reader.html?book=${h.book.id}&chapter=${h.ch.id}`;
        resultsBox.appendChild(card);
      });
    } catch (e) {
      if (e.name !== "AbortError") { status.textContent = "خطأ: " + e.message; }
    }
  }
  document.getElementById("adv-btn").onclick = search;
  document.getElementById("adv-q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
})();
</script>
<script src="js/pwa.js"></script>
</body>
